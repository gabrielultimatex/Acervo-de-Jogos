        const scrapeLudopedia = async (gameTitle, customUrl = '') => {
            let targetUrl;
            if (customUrl && customUrl.trim().length > 0) {
                targetUrl = customUrl.trim();
            } else if (gameTitle) {
                let slug = gameTitle.toLowerCase()
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, "")
                    .replace(/[^a-z0-9\s-]/g, "")
                    .trim()
                    .replace(/\s+/g, "-");
                targetUrl = `https://ludopedia.com.br/jogo/${slug}`;
            } else {
                return { success: false, error: "Sem título ou link" };
            }

            const proxyGenerators = [
                (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}&timestamp=${Date.now()}`
            ];

            let htmlContent = null;
            
            for (const getProxyUrl of proxyGenerators) {
                try {
                    const response = await fetch(getProxyUrl(targetUrl));
                    if (getProxyUrl.toString().includes('allorigins')) {
                        const json = await response.json();
                        if (json.contents) htmlContent = json.contents;
                    } else {
                        htmlContent = await response.text();
                    }
                    if (htmlContent && htmlContent.length > 500 && !htmlContent.includes("404 Not Found")) {
                        break;
                    }
                } catch (e) {}
            }

            if (!htmlContent) return { success: false, error: "Falha ao acessar Ludopedia. Tente o link manual." };

            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, "text/html");

                const ogImage = doc.querySelector('meta[property="og:image"]')?.content;
                const ogDesc = doc.querySelector('meta[property="og:description"]')?.content;
                const ogTitle = doc.querySelector('meta[property="og:title"]')?.content;
                const textContent = doc.body.innerText || "";

                let min = 2, max = 4;
                const playersMatch = textContent.match(/(\d+)\s*(?:a|-)\s*(\d+)\s*jogadores/i);
                const singlePlayerMatch = textContent.match(/(\d+)\s*jogadores/i);

                if (playersMatch) {
                    min = parseInt(playersMatch[1]);
                    max = parseInt(playersMatch[2]);
                } else if (singlePlayerMatch) {
                    min = parseInt(singlePlayerMatch[1]);
                    max = min;
                }

                let time = "30";
                const timeMatch = textContent.match(/(\d+)\s*min/i);
                if (timeMatch) time = timeMatch[1];

                const extractTags = () => {
                    const rawTags = new Set();
                    const links = doc.querySelectorAll('a[href*="/mecanica/"], a[href*="/dominio/"], a[href*="/categoria/"]');
                    const blockList = ["Jogos Expert", "Jogos Família", "Jogos Infantis", "Jogos Leves", "Jogos Médios", "Jogos Pesados", "Jogos Festivos"];
                    links.forEach(link => {
                        const text = link.innerText.trim();
                        if(text && text.length > 1 && !blockList.includes(text)) {
                            rawTags.add(text);
                        }
                    });
                    return Array.from(rawTags);
                };
                
                const fetchedTags = extractTags();
                let extractedTitle = ogTitle ? ogTitle.replace(" - Ludopedia", "").trim() : gameTitle;
                const finalTags = fetchedTags.length > 0 ? fetchedTags : generateInitialTags(extractedTitle, ogDesc);

                return {
                    success: true,
                    data: {
                        title: extractedTitle || gameTitle,
                        image: ogImage || '',
                        desc: ogDesc || 'Descrição não encontrada.',
                        min, max, time,
                        tags: finalTags
                    }
                };
            } catch (error) {
                return { success: false, error: "Erro ao processar dados: " + error.message };
            }

                });

                else badges.push({ icon: '⚡', title: 'Relâmpago', color: 'text-yellow-500' });

                return badges;
            };

            // --- HELPERS ---
            const parseDate = (str) => { if(!str || str === '-') return new Date(); const [day, month, year] = str.split('/'); return new Date(year, month - 1, day); };
            const formatDate = (date) => date.toLocaleDateString('pt-BR');
            const calculateDuration = (item) => { const start = parseDate(item.loanDate); const end = item.returnDate === '-' ? new Date() : parseDate(item.returnDate); return end - start; };
            
            const getSearchUrl = (game) => {
                const query = encodeURIComponent(`${game.title} regras manual pdf ludopedia`);
                return game.manualLink || `https://www.google.com/search?q=${query}`;
            };

            const generateQRUrl = (game) => {
                const target = getSearchUrl(game);
                return `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(target)}`;
            };

            const isOverdue = (dateStr) => {
                if (!dateStr) return false;
                const [day, month, year] = dateStr.split('/');
                const due = new Date(year, month - 1, day);
                const today = new Date();
                today.setHours(0,0,0,0);
                return today > due;
            };

            const isNew = (game) => {
                if (!game.id.startsWith('g-')) return false; 
                try {
                    const parts = game.id.split('-');
                    if (parts.length < 2) return false;
                    const timestamp = parseInt(parts[1]);
                    const diff = Date.now() - timestamp;
                    return diff < (15 * 24 * 60 * 60 * 1000); // 15 dias
                } catch(e) { return false; }
            };

            const toggleTagInEdit = (tag) => {
                const currentTags = editForm.tagsString ? editForm.tagsString.split(',').map(t => t.trim()).filter(Boolean) : [];
                if (currentTags.includes(tag)) {
                    setEditForm(prev => ({...prev, tagsString: currentTags.filter(t => t !== tag).join(', ')}));
                } else {
                    setEditForm(prev => ({...prev, tagsString: [...currentTags, tag].join(', ')}));
                }
            };

            const getStorageUsage = () => {
                let total = 0;
                for(let x in localStorage) {
                    if(localStorage.hasOwnProperty(x)) total += ((localStorage[x].length + x.length) * 2);
                }
                return (total / 1024 / 1024).toFixed(2);
            };

            const filteredHistory = useMemo(() => {
                let list = [...history];
                if (historyFilter.person !== 'all') { const person = people.find(p => p.id === historyFilter.person); if (person) { const searchStr = person.name; list = list.filter(h => h.borrower.includes(searchStr)); } }
                list.sort((a, b) => {
                    if (historyFilter.sort === 'dateDesc') return parseDate(b.loanDate) - parseDate(a.loanDate);
                    if (historyFilter.sort === 'dateAsc') return parseDate(a.loanDate) - parseDate(b.loanDate);
                    if (historyFilter.sort === 'durationDesc') return calculateDuration(b) - calculateDuration(a);
                    if (historyFilter.sort === 'durationAsc') return calculateDuration(a) - calculateDuration(b);
                    return 0;
                });
                return list;
            }, [history, historyFilter, people]);

            const filteredWishlist = useMemo(() => {
                let result = wishlist.filter(g => {
                    const matchSearch = g.title.toLowerCase().includes(search.toLowerCase());
                    const matchPriority = filters.priority === 'all' || g.priority === filters.priority;
                    let matchPrice = true;
                    if (filters.maxPrice) {
                         const price = parseFloat(g.currentPrice);
                         const max = parseFloat(filters.maxPrice);
                         if (!isNaN(price) && !isNaN(max)) {
                             matchPrice = price <= max;
                         }
                    }
                    return matchSearch && matchPriority && matchPrice;
                });

                result.sort((a, b) => {
                    if (sortOrder === 'newest') {
                        const getTs = (id) => { try { return parseInt(id.split('-')[1]); } catch(e){ return 0; } };
                        return getTs(b.id) - getTs(a.id);
                    }
                    const titleA = a.title.toLowerCase();
                    const titleB = b.title.toLowerCase();
                    if (sortOrder === 'asc') return titleA.localeCompare(titleB);
                    else return titleB.localeCompare(titleA);
                });
                
                return result;
            }, [wishlist, search, filters, sortOrder]);

            const handleLoan = () => {
                if (!borrowerId) { notify("Selecione uma pessoa!", "error"); return; }
                const person = people.find(p => p.id === borrowerId);
                const borrowerName = getPersonLabel(person);
                const loanId = `loan-${Date.now()}`;
                const startDate = new Date().toLocaleDateString('pt-BR');
                
                let formattedDueDate = '';
                if (loanDueDate) {
                    const d = new Date(loanDueDate);
                    d.setMinutes(d.getMinutes() + d.getTimezoneOffset());
                    formattedDueDate = d.toLocaleDateString('pt-BR');
                }

                const updatedGame = { ...modalGame, status: 'loaned', borrower: borrowerName, loanDate: startDate, loanDueDate: formattedDueDate, loanId: loanId };
                const newHistoryItem = { id: loanId, gameTitle: modalGame.title, gameId: modalGame.id, borrower: borrowerName, loanDate: startDate, returnDate: '-', status: 'active', image: modalGame.image };
                setGames(prev => prev.map(g => g.id === modalGame.id ? updatedGame : g));
                setHistory(prev => [newHistoryItem, ...prev]);
                setModalGame(updatedGame); setBorrowerId(''); setLoanDueDate('');
                notify("Jogo emprestado com sucesso!");
            };

            const handleReturn = () => {
                const returnDate = new Date().toLocaleDateString('pt-BR');
                const updatedGame = { ...modalGame, status: 'available', borrower: '', loanDate: null, loanDueDate: null, loanId: null };
                setHistory(prev => prev.map(h => h.id === modalGame.loanId ? { ...h, returnDate: returnDate, status: 'completed' } : h));
                setGames(prev => prev.map(g => g.id === modalGame.id ? updatedGame : g));
                setModalGame(updatedGame); notify("Devolução registrada!");
            };

            const handleQuickReturn = (historyItem) => {
                if (!confirm(`Confirmar devolução de "${historyItem.gameTitle}"?`)) return;
                const returnDate = new Date().toLocaleDateString('pt-BR');
                const game = games.find(g => g.id === historyItem.gameId) || games.find(g => g.title === historyItem.gameTitle);
                setHistory(prev => prev.map(h => h.id === historyItem.id ? { ...h, returnDate: returnDate, status: 'completed' } : h));
                if (game) { const updatedGame = { ...game, status: 'available', borrower: '', loanDate: null, loanDueDate: null, loanId: null }; setGames(prev => prev.map(g => g.id === game.id ? updatedGame : g)); }
                notify("Devolução registrada via histórico!");
            };

            const saveEdit = () => {
                const tagsRaw = editForm.tagsString ? editForm.tagsString.split(',') : [];
                const tags = tagsRaw.map(t => t.trim()).filter(t => t.length > 0);
                const finalGame = { 
                    ...editForm, 
                    tags: tags.length > 0 ? tags : ['Board Game'], 
                    min: Number(editForm.min), 
                    max: Number(editForm.max),
                    rating: Number(editForm.rating || 0),
                    isExpansion: !!editForm.isExpansion,
                    baseGameId: editForm.isExpansion ? editForm.baseGameId : null,
                    sleeveDetail: editForm.sleeveDetail || ''
                };
                
                if (editForm.isWishlist) {
                     if (modalGame.id === 'new') {
                         finalGame.id = `w-${Date.now()}`;
                         setWishlist(prev => [...prev, finalGame]);
                     } else {
                         setWishlist(prev => prev.map(w => w.id === modalGame.id ? { ...modalGame, ...finalGame } : w));
                         setModalGame({ ...modalGame, ...finalGame });
                     }
                     setIsEditing(false); notify("Item da lista de desejos salvo!");
                     return;
                }

                if (modalGame.id === 'new') { finalGame.id = `g-${Date.now()}`; finalGame.status = 'available'; setGames(prev => sortGamesList([...prev, finalGame])); setModalGame(finalGame); }
                else { setGames(prev => prev.map(g => g.id === modalGame.id ? { ...modalGame, ...finalGame } : g)); setModalGame({ ...modalGame, ...finalGame }); }
                setIsEditing(false); notify("Jogo salvo!");
            };

            const handleCloudSave = async () => {
                if (!githubToken) { notify("Configure o Token do GitHub primeiro!", "error"); return; }
                const OWNER = "gabrielultimatex"; 
                const REPO = "Acervo-de-Jogos";   
                const PATH = "backup.json";
                
                setIsCloudLoading(true);
                try {
                    const getRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
                        headers: { "Authorization": `token ${githubToken}` }
                    });
                    
                    let sha = "";
                    if (getRes.ok) {
                        const getData = await getRes.json();
                        sha = getData.sha;
                    }

                    const backupData = { games, wishlist, history, people, meta: { date: new Date().toISOString(), version: "9.6" } };
                    const contentBase64 = toBase64(JSON.stringify(backupData, null, 2));

                    const putRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
                        method: "PUT",
                        headers: { "Authorization": `token ${githubToken}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ message: "Backup via MeepleStock Web v9.6", content: contentBase64, sha: sha || undefined })
                    });

                    if (putRes.ok) { notify("Backup salvo na nuvem com sucesso!", "success"); }
                    else { throw new Error("Falha no upload."); }

                } catch (error) { console.error(error); notify("Erro ao salvar no GitHub.", "error"); } 
                finally { setIsCloudLoading(false); }
            };

            const handleGitHubSync = async () => {
                if (!confirm("Isso substituirá os dados atuais pelo backup do GitHub. Continuar?")) return;
                setIsCloudLoading(true);
                try {
                    const response = await fetch('./backup.json?t=' + new Date().getTime());
                    if (!response.ok) throw new Error("Arquivo backup.json não encontrado.");
                    const parsed = await response.json();
                    if (parsed.games || parsed.history || parsed.people) {
                        if (parsed.games) setGames(parsed.games);
                        if (parsed.wishlist) setWishlist(parsed.wishlist);
                        if (parsed.history) setHistory(parsed.history);
                        if (parsed.people) setPeople(parsed.people);
                        notify("Dados restaurados da nuvem!", "success");
                        setShowSettings(false);
                    } else { notify("Backup inválido/vazio.", "error"); }
                } catch (err) { console.error(err); notify("Erro ao buscar: " + err.message, "error"); }
                finally { setIsCloudLoading(false); }
            };

            const handleExport = () => {
                const backupData = { games, wishlist, history, people, meta: { date: new Date().toISOString(), version: "9.6" } };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", `meeplestock_backup_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
                notify("Download iniciado!");
            };

            const handleImportClick = () => fileInputRef.current.click();
            const handleFileChange = (event) => {
                const fileReader = new FileReader();
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = e => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed.games || parsed.history) {
                            if(confirm("Substituir dados atuais?")) {
                                if (parsed.games) setGames(parsed.games);
                                if (parsed.wishlist) setWishlist(parsed.wishlist);
                                if (parsed.history) setHistory(parsed.history);
                                if (parsed.people) setPeople(parsed.people);
                                notify("Dados restaurados!", "success");
                                setShowSettings(false);
                            }
                        } else { notify("Arquivo inválido.", "error"); }
                    } catch (err) { notify("Erro ao ler arquivo.", "error"); }
                };
            };

            const handleCSVImportClick = () => csvInputRef.current.click();
            const handleCSVChange = (event) => {
                const fileReader = new FileReader();
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = e => {
                    try {
                        const rows = e.target.result.split('\n');
                        if (rows.length < 2) { notify("CSV vazio.", "error"); return; }
                        const headers = rows[0].toLowerCase().split(/[;,]/);
                        const titleIdx = headers.findIndex(h => h.includes('name') || h.includes('title') || h.includes('titulo'));
                        
                        if (titleIdx === -1) { notify("Coluna de título não encontrada no CSV.", "error"); return; }

                        let count = 0;
                        const newGames = [];
                        for(let i=1; i<rows.length; i++) {
                            const row = rows[i].split(/[;,]/);
                            if(row.length > titleIdx && row[titleIdx].trim()) {
                                const title = row[titleIdx].trim().replace(/^"|"$/g, ''); // remove quotes
                                if (!games.some(g => g.title === title)) {
                                    newGames.push(generateGameData(title, i));
                                    count++;
                                }
                            }
                        }
                        if (count > 0 && confirm(`Encontrados ${count} novos jogos. Importar?`)) {
                            setGames(prev => sortGamesList([...prev, ...newGames]));
                            notify(`${count} jogos importados!`, 'success');
                            setShowSettings(false);
                        } else if (count === 0) {
                            notify("Nenhum jogo novo encontrado.", "error");
                        }
                    } catch (err) { notify("Erro ao processar CSV.", "error"); }
                };
            };

            const handleDelete = () => { 
                if(modalGame.id === 'new') { setModalGame(null); return; } 
                if(confirm(`EXCLUIR "${modalGame.title}"?`)) { 
                    if (viewMode === 'wishlist') {
                        setWishlist(prev => prev.filter(w => w.id !== modalGame.id));
                    } else {
                        setGames(prev => prev.filter(g => g.id !== modalGame.id)); 
                    }
                    setModalGame(null); 
                    notify("Item excluído.", "error"); 
                } 
            };
            const clearHistory = () => { if(!confirm("Apagar APENAS concluídos?")) return; setHistory(prev => prev.filter(item => item.status === 'active')); notify("Histórico limpo."); };
            const deleteHistoryItem = (id) => { if(!confirm("Apagar registro?")) return; setHistory(prev => prev.filter(item => item.id !== id)); };

            const uniqueTags = useMemo(() => { const t = new Set(); games.forEach(g => g.tags.forEach(tag => t.add(tag))); return Array.from(t).sort(); }, [games]);
            
            const filteredGames = useMemo(() => {
                let result = games.filter(g => {
                    const matchSearch = g.title.toLowerCase().includes(search.toLowerCase());
                    const matchTag = filters.tag === 'all' || g.tags.includes(filters.tag);
                    let matchPlayers = true; if (filters.players) { const p = parseInt(filters.players); if (!isNaN(p)) matchPlayers = g.min <= p && g.max >= p; }
                    let matchTime = true; if (filters.time !== 'all') { const t = parseInt(g.time); if (!isNaN(t)) { if (filters.time === 'short') matchTime = t < 30; else if (filters.time === 'medium') matchTime = t >= 30 && t <= 60; else if (filters.time === 'long') matchTime = t > 60; } }
                    let matchRating = true; if (filters.rating !== 'all') matchRating = (g.rating || 0) >= 4;
                    return matchSearch && matchTag && matchPlayers && matchTime && matchRating;
                });
                
                result.sort((a, b) => {
                    if (sortOrder === 'newest') {
                        const getTs = (id) => { try { return parseInt(id.split('-')[1]); } catch(e){ return 0; } };
                        return getTs(b.id) - getTs(a.id);
                    }
                    const titleA = a.title.toLowerCase();
                    const titleB = b.title.toLowerCase();
                    if (sortOrder === 'asc') return titleA.localeCompare(titleB);
                    else return titleB.localeCompare(titleA);
                });

                return result;
            }, [games, search, filters, sortOrder]);

            const runRandomizer = () => {
                const available = filteredGames.filter(g => g.status === 'available');
                if (available.length === 0) { notify("Nenhum jogo disponível com os filtros atuais.", "error"); return; }
                setShowRandomizer(true);
            };

            const finishRandomizer = () => {
                setShowRandomizer(false);
                const available = filteredGames.filter(g => g.status === 'available');
                const winner = available[Math.floor(Math.random() * available.length)];
                setModalGame(winner);
                setBorrowerId('');
                setShowQRCode(false);
                setIsEditing(false);
                notify(`O escolhido foi: ${winner.title}!`, "success");
            };

            // Game List Renderer
            const renderGameList = () => {
                if (viewMode === 'history') {
                    return (
                        <div className="animate-fade-in max-w-4xl mx-auto">
                            <div className="flex flex-col items-center text-center sm:text-left sm:flex-row sm:justify-between mb-6 gap-4">
                                <h2 className="text-2xl font-bold text-slate-800 dark:text-dark-text flex items-center justify-center sm:justify-start gap-2"><Icons.History/> Histórico</h2>
                                <div className="flex gap-2 flex-wrap justify-center sm:justify-end">
                                    <select className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-dark-border rounded-lg py-1.5 px-3 text-sm outline-none dark:text-white" value={historyFilter.person} onChange={e => setHistoryFilter({...historyFilter, person: e.target.value})}>
                                        <option value="all">Todas as Pessoas</option>
                                        {people.sort((a,b) => a.name.localeCompare(b.name)).map(p => <option key={p.id} value={p.id}>{getPersonLabel(p)}</option>)}
                                    </select>
                                    <select className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-dark-border rounded-lg py-1.5 px-3 text-sm outline-none dark:text-white" value={historyFilter.sort} onChange={e => setHistoryFilter({...historyFilter, sort: e.target.value})}>
                                        <option value="dateDesc">Mais Recentes</option>
                                        <option value="dateAsc">Mais Antigos</option>
                                        <option value="durationDesc">Maior Duração</option>
                                        <option value="durationAsc">Menor Duração</option>
                                    </select>
                                    {filteredHistory.some(h => h.status === 'completed') && isLoggedIn && (
                                        <button onClick={clearHistory} className="bg-white dark:bg-slate-800 border border-red-200 dark:border-red-900 text-red-600 dark:text-red-400 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-2 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
                                            <Icons.Eraser size={16}/> Limpar
                                        </button>
                                    )}
                                </div>
                            </div>
                            <div className="bg-white dark:bg-dark-card rounded-2xl border border-slate-200 dark:border-dark-border shadow-sm table-container">
                                {filteredHistory.length === 0 ? <div className="p-12 text-center text-slate-400 dark:text-dark-muted">Nenhum registro.</div> : (
                                    <div className="overflow-x-auto w-full">
                                        <table className="w-full text-left text-sm whitespace-nowrap sm:whitespace-normal">
                                            <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-100 dark:border-dark-border text-slate-50 dark:text-dark-muted uppercase text-xs font-bold"><tr><th className="p-2 sm:p-4">Jogo</th><th className="p-2 sm:p-4">Quem Pegou?</th><th className="p-2 sm:p-4">Datas</th><th className="p-2 sm:p-4 text-center">Status</th><th className="p-2 sm:p-4 w-10"></th></tr></thead>
                                            <tbody className="divide-y divide-slate-50 dark:divide-dark-border">{filteredHistory.map(item => (<tr key={item.id} onClick={() => { 
                                                const game = games.find(g => g.id === item.gameId) || games.find(g => g.title === item.gameTitle); 
                                                if(game) { setModalGame(game); setIsEditing(false); setBorrowerId(''); } 
                                                else { notify("Jogo não encontrado no acervo.", "error"); }
                                            }} className={`cursor-pointer transition-colors ${item.status === 'active' ? "bg-amber-50/30 dark:bg-amber-900/20 hover:bg-amber-50 dark:hover:bg-amber-900/30" : "hover:bg-slate-50 dark:hover:bg-slate-800"}`}><td className="p-2 sm:p-4 font-bold text-slate-800 dark:text-dark-text flex items-center gap-3"><div className="w-8 h-8 rounded bg-slate-200 dark:bg-slate-700 overflow-hidden shrink-0"><img src={getOptimizedImage(item.image, 60, 60)} className="w-full h-full object-cover"/></div><span className="truncate max-w-[120px] sm:max-w-none">{item.gameTitle}</span></td><td className="p-2 sm:p-4 text-indigo-600 dark:text-indigo-400 font-medium">{item.borrower}</td><td className="p-2 sm:p-4 text-slate-500 dark:text-dark-muted text-xs"><div className="flex flex-col"><span>Saída: {item.loanDate}</span>{item.returnDate !== '-' && <span>Volta: {item.returnDate}</span>}</div></td><td className="p-2 sm:p-4 text-center">{item.status === 'active' ? <div className="flex items-center justify-center gap-2"><span className="bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-400 text-[10px] font-bold px-2 py-1 rounded-full uppercase border border-amber-200 dark:border-amber-900">Emprestado</span>
                                            {isLoggedIn && <button onClick={(e) => { e.stopPropagation(); handleQuickReturn(item); }} className="bg-white dark:bg-slate-700 border border-amber-300 dark:border-amber-700 text-amber-700 dark:text-amber-400 p-1.5 rounded-lg hover:bg-amber-100 dark:hover:bg-amber-900 transition-colors shadow-sm" title="Devolver Agora"><Icons.Return size={14}/></button>}
                                            </div> : <span className="bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 text-[10px] font-bold px-2 py-1 rounded-full uppercase">Concluído</span>}</td><td className="p-2 sm:p-4 text-center">{item.status === 'completed' && isLoggedIn && (<button onClick={(e) => { e.stopPropagation(); deleteHistoryItem(item.id); }} className="text-slate-400 hover:text-red-500 dark:hover:text-red-400 transition-colors"><Icons.Trash size={16}/></button>)}</td></tr>))}</tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                }

                if (viewMode === 'wishlist') {
                    return (
                        <div className="animate-fade-in max-w-4xl mx-auto">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-2xl font-bold text-slate-800 dark:text-dark-text flex items-center gap-2"><Icons.Heart className="text-pink-500"/> Lista de Desejos</h2>
                                <button onClick={() => { setModalGame({ id: 'new', title: '', min: 2, max: 4, time: '30', tags: [], image: '', desc: '', isWishlist: true, priority: 'Medium' }); setIsEditing(true); setEditForm({ tagsString: '', isWishlist: true, priority: 'Medium' }); }} className="bg-pink-500 hover:bg-pink-600 text-white p-2 rounded-lg flex items-center gap-2 text-sm font-bold shadow-md transition-colors"><Icons.Plus size={18}/> Adicionar</button>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                {filteredWishlist.length === 0 ? <div className="col-span-full text-center py-10 text-slate-400">Sua lista de desejos está vazia.</div> : filteredWishlist.map(game => (
                                    <div key={game.id} onClick={() => { setModalGame({...game, isWishlist: true}); setIsEditing(false); setBorrowerId(''); }} className="bg-white dark:bg-dark-card rounded-2xl border border-slate-200 dark:border-dark-border p-4 flex gap-4 cursor-pointer hover:shadow-lg transition-all relative overflow-hidden group">
                                        <div className="w-24 h-24 bg-slate-100 dark:bg-slate-800 rounded-lg overflow-hidden shrink-0"><img src={getOptimizedImage(game.image, 100, 100)} className="w-full h-full object-cover"/></div>
                                        <div className="flex-1 flex flex-col justify-center">

                                                        game.priority === 'High' ? 'bg-red-100 text-red-600 border-red-200 dark:bg-red-900/30' :

                                            </div>
                                            {game.currentPrice && (
                                                <div className="text-sm mt-1 font-bold text-slate-700 dark:text-slate-300 flex items-center gap-1">
                                                    <Icons.CircleDollar size={14}/> R${game.currentPrice}
                                                </div>
                                            )}
                                            <div className="flex gap-2 text-xs text-slate-500 dark:text-dark-muted mb-2 mt-auto"><span>{game.min}-{game.max} Jogadores</span> • <span>{game.time} min</span></div>
                                            <button onClick={(e) => { e.stopPropagation(); window.open(`https://ludopedia.com.br/search?search=${encodeURIComponent(game.title)}`, '_blank'); }} className="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-white text-xs font-bold py-1.5 px-3 rounded-lg flex items-center gap-2 w-fit transition-colors"><Icons.ExternalLink size={14}/> Ver Preços</button>
                                        </div>
                                        {isLoggedIn && (
                                            <button onClick={(e) => { e.stopPropagation(); if(confirm("Mover para o Acervo?")) { setGames(p => sortGamesList([...p, {...game, id: `g-${Date.now()}`, status: 'available', isWishlist: false}])); setWishlist(p => p.filter(w => w.id !== game.id)); notify("Jogo movido para o acervo!"); } }} className="absolute top-2 right-2 p-2 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity" title="Mover para Acervo"><Icons.Check size={18}/></button>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }

                if (filteredGames.length === 0) return <div className="text-center py-20 text-slate-400">Nenhum jogo encontrado.</div>;
                
                // NEW MENU MODE (1C) V9.4 - Fixed Layout + Youtube QR
                if (viewMode === 'menu') return (
                    <div className="max-w-4xl mx-auto p-4 sm:p-8 bg-white text-slate-900 animate-fade-in shadow-2xl rounded-2xl min-h-screen relative print:shadow-none print:w-full print:max-w-none print:p-0">
                        <div className="flex justify-between items-start mb-8 border-b-2 border-slate-900 pb-4">
                            <div>
                                <h1 className="text-4xl font-extrabold tracking-tight uppercase">Menu de Jogos</h1>
                                <p className="text-slate-500 font-medium mt-1">Escolha sua próxima aventura</p>
                            </div>
                            <div className="flex flex-col items-end gap-2 no-print">
                                <button onClick={() => window.print()} className="bg-slate-900 text-white px-4 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-slate-700 print-btn"><Icons.Printer size={18}/> Imprimir Menu</button>
                                <span className="text-xs text-slate-400">Use Ctrl+P para salvar como PDF</span>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                            {filteredGames.map(game => (
                                <div key={game.id} onClick={() => { setModalGame(game); setIsEditing(false); setShowQRCode(false); setBorrowerId(''); setLoanDueDate(''); }} className="flex items-center gap-4 border-b border-slate-200 pb-4 break-inside-avoid page-break mb-4 cursor-pointer hover:bg-slate-50 transition-colors rounded-lg p-2 no-print-bg">
                                    {/* Image */}
                                    <div className="w-16 h-16 shrink-0 rounded-lg overflow-hidden border border-slate-200">
                                        <img src={getOptimizedImage(game.image, 100, 100)} className="w-full h-full object-cover" />
                                    </div>

                                    {/* Text Info - min-w-0 prevents flex overlap */}
                                    <div className="flex-1 min-w-0"> 
                                        <h3 className="font-bold text-lg leading-tight text-slate-900">{game.title}</h3>
                                        <div className="flex items-center gap-3 mt-1 text-sm font-medium text-slate-600">
                                            <span className="flex items-center gap-1"><Icons.Users size={14}/> {game.min}-{game.max}</span>
                                            <span className="flex items-center gap-1"><Icons.Clock size={14}/> {game.time}m</span>
                                        </div>
                                    </div>

                                    {/* QR Code - Youtube Search */}
                                    <div className="flex flex-col items-center shrink-0" onClick={e => e.stopPropagation()}>
                                        <img
                                            src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(`https://www.youtube.com/results?search_query=como+jogar+${game.title}`)}`}
                                            className="w-16 h-16 border border-slate-200 p-1 bg-white rounded cursor-default"
                                        />
                                        <span className="text-[9px] font-bold text-slate-400 uppercase mt-1">Como Jogar</span>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="mt-12 pt-8 border-t-2 border-slate-900 flex justify-between items-center print-only">
                            <div>
                                <p className="font-bold text-lg">Acervo de Jogos</p>
                                <p className="text-sm text-slate-500">Escaneie para ver detalhes e regras</p>
                            </div>
                            <img src={`https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(window.location.href)}`} className="w-24 h-24" />
                        </div>
                    </div>
                );

                // GRID MODE with Bulk Select (3D)
                if (viewMode === 'grid') return (
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6 animate-fade-in">{filteredGames.map(game => {
                        const overdue = game.status === 'loaned' && isOverdue(game.loanDueDate);
                        const isSelected = selectedGames.has(game.id);
                        return (<div key={game.id} onClick={() => { 
                            if(isSelectionMode) toggleGameSelection({stopPropagation:()=>{}}, game.id);
                            else { setModalGame(game); setIsEditing(false); setShowQRCode(false); setBorrowerId(''); setLoanDueDate(''); } 
                        }} className={`group bg-white dark:bg-dark-card rounded-2xl border transition-all hover:-translate-y-1 cursor-pointer overflow-hidden flex flex-col h-full relative ${isSelected ? 'ring-4 ring-indigo-500 border-indigo-500' : overdue ? 'border-red-400 dark:border-red-500 shadow-md shadow-red-100 dark:shadow-none' : 'border-slate-200 dark:border-dark-border hover:shadow-xl'}`}>
                        <div className="relative aspect-[4/3] bg-slate-100 dark:bg-slate-800 overflow-hidden">
                            <img src={getOptimizedImage(game.image, 400, 300)} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" />
                            {game.status === 'loaned' && (<div className={`absolute inset-0 backdrop-blur-[1px] flex items-center justify-center ${overdue ? 'bg-red-900/40' : 'bg-black/50'}`}><span className={`text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase shadow-lg ${overdue ? 'bg-red-500 animate-pulse' : 'bg-amber-500'}`}>{overdue ? 'Atrasado' : 'Emprestado'}</span></div>)}
                            {game.lastSync && !isSelectionMode && (<div className="absolute top-2 right-2 bg-white/90 dark:bg-dark-bg/90 backdrop-blur text-blue-500 p-1 rounded-full shadow-sm z-20"><Icons.CloudCheck size={14}/></div>)}
                            {/* Expansion Icon Fix */}
                            {game.isExpansion && !isSelectionMode && (<div className="absolute top-2 left-2 bg-purple-500 text-white p-1 rounded-full shadow-sm z-30" title="Expansão"><Icons.Puzzle size={14}/></div>)}
                            
                            {isNew(game) && !isSelectionMode && (<div className={`absolute ${game.isExpansion ? 'top-8' : 'top-2'} left-2 bg-cyan-500 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-lg z-20 flex items-center gap-1 animate-pulse-glow`}><Icons.Sparkles size={10} fill="white"/> NOVO</div>)}
                            
                            {/* Selection Checkbox */}
                            {isSelectionMode && (
                                <div className="absolute top-2 right-2 z-30">
                                    <div className={`w-6 h-6 rounded-md border-2 flex items-center justify-center bg-white ${isSelected ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300'}`}>
                                        {isSelected && <Icons.Check size={16}/>}
                                    </div>
                                </div>
                            )}

                            {/* SHORTCUT BUTTON */}
                            { (game.status === 'available' || isLoggedIn) && !isSelectionMode && (
                                <button onClick={(e) => handleShortcut(e, game)} className={`absolute bottom-2 right-2 z-10 w-8 h-8 rounded-full shadow-lg flex items-center justify-center transition-transform active:scale-95 ${game.status === 'available' ? 'bg-indigo-600 hover:bg-indigo-700 text-white' : 'bg-amber-500 hover:bg-amber-600 text-white'}`}>
                                    {game.status === 'available' ? <Icons.Hand size={16}/> : <Icons.Return size={16}/>}
                                </button>
                            )}
                        </div>
                        <div className="p-4 flex flex-col flex-grow">
                            <h3 className="font-bold text-slate-800 dark:text-dark-text text-sm leading-tight mb-1 line-clamp-2">{game.title}</h3>
                            <div className="flex items-center gap-1 mb-2">{[1,2,3,4,5].map(s => <Icons.Star key={s} size={10} fill={s <= (game.rating||0) ? "orange" : "none"} className={s <= (game.rating||0) ? "text-orange-400" : "text-slate-300"}/>)}</div>
                            <div className="flex flex-wrap gap-1 mt-auto">{game.tags.slice(0, 2).map(t => <span key={t} className="text-[9px] bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-600 truncate max-w-full">{t}</span>)}</div>
                        </div>
                    </div>)})}</div>
                );

                if (viewMode === 'list') return (
                    <div className="bg-white dark:bg-dark-card rounded-2xl border border-slate-200 dark:border-dark-border shadow-sm animate-fade-in flex flex-col">
                        <div className="overflow-x-auto w-full hide-scrollbar">
                            <table className="w-full text-left text-sm min-w-[600px]">
                                <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-100 dark:border-dark-border text-slate-50 dark:text-dark-muted uppercase text-xs font-bold">
                                    <tr>
                                        <th className="p-4 w-10"></th>
                                        <th className="p-4">Jogo</th>
                                        <th className="p-4">Jogadores</th>
                                        <th className="p-4">Tempo</th>
                                        <th className="p-4 text-center">Status</th>
                                        <th className="p-4"></th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-50 dark:divide-dark-border">
                                    {filteredGames.map(game => {
                                        const overdue = game.status === 'loaned' && isOverdue(game.loanDueDate);
                                        const isSelected = selectedGames.has(game.id);
                                        return (
                                            <tr key={game.id} onClick={() => { 
                                                if(isSelectionMode) toggleGameSelection({stopPropagation:()=>{}}, game.id);
                                                else { setModalGame(game); setIsEditing(false); setShowQRCode(false); setBorrowerId(''); setLoanDueDate(''); } 
                                            }} className={`cursor-pointer transition-colors ${isSelected ? 'bg-indigo-50 dark:bg-indigo-900/20' : overdue ? 'bg-red-50 dark:bg-red-900/10' : 'hover:bg-indigo-50/50 dark:hover:bg-indigo-900/30'}`}>
                                                <td className="p-3 pl-4">
                                                    {isSelectionMode && (
                                                        <div className={`w-5 h-5 rounded border flex items-center justify-center ${isSelected ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300 bg-white'}`}>{isSelected && <Icons.Check size={12}/>}</div>
                                                    )}
                                                </td>
                                                <td className="p-3 font-bold text-slate-700 dark:text-dark-text flex items-center gap-3">
                                                    <div className="w-10 h-10 rounded-lg bg-slate-200 dark:bg-slate-700 overflow-hidden shrink-0 relative"><img src={getOptimizedImage(game.image, 60, 60)} className="w-full h-full object-cover"/></div>
                                                    <div>{game.title} {isNew(game) && <span className="ml-2 text-[9px] bg-cyan-500 text-white px-1.5 py-0.5 rounded font-bold">NOVO</span>}
                                                        <div className="flex gap-0.5 mt-1">{[1,2,3,4,5].map(s => <Icons.Star key={s} size={8} fill={s <= (game.rating||0) ? "orange" : "none"} className={s <= (game.rating||0) ? "text-orange-400" : "text-slate-300"}/>)}</div>
                                                    </div>
                                                </td>
                                                <td className="p-3 text-slate-500 dark:text-dark-muted">{game.min}-{game.max}</td>
                                                <td className="p-3 text-slate-500 dark:text-dark-muted">{game.time}m</td>
                                                <td className="p-3 text-center whitespace-nowrap">
                                                    {game.status === 'available' ? <span className="inline-block w-2 h-2 rounded-full bg-emerald-400"></span> : <span className={`text-xs font-bold px-2 py-1 rounded border ${overdue ? 'text-red-600 bg-red-100 border-red-200' : 'text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-slate-800 border-amber-100 dark:border-slate-700'}`}>{overdue ? 'Atrasado' : 'Emprestado'}</span>}
                                                </td>
                                                <td className="p-3 text-right whitespace-nowrap">
                                                     { (game.status === 'available' || isLoggedIn) && !isSelectionMode && (
                                                         <button onClick={(e) => handleShortcut(e, game)} className={`p-2 rounded-lg ${game.status === 'available' ? 'text-indigo-600 hover:bg-indigo-50' : 'text-amber-600 hover:bg-amber-50'}`}>
                                                            {game.status === 'available' ? <Icons.Hand size={18}/> : <Icons.Return size={18}/>}
                                                         </button>
                                                     )}
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
                if (viewMode === 'details') return (
                    <div className="space-y-4 animate-fade-in">{filteredGames.map(game => (<div key={game.id} onClick={() => { setModalGame(game); setIsEditing(false); setShowQRCode(false); setBorrowerId(''); setLoanDueDate(''); }} className="bg-white dark:bg-dark-card p-4 rounded-xl border border-slate-200 dark:border-dark-border hover:border-indigo-300 dark:hover:border-indigo-600 hover:shadow-md transition-all cursor-pointer flex flex-col sm:flex-row gap-4"><div className="w-full sm:w-24 h-48 sm:h-32 bg-slate-100 dark:bg-slate-700 rounded-lg overflow-hidden shrink-0 relative"><img src={getOptimizedImage(game.image, 200, 300)} className="w-full h-full object-cover" />{game.lastSync && (<div className="absolute top-1 right-1 bg-blue-500 text-white p-1 rounded-full shadow-sm"><Icons.Check size={10}/></div>)}</div><div className="flex-1 flex flex-col"><div className="flex justify-between items-start mb-2"><h3 className="font-bold text-lg text-slate-800 dark:text-dark-text leading-tight">{game.title} {isNew(game) && <span className="ml-2 text-[9px] bg-cyan-500 text-white px-1.5 py-0.5 rounded font-bold align-middle">NOVO</span>}</h3>
                        <div className="flex items-center gap-2">
                             {game.status === 'loaned' && <span className="bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-400 text-xs font-bold px-2 py-1 rounded shrink-0">Emprestado</span>}
                             { (game.status === 'available' || isLoggedIn) && (
                                 <button onClick={(e) => handleShortcut(e, game)} className={`p-1.5 rounded-lg border ${game.status === 'available' ? 'border-indigo-100 text-indigo-600 hover:bg-indigo-50' : 'border-amber-100 text-amber-600 hover:bg-amber-50'}`}>
                                    {game.status === 'available' ? <Icons.Hand size={16}/> : <Icons.Return size={16}/>}
                                 </button>
                             )}
                        </div>
                    </div><div className="flex gap-3 text-xs text-slate-500 dark:text-dark-muted mb-2"><span className="flex items-center gap-1"><Icons.Users size={14}/> {game.min}-{game.max}</span><span className="flex items-center gap-1"><Icons.Clock size={14}/> {game.time}m</span></div>
                    <div className="flex items-center gap-1 mb-2">{[1,2,3,4,5].map(s => <Icons.Star key={s} size={12} fill={s <= (game.rating||0) ? "orange" : "none"} className={s <= (game.rating||0) ? "text-orange-400" : "text-slate-300"}/>)}</div>
                    <p className="text-sm text-slate-600 dark:text-slate-400 mb-3 break-words whitespace-pre-wrap">{game.desc}</p><div className="mt-auto flex flex-wrap gap-2">{game.tags.map(t => <span key={t} className="text-xs text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/30 px-2 py-1 rounded font-medium">{t}</span>)}</div></div></div>))}</div>
                );
            };

            return (
                <div className="min-h-screen pb-20">
                    <input type="file" ref={fileInputRef} onChange={handleFileChange} className="hidden" accept=".json" />
                    <input type="file" ref={csvInputRef} onChange={handleCSVChange} className="hidden" accept=".csv" />
                    <GameGuru isOpen={showGuru} onClose={() => setShowGuru(false)} games={filteredGames} onSelect={(game) => { setModalGame(game); setIsEditing(false); }} />
                    <Randomizer isOpen={showRandomizer} onClose={() => setShowRandomizer(false)} onFinish={finishRandomizer} />
                    
                    <div className="fixed top-0 right-0 p-4 z-[200] pointer-events-none no-print">
                         {notifications.map(n => (<div key={n.id} className="pointer-events-auto mb-2"><Notification message={n.msg} type={n.type} onClose={() => setNotifications(p => p.filter(x => x.id !== n.id))} /></div>))}
                    </div>

                    {/* Bulk Actions Floating Bar */}
                    {isSelectionMode && selectedGames.size > 0 && (
                        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-[200] bg-white dark:bg-slate-800 shadow-2xl border border-slate-200 dark:border-slate-600 rounded-2xl p-3 flex gap-3 animate-slide-up no-print">
                            <div className="px-3 flex items-center font-bold text-slate-700 dark:text-white border-r border-slate-200 dark:border-slate-600 text-sm">{selectedGames.size} selecionados</div>
                            <button onClick={handleBulkSync} className="p-2 text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-slate-700 rounded-lg flex flex-col items-center gap-1 text-[10px] font-bold"><Icons.CloudSync size={20}/> Sync</button>
                            <button onClick={handleBulkTag} className="p-2 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-slate-700 rounded-lg flex flex-col items-center gap-1 text-[10px] font-bold"><Icons.Tag size={20}/> Tag</button>
                            <button onClick={handleBulkDelete} className="p-2 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-slate-700 rounded-lg flex flex-col items-center gap-1 text-[10px] font-bold"><Icons.Trash size={20}/> Excluir</button>
                        </div>
                    )}

                    {globalSyncState.active && (<div className="fixed top-0 left-0 w-full h-1 z-[300] bg-slate-200 dark:bg-slate-700 no-print"><div className="h-full bg-indigo-600 transition-all duration-300" style={{ width: `${(globalSyncState.current / globalSyncState.total) * 100}%` }}></div></div>)}

                    {/* RANDOMIZER BUTTON */}
                    {viewMode === 'grid' && !isSelectionMode && (
                        <div className="fixed bottom-6 right-6 z-[100] flex gap-3 no-print">
                            <button onClick={() => setShowGuru(true)} className="bg-amber-500 hover:bg-amber-600 text-white p-4 rounded-full shadow-xl hover:scale-110 transition-all animate-pop" title="Guru de Jogos">
                                <Icons.Wand size={28} />
                            </button>
                            <button onClick={runRandomizer} className="bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-full shadow-xl hover:scale-110 transition-all animate-pop" title="Sorteio Aleatório">
                                <Icons.Dice size={28} />
                            </button>
                        </div>
                    )}

                    {/* LOGIN MODAL */}
                    {showLoginModal && (
                        <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm animate-fade-in no-print" onClick={() => setShowLoginModal(false)}>
                            <div className="bg-white dark:bg-dark-card w-full max-w-sm rounded-2xl shadow-2xl p-6" onClick={e => e.stopPropagation()}>
                                <h3 className="font-bold text-lg text-slate-800 dark:text-dark-text mb-4 text-center">Acesso Restrito</h3>
                                <div className="space-y-3">
                                    <input className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-3 text-sm dark:bg-slate-700 dark:text-white" placeholder="Usuário" value={loginForm.user} onChange={e => setLoginForm({...loginForm, user: e.target.value})}/>
                                    <input className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-3 text-sm dark:bg-slate-700 dark:text-white" type="password" placeholder="Senha" value={loginForm.pass} onChange={e => setLoginForm({...loginForm, pass: e.target.value})}/>
                                    <button onClick={handleLogin} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg text-sm hover:bg-indigo-700 transition-colors">Entrar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* WHATSAPP SETTINGS MODAL */}
                    {showWhatsappSettings && (
                        <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm animate-fade-in no-print" onClick={() => setShowWhatsappSettings(false)}>
                            <div className="bg-white dark:bg-dark-card w-full max-w-md rounded-2xl shadow-2xl p-6" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-slate-800 dark:text-dark-text">Modelo de Mensagem WhatsApp</h3>
                                    <button onClick={() => setShowWhatsappSettings(false)}><Icons.X/></button>
                                </div>
                                <p className="text-xs text-slate-500 mb-2">Variáveis: {'{borrower}'} (Nome), {'{title}'} (Jogo), {'{loanDate}'} (Data Emp.), {'{dueDate}'} (Devolução).</p>
                                <textarea 
                                    className="w-full h-32 border border-slate-300 dark:border-slate-600 rounded-lg p-3 text-sm dark:bg-slate-700 dark:text-white mb-4" 
                                    value={whatsappTemplate} 
                                    onChange={e => setWhatsappTemplate(e.target.value)}
                                ></textarea>
                                <button onClick={() => setShowWhatsappSettings(false)} className="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg text-sm">Salvar</button>
                            </div>
                        </div>
                    )}

                    {globalSyncState.active && (
                        <div className="fixed bottom-4 right-4 z-[300] bg-white dark:bg-dark-card shadow-2xl p-4 rounded-2xl border border-slate-200 dark:border-dark-border flex items-center gap-4 animate-slide-in-right max-w-sm w-full mx-4 sm:mx-0 no-print">
                            <div className="bg-indigo-50 dark:bg-slate-800 p-3 rounded-full text-indigo-600 dark:text-indigo-400 shrink-0"><Icons.Loader size={24} className="animate-spin"/></div>
                            <div className="flex-1 min-w-0">
                                <div className="flex justify-between items-baseline mb-1"><span className="text-xs font-bold text-slate-500 dark:text-dark-muted uppercase">Sincronizando</span><span className="text-xs font-bold text-indigo-600 dark:text-indigo-400">{globalSyncState.current}/{globalSyncState.total}</span></div>
                                <h4 className="font-bold text-slate-800 dark:text-dark-text text-sm truncate">{globalSyncState.currentName}</h4>
                                <div className="w-full bg-slate-100 dark:bg-slate-700 h-1.5 rounded-full mt-2 overflow-hidden"><div className="bg-indigo-600 h-full rounded-full transition-all duration-300" style={{width: `${(globalSyncState.current / globalSyncState.total) * 100}%`}}></div></div>
                            </div>
                            <button onClick={() => { abortSyncRef.current = true; notify("Parando...", "error"); }} className="bg-red-50 dark:bg-red-900/20 hover:bg-red-100 dark:hover:bg-red-900/40 text-red-600 dark:text-red-400 p-2 rounded-lg transition-colors border border-red-100 dark:border-red-900/30 shrink-0"><Icons.Stop/></button>
