<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acervo de Jogos</title>

    <!-- PWA: permite "Adicionar à Tela Inicial" -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Acervo">

    <!-- Tailwind CSS -->
    <script defer src="https://cdn.tailwindcss.com"></script>
    <script>
        window.tailwind = window.tailwind || {};
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                            text: '#f1f5f9',
                            muted: '#94a3b8'
                        }
                    },
                    screens: { 'xs': '400px' }
                }
            }
        }
    </script>
    
    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Diagnóstico nativo para falhas de sintaxe ou renderização da aplicação. -->
    <script>
        (function () {
            var appStarted = false;
            var pendingMessage = '';
            var startupTimer = null;
            function diagnosticHref(mode) {
                var url = new URL(window.location.href);
                url.searchParams.set('acervoDiagnostico', mode);
                return url.pathname + url.search + url.hash;
            }
            function showStartupError(message) {
                if (appStarted) return;
                pendingMessage = String(message || 'O aplicativo não conseguiu iniciar.');
                var root = document.getElementById('root');
                if (!root) return;
                root.replaceChildren();
                var panel = document.createElement('main');
                panel.setAttribute('role', 'alert');
                panel.style.cssText = 'box-sizing:border-box;max-width:760px;margin:8vh auto;padding:28px;font:16px/1.55 system-ui,sans-serif;color:#0f172a;background:#fff;border:1px solid #cbd5e1;border-radius:16px;box-shadow:0 12px 36px #0f172a22';
                var title = document.createElement('h1');
                title.textContent = 'O Acervo não conseguiu abrir';
                title.style.cssText = 'margin:0 0 10px;font-size:24px';
                var explanation = document.createElement('p');
                explanation.textContent = 'A página foi carregada, mas algum recurso falhou durante a inicialização. Os detalhes abaixo ajudam a identificar a causa.';
                var details = document.createElement('pre');
                details.textContent = pendingMessage;
                details.style.cssText = 'padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;border-radius:8px;font:13px/1.45 ui-monospace,monospace';
                var hint = document.createElement('p');
                hint.textContent = 'Para descobrir se o problema está no token ou nos dados deste navegador, abra um dos diagnósticos. Eles não apagam nem gravam dados locais.';
                var links = document.createElement('p');
                links.style.cssText = 'display:flex;flex-wrap:wrap;gap:14px';
                [['Sem token salvo', 'sem-token'], ['Sem dados do acervo', 'sem-acervo'], ['Sem dados da Jogatina', 'sem-jogatina'], ['Sem ler dados locais', 'sem-dados']].forEach(function (item) {
                    var link = document.createElement('a');
                    link.href = diagnosticHref(item[1]);
                    link.textContent = item[0];
                    link.style.cssText = 'color:#4338ca;font-weight:700';
                    links.appendChild(link);
                });
                panel.append(title, explanation, details, hint, links);
                root.appendChild(panel);
            }
            window.__acervoReportStartupError = showStartupError;
            window.__acervoMarkStarted = function () {
                appStarted = true;
                if (startupTimer) window.clearTimeout(startupTimer);
            };
            window.__acervoDiagnosticHref = diagnosticHref;
            window.addEventListener('error', function (event) {
                if (appStarted) return;
                if (event.target && event.target.tagName === 'SCRIPT' && event.target.src) return;
                if (event.message) {
                    showStartupError('Erro JavaScript: ' + event.message + (event.filename ? '\n' + event.filename + ':' + event.lineno : ''));
                }
            }, true);
            window.addEventListener('unhandledrejection', function (event) {
                if (!appStarted) showStartupError('Falha assíncrona: ' + String(event.reason && event.reason.message || event.reason || 'erro sem detalhes'));
            });
            document.addEventListener('DOMContentLoaded', function () {
                if (pendingMessage) showStartupError(pendingMessage);
                startupTimer = window.setTimeout(function () {
                    if (!appStarted) showStartupError(pendingMessage || 'A inicialização não terminou em 30 segundos. Verifique a compilação da aplicação ou use os diagnósticos abaixo.');
                }, 30000);
            });
        })();
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes expand { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes confettiFall { 0% { transform: translateY(-10px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(540deg); opacity: 0; } }
        @keyframes diceRoll { 0% { transform: rotate(0deg) scale(1) translateY(0); } 20% { transform: rotate(80deg) scale(1.15) translateY(-6px); } 40% { transform: rotate(170deg) scale(0.9) translateY(3px); } 60% { transform: rotate(260deg) scale(1.1) translateY(-5px); } 80% { transform: rotate(340deg) scale(0.95) translateY(2px); } 100% { transform: rotate(440deg) scale(1) translateY(0); } }
        
        .animate-slide-in-right { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards; }
        .animate-expand { animation: expand 0.5s ease-in-out; }
        .animate-spin { animation: spin 1s linear infinite; }
        .animate-pulse-glow { animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-dice-roll { animation: diceRoll 0.5s ease-in-out infinite; }
        
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(15, 23, 42, 0.95); border-bottom-color: #334155; }
        .modal-content { max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .modal-scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 1rem; }
        
        input, select, textarea { font-size: 16px !important; }

        /* Print Specific Styles */
        @media print {
            body { background: white; color: black; }
            .no-print, header, .fixed, button:not(.print-btn) { display: none !important; }
            .print-only { display: block !important; }
            .page-break { page-break-inside: avoid; break-inside: avoid; }
            #root { margin: 0; padding: 0; }
            main { padding: 0; margin: 0; max-width: 100%; }
            .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
            /* O rodapé (texto + QR do acervo) tem que sair inteiro numa página só — sem isso ele
               era partido e o QR final acabava sozinho, "jogado" pra fora/pra outra folha. */
            .print-only { break-inside: avoid; page-break-inside: avoid; display: flex !important; }
            .print-only img { max-width: 100%; height: auto; }
        }
        .print-only { display: none; }
        /* Corta o título em 2 linhas no Cardápio (fallback caso a build do Tailwind em uso não
           traga line-clamp) — títulos longos esticavam a linha e desalinhavam os QR codes. */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .caderno-fullscreen:fullscreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            box-sizing: border-box;
            width: 100vw;
            height: 100vh;

            flex-direction: column;

            overflow: hidden;
            padding: 8px 12px;
            background: #f8fafc;

        .dark .caderno-fullscreen:fullscreen { background: #0f172a; }
        .caderno-fullscreen:fullscreen .caderno-header { flex: 0 0 auto; }
        .caderno-fullscreen:fullscreen .caderno-heading p,
        .caderno-fullscreen:fullscreen .caderno-footer { display: none; }
        .caderno-fullscreen:fullscreen .caderno-workspace {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;

        .caderno-workspace > .caderno-tool-rail { order: 1; }
        .caderno-workspace > .caderno-canvas-shell { order: 2; }
        .caderno-fullscreen:fullscreen .caderno-canvas-shell {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            border: 0 !important;
            border-radius: 0 !important;
            background: transparent !important;
            box-shadow: none !important;

        .caderno-fullscreen:fullscreen .caderno-canvas-shell { flex: 1 1 auto; }
        .caderno-fullscreen:fullscreen .caderno-board-canvas {

            max-width: 100%;
            max-height: 100% !important;
            margin: auto;

        .caderno-fullscreen:fullscreen .caderno-notice { flex: 0 0 auto; }
        @media (orientation: landscape) {
            .caderno-fullscreen:fullscreen .caderno-workspace {
                display: grid;
                grid-template-columns: clamp(132px, 14vw, 220px) minmax(0, 1fr) clamp(132px, 14vw, 220px);
                align-items: stretch;
                gap: 8px;
                overflow: hidden;
            }
            .caderno-fullscreen:fullscreen .caderno-workspace > .caderno-tool-rail:first-child { grid-column: 1; grid-row: 1; }
            .caderno-fullscreen:fullscreen .caderno-workspace > .caderno-canvas-shell { grid-column: 2; grid-row: 1; }
            .caderno-fullscreen:fullscreen .caderno-workspace > .caderno-tool-rail:last-child { grid-column: 3; grid-row: 1; }
            .caderno-fullscreen:fullscreen .caderno-tool-rail {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
                min-width: 0;
                min-height: 0;
                overflow: auto;
                padding: 2px;
            }
            .caderno-fullscreen:fullscreen .caderno-tool-rail > button { width: 100%; justify-content: flex-start; }
            .caderno-fullscreen:fullscreen .caderno-tool-rail > label { width: 100%; justify-content: space-between; }
            .caderno-fullscreen:fullscreen .caderno-tool-rail input[type="range"] { min-width: 0; flex: 1; }
            .caderno-fullscreen:fullscreen .caderno-canvas-shell { flex: initial; }
        }
        @media (max-height: 500px) {
            .caderno-fullscreen:fullscreen { gap: 4px; padding: 5px 8px; }
            .caderno-fullscreen:fullscreen .caderno-workspace { gap: 5px; }
            .caderno-fullscreen:fullscreen .caderno-tool-rail { gap: 3px; }
            .caderno-fullscreen:fullscreen .caderno-tool-rail > button { padding: 4px 6px; font-size: 10px; }
            .caderno-fullscreen:fullscreen .caderno-tool-rail > label { padding: 3px 5px; font-size: 10px; }
        }

 null, "Banco"), " (mesa virtual compartilhada para controlar dinheiro ou pontos durante a partida; conecte uma pessoa cadastrada ou entre como convidado para ver participantes online e saldos. Cada participante controla apenas o próprio saldo: pode movimentar valores com o banco ou pedir transferências a outra pessoa, que precisa confirmar no próprio aparelho. Pedidos para receber são bloqueados se o saldo de quem vai pagar não for suficiente, com uma nova conferência no momento da confirmação. Os pedidos podem ser recusados ou expirar após 2 minutos. Ao sair da mesa, seu saldo individual é zerado. O botão “Zerar sessão” pede confirmação de todas as pessoas online: todos precisam aceitar; um “Não” cancela a solicitação, e a falta de resposta de todos em 2 minutos também cancela. Perfis de dinheiro (criados pelo admin) definem moeda, saldo inicial igual para todos e podem ser vinculados a um jogo. O botão “Pendências” reúne solicitações pertinentes à pessoa e até 20 registros do histórico com saldos antes/depois, inclusive recusas e expirações. O histórico pode ser limpo pelo Banco e também é ocultado a cada reset da sessão. Corrigir um movimento pede confirmação apenas das pessoas afetadas. A mesa sincroniza pelo backup do GitHub, configurado em cada aparelho. Alterações de quem está conectado são enviadas após 350 ms; com atividade recente ou pedidos pendentes a nuvem é consultada a cada 2 segundos; em repouso na mesa, a cada 5 segundos; fora dela, a cada 20 segundos; e, com a aba oculta, a cada 60 segundos. Após falhas, a frequência diminui temporariamente para respeitar limites e recuperar conexão. A consulta rápida aumenta o uso da cota do token. Como o site é estático, use a mesa entre pessoas de confiança: alguém com acesso ao token pode alterar o backup). A entrada e a saída da Mesa Virtual ficam ao lado do título Jogatina. A sala permanece única; salas com nome ou código ficam anotadas como ideia futura. ", React.createElement("strong", null, "Caderno"), "
