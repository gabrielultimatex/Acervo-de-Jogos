                    const avgDays = recentCompleted.reduce((sum, h) => sum + (parseDate(h.returnDate) - parseDate(h.loanDate)) / (1000 * 60 * 60 * 24), 0) / recentCompleted.length;

                    if (anyOnTime || avgDays <= 3) badges.push({ icon: '⚡', title: 'Relâmpago', color: 'text-yellow-500' });
                    if (anyLate || avgDays >= 12) badges.push({ icon: '🐢', title: 'Tartaruga', color: 'text-green-600' });
                }

                // 100% Pontual: nenhum atraso entre os empréstimos concluídos que tinham data
                // prevista registrada (exige pelo menos 3, pra não dar o badge com amostra pequena)
                const completedWithDueDate = completed.filter(h => h.loanDueDate);
                if (completedWithDueDate.length >= 3) {
                    const everOverdue = completedWithDueDate.some(h => parseDate(h.returnDate) > parseDate(h.loanDueDate));
                    if (!everOverdue) badges.push({ icon: '🎯', title: '100% Pontual', color: 'text-emerald-500' });
                }

                // Colecionador(a): jogos de 7+ categorias/tags diferentes (olhando o jogo real, se ainda existir no acervo)
                const categoriesSeen = new Set();
                pHistory.forEach(h => {
                    const game = games.find(g => g.id === h.gameId) || games.find(g => g.title === h.gameTitle);
                    (game?.tags || []).forEach(tag => categoriesSeen.add(tag));
                });
                if (categoriesSeen.size >= 7) badges.push({ icon: '🔍', title: 'Colecionador(a)', color: 'text-fuchsia-500' });

                // Fiel: pegou o mesmo jogo 3+ vezes
                const titleCounts = {};
                pHistory.forEach(h => { titleCounts[h.gameTitle] = (titleCounts[h.gameTitle] || 0) + 1; });
                if (Object.values(titleCounts).some(c => c >= 3)) badges.push({ icon: '💌', title: 'Fiel', color: 'text-rose-500' });

                // Sequência: empréstimos em 3+ meses consecutivos (olhando ano-mês de loanDate)
                const monthKeys = new Set(pHistory.map(h => {
                    const d = parseDate(h.loanDate);
                    return d.getFullYear() * 12 + d.getMonth();
                }));
                const sortedMonths = Array.from(monthKeys).sort((a, b) => a - b);
                let bestStreak = 1, currentStreak = 1;
                for (let i = 1; i < sortedMonths.length; i++) {
                    currentStreak = sortedMonths[i] === sortedMonths[i - 1] + 1 ? currentStreak + 1 : 1;
                    bestStreak = Math.max(bestStreak, currentStreak);
                }
                if (sortedMonths.length >= 3 && bestStreak >= 3) badges.push({ icon: '🔥', title: 'Sequência', color: 'text-orange-500' });

                // Rei/Rainha da Jogatina: maior número total de empréstimos entre toda a família no momento
                const familyMax = Math.max(0, ...people.map(p => getPersonHistory(p.id).length));
                if (familyMax > 0 && pHistory.length === familyMax) badges.push({ icon: '👑', title: 'Rei/Rainha da Jogatina', color: 'text-indigo-500' });

                return badges;
            };

            // --- HELPERS --- (parseDate agora é global, definido no topo do arquivo)
            const formatDate = (date) => date.toLocaleDateString('pt-BR');
            const calculateDuration = (item) => { const start = parseDate(item.loanDate); const end = item.returnDate === '-' ? new Date() : parseDate(item.returnDate); return end - start; };
            
            const getSearchUrl = (game) => {
                const query = encodeURIComponent(`${game.title} regras manual pdf ludopedia`);
                return game.manualLink || `https://www.google.com/search?q=${query}`;
            };

            const generateQRUrl = (game) => {
                const target = getSearchUrl(game);
                return `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(target)}`;
            };

            // Monta um link que, ao ser aberto, faz o próprio site abrir direto no jogo indicado
            // (usado tanto pelo botão "Compartilhar" quanto pelo QR de Empréstimo Rápido).
            const buildGameShareUrl = (gameId, action) => {
                const base = `${window.location.origin}${window.location.pathname}`;
                return action ? `${base}?game=${gameId}&action=${action}` : `${base}?game=${gameId}`;
            };

            const generateLoanQRUrl = (game) => {
                return `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(buildGameShareUrl(game.id, 'loan'))}`;
            };

            const handleShareGame = async (game) => {
                const url = buildGameShareUrl(game.id);
                try {
                    await navigator.clipboard.writeText(url);
                    notify("Link copiado! Já pode colar no WhatsApp.", "success");
                } catch (e) {
                    notify(`Não consegui copiar automaticamente. Link: ${url}`, "error");
                }
            };

            // Clicar numa tag/mecânica dentro do jogo: fecha o modal e filtra o acervo inteiro
            // por essa mesma categoria, pra achar rapidinho outros jogos parecidos.
            const filterByTag = (tag) => {
                setFilters({ tag, players: '', time: 'all', rating: 'all', priority: 'all', maxPrice: '' });
                setSearch('');
                setViewMode('grid');
                closeModalGame();
                notify(`Filtrando por "${tag}"`, "success");
            };

            // Se a URL tiver "?game=ID" (vindo de um link compartilhado ou do QR de empréstimo),
            // abre o modal daquele jogo automaticamente assim que os dados carregarem.
            const openGameFromUrl = (gamesList, wishlistList) => {
                const params = new URLSearchParams(window.location.search);
                const sharedId = params.get('game');
                if (!sharedId) return;
                const action = params.get('action');
                window.history.replaceState(null, '', window.location.pathname);

                const foundGame = (gamesList || []).find(g => g.id === sharedId);
                const foundWish = !foundGame ? (wishlistList || []).find(w => w.id === sharedId) : null;

                if (foundGame) {
                    setModalGame(foundGame);
                    setIsEditing(false);
                    if (action === 'loan' && foundGame.status === 'available') {
                        setTimeout(() => {
                            const loanSection = document.getElementById('loan-section');
                            if (loanSection) loanSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }, 400);
                    }
                } else if (foundWish) {
                    setModalGame({ ...foundWish, isWishlist: true });
                    setIsEditing(false);
                } else {
                    notify("O jogo do link não foi encontrado no acervo.", "error");
                }
            };

            const isOverdue = (dateStr) => {
                if (!dateStr) return false;
                const [day, month, year] = dateStr.split('/');
                const due = new Date(year, month - 1, day);
                const today = new Date();
                today.setHours(0,0,0,0);
                return today > due;
            };

            const daysOverdue = (dateStr) => {
                if (!dateStr) return 0;
                const [day, month, year] = dateStr.split('/');
                const due = new Date(year, month - 1, day); due.setHours(0,0,0,0);
                const today = new Date(); today.setHours(0,0,0,0);
                return Math.max(0, Math.round((today - due) / (1000 * 60 * 60 * 24)));
            };

            // Telefone da pessoa que está com o jogo (se cadastrado). Tenta por ID primeiro
            // (empréstimos novos) e cai para correspondência exata pelo nome (empréstimos antigos).
            const getPersonPhone = (game) => {
                const person = game.borrowerId
                    ? people.find(p => p.id === game.borrowerId)
                    : people.find(p => getPersonLabel(p) === game.borrower);
                return person?.phone || '';
            };

            // Monta o link do WhatsApp. Com telefone salvo, abre a conversa direto com a pessoa;
            // sem telefone, abre o seletor de contatos do WhatsApp com o texto já pronto (o
            // WhatsApp não oferece uma forma de enviar mensagens sozinho, sem esse clique manual).
            const buildWhatsAppLink = (phone, message) => {
                const clean = (phone || '').replace(/\D/g, '');
                const base = clean ? `https://wa.me/55${clean.replace(/^55/, '')}` : 'https://wa.me/';
                return `${base}?text=${encodeURIComponent(message)}`;
            };

            const buildReminderMessage = (game) => {
                const firstName = (game.borrower || '').replace(/\(.*/, '').trim().split(' ')[0];
                return whatsappTemplate
                    .replace('{borrower}', firstName)
                    .replace('{title}', game.title)
                    .replace('{loanDate}', game.loanDate)
                    .replace('{dueDate}', game.loanDueDate || '?');
            };

            const overdueGames = useMemo(() => games.filter(g => g.status === 'loaned' && isOverdue(g.loanDueDate)), [games]);

            // Liga/desliga as notificações do navegador — pede permissão ao ativar. Some com
            // uma explicação clara se o navegador não suportar ou se a permissão for negada.
            const handleToggleNotifications = async () => {
                if (notificationsEnabled) {
                    setNotificationsEnabled(false);
                    notify("Notificações de vencimento desativadas.");
                    return;
                }
                if (typeof window.Notification === 'undefined') {
                    notify("Seu navegador não suporta notificações.", "error");
                    return;
                }
                try {
                    const permission = await window.Notification.requestPermission();
                    if (permission === 'granted') {
                        setNotificationsEnabled(true);
                        notify("Notificações de vencimento ativadas! Funciona enquanto essa aba estiver aberta.", "success");
                    } else {
                        notify("Permissão de notificação negada pelo navegador.", "error");
                    }
                } catch (e) {
                    console.error(e);
                    notify("Não foi possível ativar as notificações.", "error");
                }
            };

            // Verifica periodicamente jogos emprestados perto do vencimento (ou já atrasados) e
            // dispara uma notificação do navegador — só funciona enquanto a aba estiver aberta,
            // já que o site é 100% estático e não tem servidor pra enviar push de verdade.
            // Guarda em localStorage o último dia em que cada empréstimo já foi notificado, pra
            // não repetir o aviso várias vezes no mesmo dia.
            useEffect(() => {
                if (!notificationsEnabled) return;
                if (typeof window.Notification === 'undefined' || window.Notification.permission !== 'granted') return;

                const checkDueReminders = () => {
                    const now = new Date();
                    now.setHours(0, 0, 0, 0);
                    const todayStr = now.toISOString().split('T')[0];
                    const notifiedKey = 'notified_loans_v1';
                    let notifiedMap = {};
                    try { notifiedMap = JSON.parse(localStorage.getItem(notifiedKey) || '{}'); } catch (e) { notifiedMap = {}; }

                    const activeLoanIds = new Set(games.filter(g => g.status === 'loaned').map(g => g.loanId));
                    // Limpa entradas de empréstimos que já não estão mais ativos (devolvidos)
                    Object.keys(notifiedMap).forEach(loanId => { if (!activeLoanIds.has(loanId)) delete notifiedMap[loanId]; });

                    games.forEach(g => {
                        if (g.status !== 'loaned' || !g.loanDueDate || !g.loanId) return;
                        const due = parseDate(g.loanDueDate);
                        due.setHours(0, 0, 0, 0);
                        const diffDays = Math.round((due - now) / (1000 * 60 * 60 * 24));
                        if (diffDays > 1) return; // ainda falta mais de 1 dia — não é "perto" o suficiente
                        if (notifiedMap[g.loanId] === todayStr) return; // já notificado hoje

                        let title, body;
                        if (diffDays < 0) {
                            title = `⏰ "${g.title}" está atrasado!`;
                            body = `${g.borrower} está com esse jogo desde ${g.loanDate}. Previsão era ${g.loanDueDate}.`;
                        } else if (diffDays === 0) {
                            title = `📅 "${g.title}" vence hoje`;
                            body = `${g.borrower} precisa devolver esse jogo hoje.`;
                        } else {
                            title = `📅 "${g.title}" vence amanhã`;
                            body = `${g.borrower} precisa devolver esse jogo amanhã.`;
                        }
                        try {
                            const notif = new window.Notification(title, { body, icon: 'icon-192.png', tag: g.loanId });
                            notif.onclick = () => { window.focus(); };
                        } catch (e) { console.error(e); }
                        notifiedMap[g.loanId] = todayStr;
                    });

                    localStorage.setItem(notifiedKey, JSON.stringify(notifiedMap));
                };

                checkDueReminders();
                const interval = setInterval(checkDueReminders, 60 * 60 * 1000); // reconfere de hora em hora (pega a virada do dia com a aba aberta)
                return () => clearInterval(interval);
            }, [notificationsEnabled, games]);

            // Jogos esquecidos: nunca emprestados, ou parados há 30+ dias desde o último
            // empréstimo — pra lembrar do que já está na estante há um tempo. Fica na página
            // de Histórico (lista completa, não limitada), com uma versão resumida visível por
            // padrão e um botão pra abrir a lista completa num modal.
            const staleGames = useMemo(() => {
                const now = Date.now();
                const DAY_MS = 24 * 60 * 60 * 1000;
                return games
                    .filter(g => !g.isExpansion)
                    .map(g => {
                        const gameHistory = history.filter(h => h.gameId === g.id || h.gameTitle === g.title);
                        if (gameHistory.length === 0) return { ...g, neverLoaned: true, daysSince: Infinity };
                        const lastLoanTime = gameHistory.reduce((latest, h) => {
                            const t = parseDate(h.loanDate).getTime();
                            return t > latest ? t : latest;
                        }, 0);
                        const daysSince = Math.floor((now - lastLoanTime) / DAY_MS);
                        return { ...g, neverLoaned: false, daysSince };
                    })
                    .filter(g => g.neverLoaned || g.daysSince >= 30)
                    .sort((a, b) => b.daysSince - a.daysSince);
            }, [games, history]);

            // Jogos emprestados com previsão de devolução num dia específico (usado pelo calendário)
            const getLoansDueOn = (day, month, year) => {
                return games.filter(g => {
                    if (g.status !== 'loaned' || !g.loanDueDate) return false;
                    const due = parseDate(g.loanDueDate);
                    return due.getDate() === day && due.getMonth() === month && due.getFullYear() === year;
                });
            };

            const goToPrevMonth = () => setCalendarMonth(prev => prev.month === 0 ? { year: prev.year - 1, month: 11 } : { year: prev.year, month: prev.month - 1 });
            const goToNextMonth = () => setCalendarMonth(prev => prev.month === 11 ? { year: prev.year + 1, month: 0 } : { year: prev.year, month: prev.month + 1 });
            const goToCurrentMonth = () => { const d = new Date(); setCalendarMonth({ year: d.getFullYear(), month: d.getMonth() }); };

            // Todos os jogos que estão, no momento, emprestados com uma pessoa específica.
            // Prioriza borrowerId (empréstimos novos) e cai para correspondência exata pelo
            // nome/etiqueta como reserva, para os empréstimos antigos sem borrowerId.
            const getActiveLoansForPerson = (personId) => {
                const person = people.find(p => p.id === personId);
                if (!person) return [];
                const personLabel = getPersonLabel(person);
                return games.filter(g => g.status === 'loaned' && (g.borrowerId ? g.borrowerId === personId : g.borrower === personLabel));
            };

            // Monta uma única mensagem consolidando todos os jogos que a pessoa está com ela,
            // com nome, data de retirada e previsão de devolução de cada um.
            const buildPersonLoansMessage = (person, loans) => {
                const firstName = getPersonLabel(person).replace(/\(.*/, '').trim().split(' ')[0];
                const lines = loans.map((g, i) => {
                    const due = g.loanDueDate ? `Previsão de devolução: ${g.loanDueDate}` : 'Sem previsão de devolução definida';
                    const overdueTag = isOverdue(g.loanDueDate) ? ' ⚠️ ATRASADO' : '';
                    return `${i + 1}. 🎲 *${g.title}*\n   Retirado em: ${g.loanDate} | ${due}${overdueTag}`;
                });
                return `Olá ${firstName}! Aqui está a lista dos jogos que você está com o nosso acervo:\n\n${lines.join('\n\n')}\n\nQualquer coisa, me avisa 🙂`;
            };

            // Reúne os números do "perfil" de uma pessoa: jogo favorito (mais emprestado por
            // ela), tempo médio de devolução e uma linha do tempo dos empréstimos recentes.
            const getPersonStats = (personId) => {
                const person = people.find(p => p.id === personId);
                if (!person) return null;

                const pHistory = getPersonHistory(personId);
                const completed = pHistory.filter(h => h.status === 'completed' && h.returnDate && h.returnDate !== '-');

                const titleCounts = {};
                pHistory.forEach(h => { titleCounts[h.gameTitle] = (titleCounts[h.gameTitle] || 0) + 1; });
                let favoriteTitle = null;
                Object.keys(titleCounts).forEach(title => {
                    if (!favoriteTitle || titleCounts[title] > titleCounts[favoriteTitle]) favoriteTitle = title;
                });

                let avgDays = null;
                if (completed.length > 0) {
                    const totalDays = completed.reduce((sum, h) => sum + (parseDate(h.returnDate) - parseDate(h.loanDate)) / (1000 * 60 * 60 * 24), 0);
                    avgDays = Math.round((totalDays / completed.length) * 10) / 10;
                }

                const timeline = [...pHistory].sort((a, b) => parseDate(b.loanDate) - parseDate(a.loanDate)).slice(0, 8);

                // Jogos na fila de reserva dessa pessoa, com a posição atual em cada fila
                const queuedGames = reservations
                    .filter(r => r.personId === personId)
                    .map(r => {
                        const queue = getGameQueue(r.gameId);
                        const position = queue.findIndex(q => q.id === r.id) + 1;
                        const game = games.find(g => g.id === r.gameId);
                        return {
                            reservationId: r.id,
                            gameId: r.gameId,
                            gameTitle: game ? game.title : r.gameTitle,
                            gameImage: game ? game.image : '',
                            gameStatus: game ? game.status : null,
                            position,
                            queueLength: queue.length
                        };
                    })
                    .sort((a, b) => a.position - b.position);

                return {
                    person,
                    totalLoans: pHistory.length,
                    activeLoans: getActiveLoansForPerson(personId),
                    favoriteGame: favoriteTitle ? { title: favoriteTitle, count: titleCounts[favoriteTitle] } : null,
                    avgDays,
                    timeline,
                    queuedGames,
                    badges: calculateBadges(personId)
                };
            };

            const isNew = (game) => {
                if (!game.id.startsWith('g-')) return false; 
                try {
                    const parts = game.id.split('-');
                    if (parts.length < 2) return false;
                    const timestamp = parseInt(parts[1]);
                    const diff = Date.now() - timestamp;
                    return diff < (15 * 24 * 60 * 60 * 1000); // 15 dias
                } catch(e) { return false; }
            };

            const toggleTagInEdit = (tag) => {
                const currentTags = editForm.tagsString ? editForm.tagsString.split(',').map(t => t.trim()).filter(Boolean) : [];
                if (currentTags.includes(tag)) {
                    setEditForm(prev => ({...prev, tagsString: currentTags.filter(t => t !== tag).join(', ')}));
                } else {
                    setEditForm(prev => ({...prev, tagsString: [...currentTags, tag].join(', ')}));
                }
            };

            // Galeria de fotos extras (além da capa) — só guarda links, não faz upload de arquivo
            const addExtraImage = () => {
                const url = newImageUrl.trim();
                if (!url) return;
                setEditForm(prev => ({ ...prev, images: [...(prev.images || []), url] }));
                setNewImageUrl('');
            };
            const removeExtraImage = (idx) => {
                setEditForm(prev => ({ ...prev, images: (prev.images || []).filter((_, i) => i !== idx) }));
            };

            const getStorageUsage = () => {
                let total = 0;
                for(let x in localStorage) {
                    if(localStorage.hasOwnProperty(x)) total += ((localStorage[x].length + x.length) * 2);
                }
                return (total / 1024 / 1024).toFixed(2);
            };

            const filteredHistory = useMemo(() => {
                let list = [...history];
                if (historyFilter.person !== 'all') { const person = people.find(p => p.id === historyFilter.person); if (person) { const personLabel = getPersonLabel(person); list = list.filter(h => h.borrowerId ? h.borrowerId === historyFilter.person : h.borrower === personLabel); } }
                list.sort((a, b) => {
                    if (historyFilter.sort === 'dateDesc') return parseDate(b.loanDate) - parseDate(a.loanDate);
                    if (historyFilter.sort === 'dateAsc') return parseDate(a.loanDate) - parseDate(b.loanDate);
                    if (historyFilter.sort === 'durationDesc') return calculateDuration(b) - calculateDuration(a);
                    if (historyFilter.sort === 'durationAsc') return calculateDuration(a) - calculateDuration(b);
                    return 0;
                });
                return list;
            }, [history, historyFilter, people]);

            const filteredWishlist = useMemo(() => {
                let result = wishlist.filter(g => {
                    const matchSearch = titleMatchesSearch(g.title, search);
                    const matchPriority = filters.priority === 'all' || g.priority === filters.priority;
                    let matchPrice = true;
                    if (filters.maxPrice) {
                         const price = parseFloat(g.currentPrice);
                         const max = parseFloat(filters.maxPrice);
                         if (!isNaN(price) && !isNaN(max)) {
                             matchPrice = price <= max;
                         }
                    }
                    return matchSearch && matchPriority && matchPrice;
                });

                result.sort((a, b) => {
                    if (sortOrder === 'newest') {
                        const getTs = (id) => { try { return parseInt(id.split('-')[1]); } catch(e){ return 0; } };
                        return getTs(b.id) - getTs(a.id);
                    }
                    const titleA = a.title.toLowerCase();
                    const titleB = b.title.toLowerCase();
                    if (sortOrder === 'asc') return titleA.localeCompare(titleB);
                    else return titleB.localeCompare(titleA);
                });
                
                return result;
            }, [wishlist, search, filters, sortOrder]);

            const handleLoan = () => {
                if (!borrowerId) { notify("Selecione uma pessoa!", "error"); return; }
                const queue = getGameQueue(modalGame.id);
                // Se existe fila e a pessoa escolhida não é a primeira da fila, avisa antes de emprestar
                if (queue.length > 0 && queue[0].personId !== borrowerId) {
                    const alreadyInQueue = queue.some(r => r.personId === borrowerId);
                    setLoanQueueWarning({ gameId: modalGame.id, gameTitle: modalGame.title, borrowerId, queue, alreadyInQueue });
                    return;
                }
                executeLoan(borrowerId);
            };

            // Executa o empréstimo de fato (chamado direto quando não há conflito de fila, ou
            // após confirmação no aviso). Recebe o id de quem vai receber o jogo.
            const executeLoan = (chosenBorrowerId) => {
                const person = people.find(p => p.id === chosenBorrowerId);
                const borrowerName = getPersonLabel(person);
                const loanId = `loan-${Date.now()}`;
                const startDate = new Date().toLocaleDateString('pt-BR');

                let formattedDueDate = '';
                if (loanDueDate) {
                    const d = new Date(loanDueDate);
                    d.setMinutes(d.getMinutes() + d.getTimezoneOffset());
                    formattedDueDate = d.toLocaleDateString('pt-BR');
                }

                const now = Date.now();
                const updatedGame = { ...modalGame, status: 'loaned', borrower: borrowerName, borrowerId: chosenBorrowerId, loanDate: startDate, loanDueDate: formattedDueDate, loanId: loanId, updatedAt: now };
                const newHistoryItem = { id: loanId, gameTitle: modalGame.title, gameId: modalGame.id, borrower: borrowerName, borrowerId: chosenBorrowerId, loanDate: startDate, loanDueDate: formattedDueDate, returnDate: '-', status: 'active', image: modalGame.image, updatedAt: now };
                setGames(prev => prev.map(g => g.id === modalGame.id ? updatedGame : g));
                setHistory(prev => [newHistoryItem, ...prev]);
                setModalGame(updatedGame); setBorrowerId(''); setLoanDueDate('');

                // Se quem recebeu o jogo já estava na fila de reserva dele, remove — o pedido já foi atendido
                const existingReservation = reservations.find(r => r.gameId === modalGame.id && r.personId === chosenBorrowerId);
                if (existingReservation) removeReservation(existingReservation.id, 'fulfilled');

                const milestone = history.length + 1;
                if (milestone % 10 === 0) {
                    fireConfetti();
                    notify(`🎉 Esse foi o ${milestone}º empréstimo do acervo!`, "success");
                } else {
                    notify("Jogo emprestado com sucesso!");
                }
            };

            // Confirma o carrinho: empresta (ou registra interesse) nos jogos selecionados.
            // No modo empréstimo, jogos marcados como "adicionar à fila" (por causa de fila já
            // existente) não são emprestados — só entram na fila desse jogo específico. Tudo
            // isso vira UMA única ação no "desfazer".
            const confirmCartCheckout = () => {
                const person = people.find(p => p.id === cartBorrowerId);
                if (!person) { notify("Selecione uma pessoa!", "error"); return; }
                const borrowerName = getPersonLabel(person);
                const now = Date.now();

                if (cartPurpose === 'interest') {
                    const targetGames = games.filter(g => cartGameIds.has(g.id));
                    const newReservations = [];
                    let alreadyCount = 0;
                    targetGames.forEach((g, idx) => {
                        const already = reservations.find(r => r.gameId === g.id && r.personId === cartBorrowerId);
                        if (already) { alreadyCount++; return; }
                        newReservations.push({ id: `res-${now}-${idx}`, gameId: g.id, gameTitle: g.title, personId: cartBorrowerId, createdAt: now + idx, updatedAt: now + idx });
                    });
                    if (newReservations.length > 0) {
                        setReservations(prev => [...prev, ...newReservations]);
                        const logEntries = newReservations.map(r => ({ id: `rlog-${r.id}`, gameId: r.gameId, gameTitle: r.gameTitle, personId: r.personId, personLabel: borrowerName, event: 'joined', timestamp: r.createdAt }));
                        setReservationLog(prev => [...logEntries, ...prev]);
                        setLastAction({
                            label: `Interesse registrado em ${newReservations.length} jogo(s) para ${borrowerName}`,
                            restore: () => {
                                const idsToRemove = new Set(newReservations.map(r => r.id));
                                const logIdsToRemove = new Set(logEntries.map(l => l.id));
                                setReservations(prev => prev.filter(r => !idsToRemove.has(r.id)));
                                setReservationLog(prev => prev.filter(l => !logIdsToRemove.has(l.id)));
                            }
                        });
                    }
                    let msg = newReservations.length > 0 ? `${newReservations.length} jogo(s) adicionados à fila de ${borrowerName}!` : `${borrowerName} já estava na fila de todos os jogos selecionados.`;
                    if (alreadyCount > 0 && newReservations.length > 0) msg += ` (${alreadyCount} já estava(m) na fila)`;
                    notify(msg, newReservations.length > 0 ? "success" : "error");

                    setCartGameIds(new Set()); setIsCartMode(false); setShowCartCheckout(false); setCartBorrowerId(''); setCartDueDate(''); setCartQueueChoices({}); setCartPurpose('loan');
                    return;
                }

                // Modo empréstimo
                let formattedDueDate = '';
                if (cartDueDate) {
                    const d = new Date(cartDueDate);
                    d.setMinutes(d.getMinutes() + d.getTimezoneOffset());
                    formattedDueDate = d.toLocaleDateString('pt-BR');
                }
                const startDate = new Date().toLocaleDateString('pt-BR');

                const allTargetGames = games.filter(g => cartGameIds.has(g.id) && g.status === 'available');
                // Jogos com fila em que a pessoa escolhida não é a primeira — só nesses existe
                // conflito de verdade; nos demais, o jogo sempre é emprestado normalmente.
                const conflictIds = new Set(allTargetGames.filter(g => {
                    const queue = getGameQueue(g.id);
                    return queue.length > 0 && queue[0].personId !== cartBorrowerId;
                }).map(g => g.id));
                // "Emprestar mesmo assim" só é permitido pra admin. Sem login, a escolha padrão
                // e as opções disponíveis são só "entrar na fila" ou "ignorar" (nem empresta, nem entra na fila).
                const getChoiceFor = (gameId) => {
                    if (!conflictIds.has(gameId)) return 'lend';
                    const explicit = cartQueueChoices[gameId];
                    if (explicit && (isLoggedIn || explicit !== 'lend')) return explicit;
                    return isLoggedIn ? 'lend' : 'queue';
                };
                const toLendGames = allTargetGames.filter(g => getChoiceFor(g.id) === 'lend');
                const toQueueGames = allTargetGames.filter(g => getChoiceFor(g.id) === 'queue');
                const toSkipGames = allTargetGames.filter(g => getChoiceFor(g.id) === 'skip');

                if (allTargetGames.length === 0) { notify("Nenhum jogo disponível no carrinho.", "error"); return; }

                let historyItemsCreated = [];
                if (toLendGames.length > 0) {
                    historyItemsCreated = toLendGames.map((g, idx) => ({
                        id: `loan-${now}-${idx}`,
                        gameTitle: g.title, gameId: g.id,
                        borrower: borrowerName, borrowerId: cartBorrowerId,
                        loanDate: startDate, loanDueDate: formattedDueDate,
                        returnDate: '-', status: 'active', image: g.image, updatedAt: now
                    }));
                    const loanIdByGameId = {};
                    historyItemsCreated.forEach(h => { loanIdByGameId[h.gameId] = h.id; });
                    setGames(prev => prev.map(g => loanIdByGameId[g.id] ? { ...g, status: 'loaned', borrower: borrowerName, borrowerId: cartBorrowerId, loanDate: startDate, loanDueDate: formattedDueDate, loanId: loanIdByGameId[g.id], updatedAt: now } : g));
                    setHistory(prev => [...historyItemsCreated, ...prev]);
                    // Remove reservas dessa pessoa nos jogos que ela acabou de pegar — o pedido já foi atendido
                    toLendGames.forEach(g => {
                        const existing = reservations.find(r => r.gameId === g.id && r.personId === cartBorrowerId);
                        if (existing) removeReservation(existing.id, 'fulfilled');
                    });
                }

                let reservationsCreated = [];
                let queueLogEntries = [];
                if (toQueueGames.length > 0) {
                    toQueueGames.forEach((g, idx) => {
                        const already = reservations.find(r => r.gameId === g.id && r.personId === cartBorrowerId);
                        if (already) return;
                        reservationsCreated.push({ id: `res-${now}-${idx}`, gameId: g.id, gameTitle: g.title, personId: cartBorrowerId, createdAt: now + idx, updatedAt: now + idx });
                    });
                    if (reservationsCreated.length > 0) {
                        setReservations(prev => [...prev, ...reservationsCreated]);
                        queueLogEntries = reservationsCreated.map(r => ({ id: `rlog-${r.id}`, gameId: r.gameId, gameTitle: r.gameTitle, personId: r.personId, personLabel: borrowerName, event: 'joined', timestamp: r.createdAt }));
                        setReservationLog(prev => [...queueLogEntries, ...prev]);
                    }
                }

                if (historyItemsCreated.length === 0 && reservationsCreated.length === 0) {
                    notify(toSkipGames.length > 0 ? "Todos os jogos do carrinho foram ignorados." : "Nada para confirmar.", "error");
                    return;
                }

                setLastAction({
                    label: `Carrinho: ${historyItemsCreated.length} emprestado(s)${reservationsCreated.length > 0 ? ` + ${reservationsCreated.length} na fila` : ''} para ${borrowerName}`,
                    restore: () => {
                        const undoNow = Date.now();
                        if (historyItemsCreated.length > 0) {
                            const loanIdSet = new Set(historyItemsCreated.map(h => h.id));
                            setGames(prev => prev.map(g => (g.loanId && loanIdSet.has(g.loanId)) ? { ...g, status: 'available', borrower: '', loanDate: null, loanDueDate: null, loanId: null, updatedAt: undoNow } : g));
                            setHistory(prev => prev.filter(h => !loanIdSet.has(h.id)));
                        }
                        if (reservationsCreated.length > 0) {
                            const resIdSet = new Set(reservationsCreated.map(r => r.id));
                            const logIdSet = new Set(queueLogEntries.map(l => l.id));
                            setReservations(prev => prev.filter(r => !resIdSet.has(r.id)));
                            setReservationLog(prev => prev.filter(l => !logIdSet.has(l.id)));
                        }
                    }
                });

                const totalAfter = history.length + historyItemsCreated.length;
                if (historyItemsCreated.length > 0 && Math.floor(totalAfter / 10) > Math.floor(history.length / 10)) fireConfetti();

                let msg = '';
                if (historyItemsCreated.length > 0) msg += `${historyItemsCreated.length} jogo(s) emprestado(s) para ${borrowerName}!`;
                if (reservationsCreated.length > 0) msg += `${msg ? ' ' : ''}${reservationsCreated.length} adicionado(s) à fila.`;
                if (toSkipGames.length > 0) msg += `${msg ? ' ' : ''}${toSkipGames.length} ignorado(s).`;
                notify(msg, "success");

                setCartGameIds(new Set());
                setIsCartMode(false);
                setShowCartCheckout(false);
                setCartBorrowerId('');
                setCartDueDate('');
                setCartQueueChoices({});
            };

            const handleReturn = () => {
                const returnDate = new Date().toLocaleDateString('pt-BR');
                const now = Date.now();
                const wasOnTime = !isOverdue(modalGame.loanDueDate);
                const gameId = modalGame.id;
                const loanId = modalGame.loanId;
                const gameTitle = modalGame.title;
                const preReturn = { borrower: modalGame.borrower, borrowerId: modalGame.borrowerId, loanDate: modalGame.loanDate, loanDueDate: modalGame.loanDueDate, loanId: modalGame.loanId };
                const updatedGame = { ...modalGame, status: 'available', borrower: '', loanDate: null, loanDueDate: null, loanId: null, updatedAt: now };
                setHistory(prev => prev.map(h => h.id === modalGame.loanId ? { ...h, returnDate: returnDate, status: 'completed', updatedAt: now } : h));
                setGames(prev => prev.map(g => g.id === modalGame.id ? updatedGame : g));
                setModalGame(updatedGame);
                if (wasOnTime) { fireConfetti(); notify("🎉 Devolvido no prazo!"); } else { notify("Devolução registrada!"); }
                const queue = getGameQueue(modalGame.id);
                if (queue.length > 0) setReservationAlert({ items: [{ gameId: modalGame.id, gameTitle: modalGame.title, queue }] });

                setLastAction({
                    label: `Devolução de "${gameTitle}"`,
                    restore: () => {
                        const undoNow = Date.now();
                        setGames(prev => prev.map(g => g.id === gameId ? { ...g, status: 'loaned', ...preReturn, updatedAt: undoNow } : g));
                        setHistory(prev => prev.map(h => h.id === loanId ? { ...h, status: 'active', returnDate: '-', updatedAt: undoNow } : h));
                        setModalGame(prev => (prev && prev.id === gameId) ? { ...prev, status: 'loaned', ...preReturn, updatedAt: undoNow } : prev);
                    }
                });
            };

            const handleQuickReturn = (historyItem) => {
                if (!confirm(`Confirmar devolução de "${historyItem.gameTitle}"?`)) return;
                const returnDate = new Date().toLocaleDateString('pt-BR');
                const now = Date.now();
                const wasOnTime = !isOverdue(historyItem.loanDueDate);
                const game = games.find(g => g.id === historyItem.gameId) || games.find(g => g.title === historyItem.gameTitle);
                const gameId = game ? game.id : null;
                const loanId = historyItem.id;
                const gameTitle = historyItem.gameTitle;
                const preReturn = game ? { borrower: game.borrower, borrowerId: game.borrowerId, loanDate: game.loanDate, loanDueDate: game.loanDueDate, loanId: game.loanId } : null;
                setHistory(prev => prev.map(h => h.id === historyItem.id ? { ...h, returnDate: returnDate, status: 'completed', updatedAt: now } : h));
                if (game) { const updatedGame = { ...game, status: 'available', borrower: '', loanDate: null, loanDueDate: null, loanId: null, updatedAt: now }; setGames(prev => prev.map(g => g.id === game.id ? updatedGame : g)); }
                if (wasOnTime) { fireConfetti(); notify("🎉 Devolvido no prazo!"); } else { notify("Devolução registrada via histórico!"); }
                if (game) {
                    const queue = getGameQueue(game.id);
                    if (queue.length > 0) setReservationAlert({ items: [{ gameId: game.id, gameTitle: game.title, queue }] });
                }

                setLastAction({
                    label: `Devolução de "${gameTitle}"`,
                    restore: () => {
                        const undoNow = Date.now();
                        if (gameId && preReturn) setGames(prev => prev.map(g => g.id === gameId ? { ...g, status: 'loaned', ...preReturn, updatedAt: undoNow } : g));
                        setHistory(prev => prev.map(h => h.id === loanId ? { ...h, status: 'active', returnDate: '-', updatedAt: undoNow } : h));
                    }
                });
            };

            // Devolução em massa: recebe a lista de jogos (objetos completos) a devolver e faz
            // tudo de uma vez — usada tanto pela seleção de jogos na grade/lista quanto pela
            // seleção de linhas no Histórico.
            const executeBulkReturn = (gamesToReturn) => {
                if (gamesToReturn.length === 0) { notify("Nenhum jogo emprestado selecionado.", "error"); return; }
                if (!confirm(`Confirmar devolução de ${gamesToReturn.length} jogo(s)?`)) return;

                const returnDate = new Date().toLocaleDateString('pt-BR');
                const now = Date.now();
                const loanIds = gamesToReturn.map(g => g.loanId).filter(Boolean);
                const preReturnGames = gamesToReturn.map(g => ({ id: g.id, borrower: g.borrower, borrowerId: g.borrowerId, loanDate: g.loanDate, loanDueDate: g.loanDueDate, loanId: g.loanId }));
                const idSet = new Set(gamesToReturn.map(g => g.id));

                setGames(prev => prev.map(g => idSet.has(g.id) ? { ...g, status: 'available', borrower: '', loanDate: null, loanDueDate: null, loanId: null, updatedAt: now } : g));
                setHistory(prev => prev.map(h => loanIds.includes(h.id) ? { ...h, status: 'completed', returnDate, updatedAt: now } : h));

                setLastAction({
                    label: `Devolução em lote de ${gamesToReturn.length} jogo(s)`,
                    restore: () => {
                        const undoNow = Date.now();
                        setGames(prev => prev.map(g => {
                            const pre = preReturnGames.find(p => p.id === g.id);
                            return pre ? { ...g, status: 'loaned', borrower: pre.borrower, borrowerId: pre.borrowerId, loanDate: pre.loanDate, loanDueDate: pre.loanDueDate, loanId: pre.loanId, updatedAt: undoNow } : g;
                        }));
                        setHistory(prev => prev.map(h => loanIds.includes(h.id) ? { ...h, status: 'active', returnDate: '-', updatedAt: undoNow } : h));
                    }
                });

                notify(`${gamesToReturn.length} jogo(s) devolvido(s)!`, "success");

                const queueItems = gamesToReturn
                    .map(g => ({ gameId: g.id, gameTitle: g.title, queue: getGameQueue(g.id) }))
                    .filter(item => item.queue.length > 0);
                if (queueItems.length > 0) setReservationAlert({ items: queueItems });
            };

            // Devolução em massa a partir da seleção de jogos na grade/lista (modo admin)
            const handleBulkReturn = () => {
                const loanedSelected = games.filter(g => selectedGames.has(g.id) && g.status === 'loaned');
                executeBulkReturn(loanedSelected);
                setSelectedGames(new Set());
                setIsSelectionMode(false);
            };

            // Devolução em massa a partir da seleção de linhas no Histórico (modo admin)
            const handleBulkReturnFromHistory = () => {
                const activeSelected = history.filter(h => selectedHistoryIds.has(h.id) && h.status === 'active');
                const relatedGames = activeSelected
                    .map(h => games.find(g => g.id === h.gameId) || games.find(g => g.title === h.gameTitle))
                    .filter(Boolean);
                if (relatedGames.length === 0) { notify("Nenhum empréstimo ativo selecionado.", "error"); return; }
                executeBulkReturn(relatedGames);
                setSelectedHistoryIds(new Set());
                setIsHistorySelectionMode(false);
            };

            // Inicia a edição guardando uma "foto" do formulário, usada depois para saber se
            // algo foi alterado e ainda não foi salvo.
            const startEditing = (formData) => {
                setEditForm(formData);
                editFormSnapshotRef.current = JSON.stringify(formData);
                setIsEditing(true);
            };

            const hasUnsavedChanges = () => isEditing && editFormSnapshotRef.current !== null && JSON.stringify(editForm) !== editFormSnapshotRef.current;

            // Fecha o modal do jogo/wishlist, confirmando antes se houver edição não salva.
            const closeModalGame = () => {
                if (hasUnsavedChanges() && !confirm("Você tem alterações não salvas neste jogo. Deseja realmente sair sem salvar?")) return;
                setIsEditing(false);
                editFormSnapshotRef.current = null;
                setModalGame(null);
            };

            // Sai do modo de edição (volta pra visualização), confirmando antes se houver alterações não salvas.
            // Exceção: se o item é novo e ainda não foi salvo, não existe "visualização" pra voltar —
            // então cancelar fecha o modal inteiro, em vez de mostrar um item fantasma em branco.
            const cancelEditing = () => {
                if (hasUnsavedChanges() && !confirm("Você tem alterações não salvas neste jogo. Deseja realmente cancelar?")) return;
                setIsEditing(false);
                editFormSnapshotRef.current = null;
                if (modalGame && modalGame.id === 'new') setModalGame(null);
            };

            const saveEdit = () => {
                const tagsRaw = editForm.tagsString ? editForm.tagsString.split(',') : [];
                const tags = tagsRaw.map(t => t.trim()).filter(t => t.length > 0);
                const finalGame = { 
                    ...editForm, 
                    tags: tags.length > 0 ? tags : ['Board Game'], 
                    min: Number(editForm.min), 
                    max: Number(editForm.max),
                    rating: Number(editForm.rating || 0),
                    isExpansion: !!editForm.isExpansion,
                    baseGameId: editForm.isExpansion ? editForm.baseGameId : null,
                    sleeveDetail: editForm.sleeveDetail || '',
                    images: (editForm.images || []).filter(url => url && url.trim()),
                    updatedAt: Date.now()
                };
                
                if (editForm.isWishlist) {
                     if (modalGame.id === 'new') {
                         finalGame.id = `w-${Date.now()}`;
                         setWishlist(prev => [...prev, finalGame]);
                     } else {
                         setWishlist(prev => prev.map(w => w.id === modalGame.id ? { ...modalGame, ...finalGame } : w));
                         setModalGame({ ...modalGame, ...finalGame });
                     }
                     editFormSnapshotRef.current = null;
                     setIsEditing(false); notify("Item da lista de desejos salvo!");
                     return;
                }

                if (modalGame.id === 'new') { finalGame.id = `g-${Date.now()}`; finalGame.status = 'available'; setGames(prev => sortGamesList([...prev, finalGame])); setModalGame(finalGame); }
                else { setGames(prev => prev.map(g => g.id === modalGame.id ? { ...modalGame, ...finalGame } : g)); setModalGame({ ...modalGame, ...finalGame }); }
                editFormSnapshotRef.current = null;
                setIsEditing(false); notify("Jogo salvo!");
            };

            // Sincronização manual (força uma verificação/gravação imediata) — usa o mesmo
            // motor de merge do auto-save (syncNow), então nunca sobrescreve o remoto às cegas.
            const handleManualSync = () => syncNow({ silent: false });

            const handleExport = () => {
                const backupData = { games, wishlist, history, people, reservations, reservationLog, meta: { date: new Date().toISOString(), version: "9.8" } };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", `meeplestock_backup_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
                const now = Date.now();
                localStorage.setItem('last_manual_backup_at', String(now));
                setLastManualBackupAt(now);
                notify("Download iniciado!");
            };

            const handleImportClick = () => fileInputRef.current.click();
            const handleFileChange = (event) => {
                const fileReader = new FileReader();
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = e => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed.games || parsed.history) {
                            if(confirm("Substituir dados atuais?")) {
                                if (parsed.games) setGames(parsed.games);
                                if (parsed.wishlist) setWishlist(parsed.wishlist);
                                if (parsed.history) setHistory(parsed.history);
                                if (parsed.people) setPeople(parsed.people);
                                if (parsed.reservations) setReservations(parsed.reservations);
                                if (parsed.reservationLog) setReservationLog(parsed.reservationLog);
                                notify("Dados restaurados!", "success");
                                setShowSettings(false);
                            }
                        } else { notify("Arquivo inválido.", "error"); }
                    } catch (err) { notify("Erro ao ler arquivo.", "error"); }
                };
            };

            const handleCSVImportClick = () => csvInputRef.current.click();
            const handleCSVChange = (event) => {
                const fileReader = new FileReader();
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = e => {
                    try {
                        const rows = e.target.result.split('\n');
                        if (rows.length < 2) { notify("CSV vazio.", "error"); return; }
                        const headers = rows[0].toLowerCase().split(/[;,]/);
                        const titleIdx = headers.findIndex(h => h.includes('name') || h.includes('title') || h.includes('titulo'));
                        
                        if (titleIdx === -1) { notify("Coluna de título não encontrada no CSV.", "error"); return; }

                        let count = 0;
                        const newGames = [];
                        for(let i=1; i<rows.length; i++) {
                            const row = rows[i].split(/[;,]/);
                            if(row.length > titleIdx && row[titleIdx].trim()) {
                                const title = row[titleIdx].trim().replace(/^"|"$/g, ''); // remove quotes
                                if (!games.some(g => g.title === title)) {
                                    newGames.push(generateGameData(title, i));
                                    count++;
                                }
                            }
                        }
                        if (count > 0 && confirm(`Encontrados ${count} novos jogos. Importar?`)) {
                            setGames(prev => sortGamesList([...prev, ...newGames]));
                            notify(`${count} jogos importados!`, 'success');
                            setShowSettings(false);
                        } else if (count === 0) {
                            notify("Nenhum jogo novo encontrado.", "error");
                        }
                    } catch (err) { notify("Erro ao processar CSV.", "error"); }
                };
            };

            // Registra uma exclusão no "tombstone" da coleção, para que o merge com a nuvem
            // saiba que o item foi apagado de propósito (e não apenas "ainda não chegou").
            const markDeleted = (collection, id) => {
                setTombstones(prev => ({ ...prev, [collection]: { ...prev[collection], [id]: Date.now() } }));
            };

            // --- FILA DE RESERVA ---
            const getGameQueue = (gameId) => reservations.filter(r => r.gameId === gameId).sort((a, b) => a.createdAt - b.createdAt);

            // Registra um evento no histórico da fila (append-only): 'joined' (entrou),
            // 'fulfilled' (foi atendido — recebeu o jogo) ou 'removed' (tirado manualmente).
            const logQueueEvent = (gameId, gameTitle, personId, event) => {
                const person = people.find(p => p.id === personId);
                const now = Date.now();
                const entry = { id: `rlog-${now}-${Math.random().toString(36).slice(2, 7)}`, gameId, gameTitle, personId, personLabel: person ? getPersonLabel(person) : 'Pessoa removida', event, timestamp: now };
                setReservationLog(prev => [entry, ...prev]);
                return entry;
            };

            const addReservation = (gameId, personId) => {
                const game = games.find(g => g.id === gameId);
                if (!game) return;
                const already = reservations.find(r => r.gameId === gameId && r.personId === personId);
                if (already) { notify("Essa pessoa já está na fila desse jogo.", "error"); return; }
                const now = Date.now();
                const newRes = { id: `res-${now}`, gameId, gameTitle: game.title, personId, createdAt: now, updatedAt: now };
                setReservations(prev => [...prev, newRes]);
                logQueueEvent(gameId, game.title, personId, 'joined');
                notify("Reserva registrada!");
            };

            const removeReservation = (id, reason = 'removed') => {
                const res = reservations.find(r => r.id === id);
                setReservations(prev => prev.filter(r => r.id !== id));
                markDeleted('reservations', id);
                if (res) logQueueEvent(res.gameId, res.gameTitle, res.personId, reason);
            };

            // Apaga uma linha específica do histórico da fila (admin) — diferente de
            // removeReservation, que tira alguém da fila ATUAL; isso só limpa o registro do
            // evento já acontecido, sem mexer em quem está na fila hoje.
            const deleteLogEntry = (id) => {
                const entry = reservationLog.find(e => e.id === id);
                if (!confirm("Apagar este registro do histórico da fila?")) return;
                setReservationLog(prev => prev.filter(e => e.id !== id));
                if (entry) {
                    setLastAction({
                        label: `Exclusão de registro da fila ("${entry.gameTitle}")`,
                        restore: () => { setReservationLog(prev => [entry, ...prev]); }
                    });
                }
            };

            const buildReservationMessage = (gameTitle, person) => {
                const firstName = getPersonLabel(person).replace(/\(.*/, '').trim().split(' ')[0];
                return `Olá ${firstName}! O jogo "${gameTitle}" que você reservou acabou de ser devolvido e já está disponível pra você pegar! 🎲`;
            };

            // Bloco da fila de reserva de um jogo — reutilizado tanto na tela de empréstimo
            // (jogo disponível) quanto na tela de devolução (jogo emprestado), pra fila ficar
            // visível nos dois casos. excludePersonId tira alguém da lista de "Reservar para"
            // (ex: quem já está com o jogo emprestado no momento).
            const renderReservationQueueSection = (gameId, excludePersonId) => {
                const queue = getGameQueue(gameId);
                return (
                    <div>
                        <p className="text-xs font-bold text-slate-500 dark:text-dark-muted uppercase mb-2">Fila de Reserva</p>
                        {queue.length > 0 ? (
                            <div className="space-y-1 mb-2">
                                {queue.map((r, i) => {
                                    const resPerson = people.find(p => p.id === r.personId);
                                    return (
                                        <div key={r.id} className="flex items-center justify-between gap-2 bg-white dark:bg-slate-800 px-3 py-1.5 rounded-lg text-xs">
                                            <span className="font-bold text-slate-700 dark:text-dark-text truncate">{i + 1}º — {resPerson ? getPersonLabel(resPerson) : 'Pessoa removida'}</span>
                                            {isLoggedIn && <button onClick={() => removeReservation(r.id)} className="text-red-400 hover:text-red-600 shrink-0" title="Remover da fila (admin)"><Icons.X size={14}/></button>}
                                        </div>
                                    );
                                })}
                            </div>
                        ) : (
                            <p className="text-xs text-slate-400 mb-2">Ninguém na fila deste jogo.</p>
                        )}
                        <div className="flex gap-2">
                            <select className="flex-1 border border-slate-200 dark:border-slate-600 rounded-lg text-xs p-2 dark:bg-slate-700 dark:text-white" value={reservationPickerPersonId} onChange={e => setReservationPickerPersonId(e.target.value)}>
                                <option value="">Reservar para...</option>
                                {people.filter(p => p.id !== excludePersonId).map(p => <option key={p.id} value={p.id}>{getPersonLabel(p)}</option>)}
                            </select>
                            <button onClick={() => { if (!reservationPickerPersonId) { notify("Selecione uma pessoa.", "error"); return; } addReservation(gameId, reservationPickerPersonId); setReservationPickerPersonId(''); }} className="bg-slate-700 dark:bg-slate-600 hover:bg-slate-800 text-white px-3 rounded-lg text-xs font-bold shrink-0 transition-colors" title="Adicionar essa pessoa à fila de reserva">Reservar</button>
                        </div>
                    </div>
                );
            };

            const handleDelete = () => { 
                if(modalGame.id === 'new') { setModalGame(null); return; } 
                if(confirm(`EXCLUIR "${modalGame.title}"?`)) { 
                    const deletedItem = { ...modalGame };
                    const wasWishlist = viewMode === 'wishlist';
                    if (wasWishlist) {
                        setWishlist(prev => prev.filter(w => w.id !== modalGame.id));
                        markDeleted('wishlist', modalGame.id);
                    } else {
                        setGames(prev => prev.filter(g => g.id !== modalGame.id)); 
                        markDeleted('games', modalGame.id);
                    }
                    setModalGame(null); 
                    notify("Item excluído.", "error"); 

                    setLastAction({
                        label: `Exclusão de "${deletedItem.title}"`,
                        restore: () => {
                            const undoNow = Date.now();
                            if (wasWishlist) setWishlist(prev => [...prev, { ...deletedItem, updatedAt: undoNow }]);
                            else setGames(prev => sortGamesList([...prev, { ...deletedItem, updatedAt: undoNow }]));
                        }
                    });
                } 
            };
            const clearHistory = () => {
                if(!confirm("Apagar APENAS concluídos?")) return;
                const removedItems = history.filter(item => item.status !== 'active');
                setHistory(prev => {
                    prev.filter(item => item.status !== 'active').forEach(item => markDeleted('history', item.id));
                    return prev.filter(item => item.status === 'active');
                });
                notify("Histórico limpo.");
                if (removedItems.length > 0) {
                    setLastAction({
                        label: `Limpeza de ${removedItems.length} registro(s) do histórico`,
                        restore: () => {
                            const undoNow = Date.now();
                            setHistory(prev => [...prev, ...removedItems.map(item => ({ ...item, updatedAt: undoNow }))]);
                        }
                    });
                }
            };
            const deleteHistoryItem = (id) => {
                if(!confirm("Apagar registro?")) return;
                const deletedItem = history.find(item => item.id === id);
                setHistory(prev => prev.filter(item => item.id !== id));
                markDeleted('history', id);
                if (deletedItem) {
                    setLastAction({
                        label: `Exclusão do registro de "${deletedItem.gameTitle}"`,
                        restore: () => { setHistory(prev => [...prev, { ...deletedItem, updatedAt: Date.now() }]); }
                    });
                }
            };

            // --- SELEÇÃO EM MASSA NO HISTÓRICO (excluir vários registros concluídos de uma vez) ---
            const toggleHistorySelectionMode = () => {
                if (isHistorySelectionMode) { setSelectedHistoryIds(new Set()); setIsHistorySelectionMode(false); }
                else { setIsHistorySelectionMode(true); }
            };
            const toggleHistoryItemSelection = (e, id) => {
                if (e && e.stopPropagation) e.stopPropagation();
                const newSet = new Set(selectedHistoryIds);
                if (newSet.has(id)) newSet.delete(id);
                else newSet.add(id);
                setSelectedHistoryIds(newSet);
            };
            const handleBulkDeleteHistory = () => {
                const deletableItems = history.filter(h => selectedHistoryIds.has(h.id) && h.status === 'completed');
                if (deletableItems.length === 0) { notify("Nenhum registro concluído selecionado.", "error"); return; }
                if (!confirm(`Excluir ${deletableItems.length} registro(s) do histórico?`)) return;

                const idsToDelete = new Set(deletableItems.map(h => h.id));
                setHistory(prev => prev.filter(h => !idsToDelete.has(h.id)));
                deletableItems.forEach(h => markDeleted('history', h.id));

                setLastAction({
                    label: `Exclusão de ${deletableItems.length} registro(s) do histórico`,
                    restore: () => {
                        const undoNow = Date.now();
                        setHistory(prev => [...deletableItems.map(h => ({ ...h, updatedAt: undoNow })), ...prev]);
                    }
                });

                notify(`${deletableItems.length} registro(s) excluído(s).`, "success");
                setSelectedHistoryIds(new Set());
                setIsHistorySelectionMode(false);
            };

            const uniqueTags = useMemo(() => { const t = new Set(); games.forEach(g => g.tags.forEach(tag => t.add(tag))); return Array.from(t).sort(); }, [games]);
            
            const filteredGames = useMemo(() => {
                let result = games.filter(g => {
                    const matchSearch = titleMatchesSearch(g.title, search);
                    const matchTag = filters.tag === 'all' || g.tags.includes(filters.tag);
                    let matchPlayers = true; if (filters.players) { const p = parseInt(filters.players); if (!isNaN(p)) matchPlayers = g.min <= p && g.max >= p; }
                    let matchTime = true; if (filters.time !== 'all') { const t = parseInt(g.time); if (!isNaN(t)) { if (filters.time === 'short') matchTime = t < 30; else if (filters.time === 'medium') matchTime = t >= 30 && t <= 60; else if (filters.time === 'long') matchTime = t > 60; } }
                    let matchRating = true; if (filters.rating !== 'all') matchRating = (g.rating || 0) >= 4;
                    return matchSearch && matchTag && matchPlayers && matchTime && matchRating;
                });
                
                result.sort((a, b) => {
                    if (sortOrder === 'newest') {
                        const getTs = (id) => { try { return parseInt(id.split('-')[1]); } catch(e){ return 0; } };
                        return getTs(b.id) - getTs(a.id);
                    }
                    const titleA = a.title.toLowerCase();
                    const titleB = b.title.toLowerCase();
                    if (sortOrder === 'asc') return titleA.localeCompare(titleB);
                    else return titleB.localeCompare(titleA);
                });

                return result;
            }, [games, search, filters, sortOrder]);

            const openRandomizerSetup = () => setShowRandomizerSetup(true);

            // Quantidade efetiva de jogadores presentes = pessoas selecionadas na lista +
            // pessoas somadas manualmente (que não estão na lista). "manualExtra" guarda só a
            // parte extra; a contagem final é sempre a soma dinâmica das duas partes, então
            // marcar/desmarcar uma pessoa nunca apaga o que foi somado à mão, e vice-versa.
            const getRandomizerPresentCount = () => randomizerFilter.presentIds.length + (randomizerFilter.manualExtra || 0);

            const runRandomizer = () => {
                let candidates;
                if (randomizerFilter.mode === 'presence') {
                    candidates = games.filter(g => g.status === 'available');
                    const count = getRandomizerPresentCount();
                    if (count > 0) {
                        candidates = candidates.filter(g => g.min <= count && g.max >= count);
                    }
                    if (randomizerFilter.timeMinutes) {
                        const maxT = parseInt(randomizerFilter.timeMinutes);
                        if (!isNaN(maxT)) candidates = candidates.filter(g => { const t = parseInt(g.time); return isNaN(t) || t <= maxT; });
                    }
                } else {
                    candidates = filteredGames.filter(g => g.status === 'available');
                }
                if (candidates.length === 0) { notify("Nenhum jogo disponível com esses critérios.", "error"); return; }
                setRandomizerPool(candidates);
                setShowRandomizerSetup(false);
                setShowRandomizer(true);
            };

            const finishRandomizer = () => {
                setShowRandomizer(false);
                const winner = randomizerPool[Math.floor(Math.random() * randomizerPool.length)];
                if (!winner) return;
                setModalGame(winner);
                setBorrowerId('');
                setShowQRCode(false);
                setIsEditing(false);
                notify(`O escolhido foi: ${winner.title}!`, "success");
            };

            // Game List Renderer
            const renderGameList = () => {
                if (viewMode === 'history') {
                    return (
                        <div className="animate-fade-in max-w-4xl mx-auto">
                            <div className="flex flex-col items-center text-center sm:text-left sm:flex-row sm:justify-between mb-4 gap-4">
                                <h2 className="text-2xl font-bold text-slate-800 dark:text-dark-text flex items-center justify-center sm:justify-start gap-2"><Icons.History/> Histórico</h2>
                                <div className="flex gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-lg">
                                    <button onClick={() => setHistorySubView('loans')} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-colors ${historySubView === 'loans' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`} title="Ver histórico de empréstimos">Empréstimos</button>
                                    <button onClick={() => setHistorySubView('queue')} className={`px-3 py-1.5 rounded-md text-xs font-bold transition-colors ${historySubView === 'queue' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`} title="Ver fila de reserva">Fila de Reserva</button>
                                </div>
                            </div>

                            {historySubView === 'loans' && (
                            <>
                            <div className="flex flex-col items-center text-center sm:text-left sm:flex-row sm:justify-end mb-6 gap-4">
                                <div className="flex gap-2 flex-wrap justify-center sm:justify-end">
                                    <select className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-dark-border rounded-lg py-1.5 px-3 text-sm outline-none dark:text-white" value={historyFilter.person} onChange={e => setHistoryFilter({...historyFilter, person: e.target.value})}>
                                        <option value="all">Todas as Pessoas</option>
                                        {people.sort((a,b) => a.name.localeCompare(b.name)).map(p => <option key={p.id} value={p.id}>{getPersonLabel(p)}</option>)}
                                    </select>
                                    <select className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-dark-border rounded-lg py-1.5 px-3 text-sm outline-none dark:text-white" value={historyFilter.sort} onChange={e => setHistoryFilter({...historyFilter, sort: e.target.value})}>
                                        <option value="dateDesc">Mais Recentes</option>
                                        <option value="dateAsc">Mais Antigos</option>
                                        <option value="durationDesc">Maior Duração</option>
                                        <option value="durationAsc">Menor Duração</option>
                                    </select>
                                    {filteredHistory.length > 0 && isLoggedIn && (
                                        <button onClick={toggleHistorySelectionMode} className={`px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors ${isHistorySelectionMode ? 'bg-indigo-100 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-dark-border text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700'}`} title="Selecionar vários registros para devolver ou excluir">
                                            <Icons.CheckSquare size={16}/> {isHistorySelectionMode ? 'Cancelar' : 'Selecionar'}
                                        </button>
                                    )}
                                    {filteredHistory.some(h => h.status === 'completed') && isLoggedIn && !isHistorySelectionMode && (
                                        <button onClick={clearHistory} className="bg-white dark:bg-slate-800 border border-red-200 dark:border-red-900 text-red-600 dark:text-red-400 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-2 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors" title="Apagar todos os registros concluídos">
                                            <Icons.Eraser size={16}/> Limpar
                                        </button>
                                    )}
                                    {historyFilter.person !== 'all' && getActiveLoansForPerson(historyFilter.person).length > 0 && (() => {
                                        const person = people.find(p => p.id === historyFilter.person);
                                        const loans = getActiveLoansForPerson(historyFilter.person);
                                        return person ? (
                                            <a
                                                href={buildWhatsAppLink(person.phone, buildPersonLoansMessage(person, loans))}
                                                target="_blank" rel="noreferrer"
                                                onClick={() => notify(`Lista de jogos de ${person.name.split(' ')[0]} pronta para envio!`)}
                                                className="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors"
                                            >
                                                <Icons.Whatsapp size={16}/> Enviar Lista ({loans.length})
                                            </a>
                                        ) : null;
                                    })()}
                                </div>
                            </div>
                            <div className="bg-white dark:bg-dark-card rounded-2xl border border-slate-200 dark:border-dark-border shadow-sm table-container">
                                {filteredHistory.length === 0 ? <div className="p-12 text-center text-slate-400 dark:text-dark-muted">Nenhum registro.</div> : (
                                    <div className="overflow-x-auto overflow-y-auto max-h-[65vh] w-full">
                                        <table className="w-full text-left text-sm whitespace-nowrap sm:whitespace-normal">
                                            <thead className="sticky top-0 z-10 bg-slate-50 dark:bg-slate-800 border-b border-slate-100 dark:border-dark-border text-slate-50 dark:text-dark-muted uppercase text-xs font-bold"><tr>{isHistorySelectionMode && <th className="p-2 sm:p-4 w-10"></th>}<th className="p-2 sm:p-4">Jogo</th><th className="p-2 sm:p-4">Quem Pegou?</th><th className="p-2 sm:p-4">Datas</th><th className="p-2 sm:p-4 text-center">Status</th><th className="p-2 sm:p-4 w-10"></th></tr></thead>
                                            <tbody className="divide-y divide-slate-50 dark:divide-dark-border">{filteredHistory.map(item => { const isHistSelected = selectedHistoryIds.has(item.id); return (<tr key={item.id} onClick={() => { 
                                                if (isHistorySelectionMode) { toggleHistoryItemSelection(null, item.id); return; }
                                                const game = games.find(g => g.id === item.gameId) || games.find(g => g.title === item.gameTitle); 
                                                if(game) { setModalGame(game); setIsEditing(false); setBorrowerId(''); } 
                                                else { notify("Jogo não encontrado no acervo.", "error"); }
                                            }} className={`cursor-pointer transition-colors ${isHistSelected ? 'bg-indigo-50 dark:bg-indigo-900/20' : item.status === 'active' ? (isOverdue(item.loanDueDate) ? "bg-red-50/40 dark:bg-red-900/20 hover:bg-red-50 dark:hover:bg-red-900/30" : "bg-amber-50/30 dark:bg-amber-900/20 hover:bg-amber-50 dark:hover:bg-amber-900/30") : "hover:bg-slate-50 dark:hover:bg-slate-800"}`}>{isHistorySelectionMode && (<td className="p-2 sm:p-4"><div className={`w-5 h-5 rounded border-2 flex items-center justify-center ${isHistSelected ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 bg-white'}`}>{isHistSelected && <Icons.Check size={12}/>}</div></td>)}<td className="p-2 sm:p-4 font-bold text-slate-800 dark:text-dark-text flex items-center gap-3"><div className="w-8 h-8 rounded bg-slate-200 dark:bg-slate-700 overflow-hidden shrink-0"><img src={getOptimizedImage(item.image, 60, 60)} className="w-full h-full object-cover" onError={handleThumbImageError(item.image)}/></div><span className="truncate max-w-[120px] sm:max-w-none">{item.gameTitle}</span></td><td className="p-2 sm:p-4 text-indigo-600 dark:text-indigo-400 font-medium"><span className="hover:underline" onClick={(e) => { e.stopPropagation(); const person = item.borrowerId ? people.find(p => p.id === item.borrowerId) : people.find(p => getPersonLabel(p) === item.borrower); if (person) setHistoryFilter(prev => ({...prev, person: person.id})); else notify("Pessoa não encontrada no cadastro.", "error"); }}>{item.borrower}</span></td><td className="p-2 sm:p-4 text-slate-500 dark:text-dark-muted text-xs"><div className="flex flex-col"><span>Saída: {item.loanDate}</span>{item.returnDate !== '-' && <span>Volta: {item.returnDate}</span>}</div></td><td className="p-2 sm:p-4 text-center">{item.status === 'active' ? <div className="flex items-center justify-center gap-2"><span className={`text-[10px] font-bold px-2 py-1 rounded-full uppercase border ${isOverdue(item.loanDueDate) ? 'bg-red-100 dark:bg-red-900/50 text-red-700 dark:text-red-400 border-red-200 dark:border-red-900 animate-pulse-glow' : 'bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-400 border-amber-200 dark:border-amber-900'}`}>{isOverdue(item.loanDueDate) ? 'Atrasado' : 'Emprestado'}</span>
