    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes expand { from { max-height: 0; opacity: 0; } to { max-height: 1000px; opacity: 1; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes confettiFall { 0% { transform: translateY(-10px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(540deg); opacity: 0; } }
        
        .animate-slide-in-right { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards; }
        .animate-expand { animation: expand 0.5s ease-in-out forwards; overflow: hidden; }
        .animate-spin { animation: spin 1s linear infinite; }
        .animate-pulse-glow { animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(15, 23, 42, 0.95); border-bottom-color: #334155; }
        .modal-content { max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .modal-scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 1rem; }
        
        input, select, textarea { font-size: 16px !important; }

        /* Print Specific Styles */
        @media print {
            body { background: white; color: black; }
            .no-print, header, .fixed, button:not(.print-btn) { display: none !important; }
            .print-only { display: block !important; }
            .page-break { page-break-inside: avoid; }
            #root { margin: 0; padding: 0; }
            main { padding: 0; margin: 0; max-width: 100%; }
            .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        }
        .print-only { display: none; }
    </style>
</head>

        // A Ludopedia costuma nomear a capa "..._t.jpg" (thumbnail/miniatura). Em vários casos
        // existe uma versão maior no mesmo lugar, só sem o sufixo — vale tentar como primeira
        // opção; se não existir, o onError cai sozinho de volta pra miniatura original.
        const getBigImageCandidate = (url) => {
            if (!url) return '';
            const bigger = url.replace(/_t(\.[a-zA-Z]{3,4})(\?.*)?$/, '$1$2');
            return bigger !== url ? bigger : '';
        };

        // Camada de FUNDO: preenche tudo, mas desfocada DE PROPÓSITO — isso disfarça qualquer
        // esticamento em vez de expor ele cru e pixelado.
        const getHeroBackgroundImage = (url) => {
            if (!url || url.length < 5) return FALLBACK_IMAGE;
            return `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=1000&h=450&fit=cover&we&blur=30&q=60`;
        };
        // Camada da FRENTE (capa nítida): sem o parâmetro "we" (with enlargement) do wsrv.nl —

        // origem for pequena, ela aparece no tamanho real (nítida) em vez de esticada e borrada.
        const getHeroForegroundImage = (url) => {
            if (!url || url.length < 5) return FALLBACK_IMAGE;

        const scrapeLudopedia = async (gameTitle, customUrl = '') => {
            let targetUrl;
            if (customUrl && customUrl.trim().length > 0) {
                targetUrl = customUrl.trim();
            } else if (gameTitle) {
                let slug = gameTitle.toLowerCase()
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, "")
                    .replace(/[^a-z0-9\s-]/g, "")
                    .trim()
                    .replace(/\s+/g, "-");
                targetUrl = `https://ludopedia.com.br/jogo/${slug}`;
            } else {
                return { success: false, error: "Sem título ou link" };
            }

            // Serviços de proxy CORS públicos e compartilhados vêm e vão (o corsproxy.io, por
            // exemplo, passou a exigir pagamento) e são frequentemente bloqueados por
            // bloqueadores de anúncios/DNS filtrado, já que milhares de sites usam os mesmos.
            // Se a pessoa configurou um proxy pessoal (Settings → "Proxy Pessoal"), ele é
            // tentado primeiro — por ser de uso exclusivo, tende a ser bem mais confiável.
            const personalProxy = (localStorage.getItem('personal_proxy_url') || '').trim();
            const proxyAttempts = [
                ...(personalProxy ? [{ name: 'proxy-pessoal', build: (url) => `${personalProxy}${personalProxy.includes('?') ? '&' : '?'}url=${encodeURIComponent(url)}`, parse: (res) => res.text() }] : []),
                { name: 'codetabs', build: (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`, parse: (res) => res.text() },
                { name: 'allorigins-raw', build: (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}&t=${Date.now()}`, parse: (res) => res.text() },
                { name: 'allorigins-get', build: (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}&t=${Date.now()}`, parse: async (res) => (await res.json())?.contents || '' },
                { name: 'thingproxy', build: (url) => `https://thingproxy.freeboard.io/fetch/${url}`, parse: (res) => res.text() }
            ];

            let htmlContent = null;
            const attemptErrors = [];

            for (const attempt of proxyAttempts) {
                try {
                    const response = await fetch(attempt.build(targetUrl));
                    if (!response.ok) { attemptErrors.push(`${attempt.name}: HTTP ${response.status}`); continue; }
                    const text = await attempt.parse(response);
                    if (text && text.length > 500 && !text.includes("404 Not Found")) {
                        htmlContent = text;
                        break;
                    }
                    attemptErrors.push(`${attempt.name}: resposta vazia/inválida`);
                } catch (e) {
                    attemptErrors.push(`${attempt.name}: ${(e && e.message) || 'erro de rede/CORS'}`);
                }
            }

            if (!htmlContent) return { success: false, error: `Falha ao acessar Ludopedia. Tente o link manual. [${attemptErrors.join(' | ')}]` };


            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, "text/html");

                const ogImage = doc.querySelector('meta[property="og:image"]')?.content;
                const ogDesc = doc.querySelector('meta[property="og:description"]')?.content;
                const ogTitle = doc.querySelector('meta[property="og:title"]')?.content;
                const textContent = doc.body.innerText || "";

                let min = 2, max = 4;
                const playersMatch = textContent.match(/(\d+)\s*(?:a|-)\s*(\d+)\s*jogadores/i);
                const singlePlayerMatch = textContent.match(/(\d+)\s*jogadores/i);

                if (playersMatch) {
                    min = parseInt(playersMatch[1]);
                    max = parseInt(playersMatch[2]);
                } else if (singlePlayerMatch) {
                    min = parseInt(singlePlayerMatch[1]);
                    max = min;
                }

                let time = "30";
                const timeMatch = textContent.match(/(\d+)\s*min/i);
                if (timeMatch) time = timeMatch[1];

                const extractTags = () => {
                    const rawTags = new Set();
                    const links = doc.querySelectorAll('a[href*="/mecanica/"], a[href*="/dominio/"], a[href*="/categoria/"]');
                    const blockList = ["Jogos Expert", "Jogos Família", "Jogos Infantis", "Jogos Leves", "Jogos Médios", "Jogos Pesados", "Jogos Festivos"];
                    links.forEach(link => {
                        const text = link.innerText.trim();
                        if(text && text.length > 1 && !blockList.includes(text)) {
                            rawTags.add(text);
                        }
                    });
                    return Array.from(rawTags);
                };
                
                const fetchedTags = extractTags();
                let extractedTitle = ogTitle ? ogTitle.replace(" - Ludopedia", "").trim() : gameTitle;
                const finalTags = fetchedTags.length > 0 ? fetchedTags : generateInitialTags(extractedTitle, ogDesc);

                return {
                    success: true,
                    data: {
                        title: extractedTitle || gameTitle,
                        image: getBigImageCandidate(ogImage) || ogImage || '',
                        desc: ogDesc || 'Descrição não encontrada.',
                        min, max, time,
                        tags: finalTags
                    }
                };
            } catch (error) {
                return { success: false, error: "Erro ao processar dados: " + error.message };
            }
        };

        // --- GURU COMPONENT (V9.8) ---
        const GameGuru = ({ isOpen, onClose, games, onSelect }) => {
            const [step, setStep] = React.useState(0);
            const [answers, setAnswers] = React.useState({ players: 0, time: '', vibe: '' });
            const [result, setResult] = React.useState(null);

            const handleAnswer = (key, value) => {
                const newAnswers = { ...answers, [key]: value };
                setAnswers(newAnswers);
                
                if (key === 'vibe') {
                    // Logic to find result
                    let candidates = games.filter(g => g.status === 'available');
                    
                    // Filter Players
                    const p = newAnswers.players;
                    if (p > 0) candidates = candidates.filter(g => g.min <= p && g.max >= p);

                    // Filter Time
                    if (newAnswers.time === 'short') candidates = candidates.filter(g => parseInt(g.time) < 30);
                    if (newAnswers.time === 'medium') candidates = candidates.filter(g => parseInt(g.time) >= 30 && parseInt(g.time) <= 60);
                    if (newAnswers.time === 'long') candidates = candidates.filter(g => parseInt(g.time) > 60);

                    // Filter Vibe (Scoring)
                    const vibeMap = {
                        'party': ['Party Game', 'Bluff', 'Dexterity', 'Trivia', 'Quiz', 'Imagem e Ação', 'Jogos Festivos'],
                        'strategy': ['Estratégia', 'Euro', 'Alocação de Trabalhadores', 'Economia', 'Gestão de Mão', 'Construção de Cidades'],
                        'conflict': ['Wargame', 'Take That', 'Conflito', 'Area Control', 'Controle de Área'],
                        'coop': ['Cooperativo', 'Colaborativo', 'Team-Based'],
                        'luck': ['Rolagem de Dados', 'Push Your Luck', 'Sorte', 'Corrida'],
                        'abstract': ['Abstrato', 'Puzzle', 'Quebra-Cabeça', 'Pattern Building'],
                        'family': ['Família', 'Card Game', 'Vazas', 'Animais', 'Infantil', 'Leve'],
                        'adventure': ['Aventura', 'Exploração', 'Dungeon Crawler', 'Temático', 'Fantasia', 'Sci-Fi']
                    };
                    
                    const targetTags = vibeMap[value] || [];
                    
                    candidates = candidates.map(g => {
                        let score = 0;
                        g.tags.forEach(t => { 
                            if(targetTags.some(tag => t.toLowerCase().includes(tag.toLowerCase()))) score++; 
                        });
                        if (g.rating) score += g.rating * 0.5; // Bonus for good rating
                        return { ...g, score };
                    });

                    // V9.8 IMPROVEMENT: Shuffle before sort to randomize ties
                    for (let i = candidates.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
                    }

                    // Sort by score
                    candidates.sort((a, b) => b.score - a.score);
                    
                    setResult(candidates.slice(0, 3));
                    setStep(3);
                } else {
                    setStep(prev => prev + 1);
                }
            };

            const reset = () => { setStep(0); setAnswers({ players: 0, time: '', vibe: '' }); setResult(null); };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[1000] bg-indigo-900/95 backdrop-blur-md flex flex-col items-center justify-center p-6 animate-fade-in text-white">
                    <button onClick={onClose} className="absolute top-6 right-6 p-2 bg-white/10 rounded-full hover:bg-white/20" title="Fechar"><Icons.X size={24}/></button>
                    
                    <div className="max-w-md w-full text-center">
                        <div className="mb-8">
                            <div className="mx-auto w-16 h-16 bg-gradient-to-tr from-amber-400 to-orange-500 rounded-full flex items-center justify-center mb-4 shadow-lg shadow-orange-500/50 animate-bounce">
                                <Icons.Wand size={32} />
                            </div>
                            <h2 className="text-3xl font-extrabold mb-2">Guru de Jogos</h2>
                            <p className="text-indigo-200">Deixe-me escolher o jogo perfeito para agora.</p>
                        </div>

                        {step === 0 && (
                            <div className="space-y-4 animate-slide-up">
                                <h3 className="text-xl font-bold mb-6">Quantas pessoas vão jogar?</h3>
                                <div className="grid grid-cols-2 gap-3">
                                    {[2, 3, 4, 5, 6].map(n => (
                                        <button key={n} onClick={() => handleAnswer('players', n)} className="bg-white/10 hover:bg-white/20 py-4 rounded-xl font-bold text-lg border border-white/5 transition-all hover:scale-105 active:scale-95" title="Escolher quantidade de jogadores">{n} Pessoas</button>
                                    ))}
                                    <button onClick={() => handleAnswer('players', 8)} className="bg-white/10 hover:bg-white/20 py-4 rounded-xl font-bold text-lg border border-white/5 transition-all hover:scale-105 active:scale-95" title="Escolher 7 ou mais jogadores">7+ Pessoas</button>
                                </div>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-4 animate-slide-up">
                                <h3 className="text-xl font-bold mb-6">Quanto tempo vocês têm?</h3>
                                <button onClick={() => handleAnswer('time', 'short')} className="w-full bg-emerald-500/20 hover:bg-emerald-500/30 py-4 rounded-xl font-bold text-lg border border-emerald-500/30 transition-all hover:scale-105 flex items-center justify-center gap-2" title="Filtrar por partidas rápidas (até 30 min)"><Icons.Clock/> Rapidinho (&lt;30m)</button>
                                <button onClick={() => handleAnswer('time', 'medium')} className="w-full bg-blue-500/20 hover:bg-blue-500/30 py-4 rounded-xl font-bold text-lg border border-blue-500/30 transition-all hover:scale-105 flex items-center justify-center gap-2" title="Filtrar por partidas médias (30 a 60 min)"><Icons.Clock/> Uma horinha (30-60m)</button>
                                <button onClick={() => handleAnswer('time', 'long')} className="w-full bg-purple-500/20 hover:bg-purple-500/30 py-4 rounded-xl font-bold text-lg border border-purple-500/30 transition-all hover:scale-105 flex items-center justify-center gap-2" title="Filtrar por partidas longas (mais de 60 min)"><Icons.Clock/> A noite toda (60m+)</button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-4 animate-slide-up">
                                <h3 className="text-xl font-bold mb-6">Qual a "vibe" da mesa?</h3>
                                <div className="grid grid-cols-2 gap-3 text-sm">
                                    <button onClick={() => handleAnswer('vibe', 'party')} className="bg-pink-500/20 hover:bg-pink-500/30 py-3 rounded-xl font-bold border border-pink-500/30 transition-all hover:scale-105" title="Escolher clima de festa">🎉 Festa</button>
                                    <button onClick={() => handleAnswer('vibe', 'strategy')} className="bg-amber-500/20 hover:bg-amber-500/30 py-3 rounded-xl font-bold border border-amber-500/30 transition-all hover:scale-105" title="Escolher clima de estratégia">🧠 Estratégia</button>
                                    <button onClick={() => handleAnswer('vibe', 'coop')} className="bg-teal-500/20 hover:bg-teal-500/30 py-3 rounded-xl font-bold border border-teal-500/30 transition-all hover:scale-105" title="Escolher clima cooperativo">🤝 Cooperativo</button>
                                    <button onClick={() => handleAnswer('vibe', 'conflict')} className="bg-red-500/20 hover:bg-red-500/30 py-3 rounded-xl font-bold border border-red-500/30 transition-all hover:scale-105" title="Escolher clima de conflito">⚔️ Conflito</button>
                                    <button onClick={() => handleAnswer('vibe', 'luck')} className="bg-orange-500/20 hover:bg-orange-500/30 py-3 rounded-xl font-bold border border-orange-500/30 transition-all hover:scale-105" title="Escolher clima de sorte e dados">🎲 Sorte & Dados</button>
                                    <button onClick={() => handleAnswer('vibe', 'abstract')} className="bg-indigo-500/20 hover:bg-indigo-500/30 py-3 rounded-xl font-bold border border-indigo-500/30 transition-all hover:scale-105" title="Escolher clima abstrato">🧩 Abstrato</button>
                                    <button onClick={() => handleAnswer('vibe', 'family')} className="bg-lime-500/20 hover:bg-lime-500/30 py-3 rounded-xl font-bold border border-lime-500/30 transition-all hover:scale-105" title="Escolher clima de família">🏠 Família</button>
                                    <button onClick={() => handleAnswer('vibe', 'adventure')} className="bg-cyan-500/20 hover:bg-cyan-500/30 py-3 rounded-xl font-bold border border-cyan-500/30 transition-all hover:scale-105" title="Escolher clima de aventura">🔥 Aventura</button>
                                </div>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="animate-pop">
                                {result && result.length > 0 ? (
                                    <>
                                        <h3 className="text-xl font-bold mb-4">✨ Recomendação ✨</h3>
                                        <div onClick={() => { onSelect(result[0]); onClose(); reset(); }} className="bg-white text-slate-900 rounded-2xl p-4 shadow-2xl cursor-pointer hover:scale-105 transition-transform mb-6 relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-amber-400 to-orange-500"></div>
                                            <div className="flex gap-4">
                                                <div className="w-24 h-24 rounded-lg bg-slate-200 overflow-hidden shrink-0"><img src={result[0].image} className="w-full h-full object-cover"/></div>
                                                <div className="text-left flex-1">
                                                    <div className="flex justify-between items-start">
                                                        <h4 className="font-extrabold text-xl leading-tight mb-1">{result[0].title}</h4>
                                                        <Icons.Medal size={24} className="text-amber-500"/>
                                                    </div>
                                                    <div className="flex gap-2 text-xs font-bold text-slate-500 mb-2">
                                                        <span>{result[0].min}-{result[0].max} Jog.</span> • <span>{result[0].time}m</span>
                                                    </div>
                                                    <p className="text-xs text-slate-600 line-clamp-2">{result[0].desc}</p>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        {result.length > 1 && (
                                            <>
                                                <p className="text-sm text-indigo-300 mb-3 font-bold uppercase tracking-wider">Outras Opções</p>
                                                <div className="space-y-2">
                                                    {result.slice(1).map(g => (
                                                        <div key={g.id} onClick={() => { onSelect(g); onClose(); reset(); }} className="flex items-center gap-3 bg-white/10 hover:bg-white/20 p-2 rounded-lg cursor-pointer transition-colors border border-white/5">
                                                            <div className="w-10 h-10 rounded bg-slate-800 overflow-hidden shrink-0"><img src={g.image} className="w-full h-full object-cover"/></div>
                                                            <div className="text-left flex-1 min-w-0">
                                                                <div className="font-bold text-sm truncate">{g.title}</div>
                                                                <div className="text-[10px] opacity-70">{g.min}-{g.max} Jog • {g.time}m</div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </>
                                        )}
                                        <button onClick={reset} className="mt-6 text-sm underline opacity-70 hover:opacity-100" title="Começar de novo">Começar de novo</button>
                                    </>
                                ) : (
                                    <div className="py-10">
                                        <div className="text-4xl mb-4">🤷‍♂️</div>
                                        <h3 className="text-xl font-bold mb-2">Nenhum jogo encontrado</h3>
                                        <p className="opacity-70 mb-6">Tente mudar os filtros de tempo ou jogadores.</p>
                                        <button onClick={reset} className="bg-white text-indigo-900 px-6 py-2 rounded-lg font-bold" title="Tentar novamente">Tentar Novamente</button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Dashboard = ({ games, wishlist, history, onGoToHistory }) => {
            const { useMemo, useState, useEffect } = React;
            const [showChart, setShowChart] = useState(false);
            const [showRanking, setShowRanking] = useState(false);
            const [tieIndex, setTieIndex] = useState(0);
            
            const total = games.length;
            const loaned = games.filter(g => g.status === 'loaned').length;
            const available = total - loaned;
            const pLoaned = total > 0 ? (loaned / total) * 100 : 0;
            const pAvailable = total > 0 ? (available / total) * 100 : 0;

            // Ranking completo de jogos por número de empréstimos (do mais pro menos emprestado)
            const rankedGames = useMemo(() => {
                const counts = {};
                history.forEach(h => { counts[h.gameTitle] = (counts[h.gameTitle] || 0) + 1; });
                return Object.entries(counts)
                    .map(([title, count]) => ({ title, count }))
                    .sort((a, b) => b.count - a.count);
            }, [history]);

            // Todos os jogos empatados em 1º lugar (pode ser só um, ou vários com o mesmo número de empréstimos)
            const topTiedGames = useMemo(() => {
                if (rankedGames.length === 0) return [];
                const topCount = rankedGames[0].count;
                return rankedGames.filter(g => g.count === topCount);
            }, [rankedGames]);

            // Quando há empate no topo, o card "Jogo Mais Querido" reveza entre os empatados a
            // cada poucos segundos, em vez de mostrar só um deles fixo.
            useEffect(() => {
                setTieIndex(0);
                if (topTiedGames.length <= 1) return;
                const interval = setInterval(() => {
                    setTieIndex(prev => (prev + 1) % topTiedGames.length);
                }, 3000);
                return () => clearInterval(interval);
            }, [topTiedGames.length]);

            const mostPopular = topTiedGames.length > 0 ? topTiedGames[tieIndex] : null;

            const chartData = useMemo(() => {
                const tagCounts = {};
                let totalTags = 0;
                let totalVal = 0;

                games.forEach(g => { if(g.currentPrice) totalVal += parseFloat(g.currentPrice) || 0; });
                wishlist.forEach(w => { if(w.currentPrice) totalVal += parseFloat(w.currentPrice) || 0; });

                games.forEach(g => {
                    if (g.isExpansion) return;
                    g.tags.forEach(t => {
                        if (t !== 'Board Game') { 
                            tagCounts[t] = (tagCounts[t] || 0) + 1;
                            totalTags++;
                        }
                    });
                });
                
                const topTags = Object.entries(tagCounts)
                    .sort((a,b) => b[1] - a[1])
                    .slice(0, 5) 
                    .map(([tag, count]) => ({
                        tag,
                        percent: totalTags > 0 ? Math.round((count / totalTags) * 100) : 0
                    }));

                return { topTags, totalVal };
            }, [games, wishlist]);

            return (
                <div className="space-y-6 mb-8 animate-fade-in no-print">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="bg-white dark:bg-dark-card p-5 rounded-2xl border border-slate-200 dark:border-dark-border shadow-sm flex items-center justify-between relative group">
                            <div><p className="text-slate-500 dark:text-dark-muted text-xs font-bold uppercase">Total Acervo</p><h2 className="text-3xl font-extrabold text-slate-800 dark:text-dark-text">{total}</h2></div>
                            <div className="bg-indigo-50 dark:bg-slate-800 p-3 rounded-xl text-indigo-600 dark:text-indigo-400"><Icons.Grid size={24}/></div>
                            <button onClick={() => setShowChart(!showChart)} className="absolute bottom-2 right-2 p-2 rounded-lg bg-indigo-50 dark:bg-slate-700 hover:bg-indigo-100 text-indigo-600 dark:text-indigo-400 opacity-0 group-hover:opacity-100 transition-opacity" title="Ver Detalhes">
                                {showChart ? <Icons.ChevronUp size={16}/> : <Icons.BarChart size={16}/>}
                            </button>
                        </div>
                        <div className="bg-white dark:bg-dark-card p-5 rounded-2xl border border-slate-200 dark:border-dark-border shadow-sm flex flex-col justify-between">
                            <div className="flex justify-between items-start mb-2">
                                <div><p className="text-slate-500 dark:text-dark-muted text-xs font-bold uppercase">Disponíveis</p><h2 className="text-3xl font-extrabold text-emerald-600 dark:text-emerald-400">{available}</h2></div>
                                <div className="bg-emerald-50 dark:bg-slate-800 p-2 rounded-lg text-emerald-600 dark:text-emerald-400"><Icons.Check size={20}/></div>
                            </div>
                            <div className="w-full bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden"><div className="bg-emerald-500 h-full rounded-full transition-all duration-1000" style={{width: `${pAvailable}%`}}></div></div>
                        </div>
                        <div onClick={onGoToHistory} className="bg-white dark:bg-dark-card p-5 rounded-2xl border border-slate-200 dark:border-dark-border shadow-sm flex flex-col justify-between cursor-pointer hover:shadow-md transition-shadow group">
                            <div className="flex justify-between items-start mb-2">
                                <div><p className="text-slate-500 dark:text-dark-muted text-xs font-bold uppercase group-hover:text-amber-600 transition-colors">Emprestados</p><h2 className="text-3xl font-extrabold text-amber-600 dark:text-amber-400">{loaned}</h2></div>
                                <div className="bg-amber-50 dark:bg-slate-800 p-2 rounded-lg text-amber-600 dark:text-amber-400"><Icons.Users size={20}/></div>
                            </div>
                            <div className="w-full bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden"><div className="bg-amber-500 h-full rounded-full transition-all duration-1000" style={{width: `${pLoaned}%`}}></div></div>
                        </div>
                        <div onClick={() => rankedGames.length > 0 && setShowRanking(true)} className={`bg-white dark:bg-dark-card p-5 rounded-2xl border border-slate-200 dark:border-dark-border shadow-sm flex items-center justify-between relative overflow-hidden ${rankedGames.length > 0 ? 'cursor-pointer hover:shadow-md transition-shadow group' : ''}`}>
                            <div className="z-10 relative max-w-[80%]">
                                <p className="text-slate-500 dark:text-dark-muted text-xs font-bold uppercase mb-1 group-hover:text-amber-600 transition-colors">Jogo Mais Querido</p>
                                {mostPopular ? (
                                    <div key={mostPopular.title} className="animate-fade-in">
                                        <h2 className="text-lg font-extrabold text-slate-800 dark:text-dark-text leading-tight truncate" title={mostPopular.title}>{mostPopular.title}</h2>
                                        <span className="text-xs font-bold text-amber-500 bg-amber-50 dark:bg-amber-900/20 px-2 py-0.5 rounded-full mt-1 inline-block">{mostPopular.count} empréstimo{mostPopular.count > 1 ? 's' : ''}</span>
                                        {topTiedGames.length > 1 && (
                                            <div className="flex gap-1 mt-2">
                                                {topTiedGames.map((_, i) => <span key={i} className={`w-1.5 h-1.5 rounded-full ${i === tieIndex ? 'bg-amber-500' : 'bg-amber-200 dark:bg-amber-900'}`}></span>)}
                                            </div>
                                        )}
                                    </div>
                                ) : <span className="text-sm text-slate-400 font-medium">Sem dados</span>}
                            </div>
                            <div className="absolute -right-2 -bottom-2 text-amber-100 dark:text-amber-900/20"><Icons.Trophy size={80}/></div>
                            <div className="z-10 bg-amber-50 dark:bg-slate-800 p-3 rounded-xl text-amber-500"><Icons.Trophy size={24}/></div>
                        </div>
                    </div>

                    {showChart && (
                        <div className="bg-white dark:bg-dark-card p-6 rounded-2xl border border-slate-200 dark:border-dark-border shadow-sm animate-expand grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                            <div>
                                <h3 className="text-sm font-bold text-slate-700 dark:text-dark-text uppercase mb-4 flex items-center gap-2"><Icons.BarChart size={18}/> Top Mecânicas</h3>
                                <div className="space-y-3">
                                    {chartData.topTags.map((d, i) => (
                                        <div key={i}>
                                            <div className="flex justify-between text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">
                                                <span>{d.tag}</span>
                                                <span>{d.percent}%</span>
                                            </div>
                                            <div className="w-full bg-slate-100 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                                                <div 
                                                    className={`h-full rounded-full transition-all duration-1000 ${i===0?'bg-indigo-500':i===1?'bg-purple-500':i===2?'bg-pink-500':'bg-slate-400'}`} 
                                                    style={{width: `${d.percent}%`}}
                                                ></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="bg-emerald-50 dark:bg-emerald-900/10 p-6 rounded-2xl border border-emerald-100 dark:border-emerald-900/30 flex flex-col justify-center h-full">
                                <p className="text-sm font-bold text-emerald-800 dark:text-emerald-400 uppercase mb-2">Valor Estimado da Coleção</p>
                                <p className="text-4xl font-extrabold text-emerald-600 dark:text-emerald-400 tracking-tight">R$ {chartData.totalVal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                                <p className="text-xs text-emerald-600/70 dark:text-emerald-500/50 mt-2">Soma dos preços cadastrados (Acervo + Wishlist).</p>
                            </div>
                        </div>
                    )}

                    {/* MODAL: RANKING DE JOGOS MAIS EMPRESTADOS */}
                    {/* Renderizado via portal direto no <body>: como o card pai tem uma animação
                        de entrada (animate-fade-in), ele cria um "contexto de empilhamento" só
                        dele — um modal fixed nascido AQUI DENTRO ficaria preso atrás de outros
                        elementos da página (como a grade de jogos), mesmo com z-index alto. */}
                    {showRanking && ReactDOM.createPortal(
                        <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm animate-fade-in no-print" onClick={() => setShowRanking(false)}>
                            <div className="bg-white dark:bg-dark-card w-full max-w-md rounded-2xl shadow-2xl modal-content" onClick={e => e.stopPropagation()}>
                                <div className="p-4 border-b border-slate-100 dark:border-dark-border flex justify-between items-center bg-amber-50 dark:bg-slate-800 shrink-0">
                                    <h3 className="font-bold text-amber-900 dark:text-amber-400 flex items-center gap-2"><Icons.Trophy size={18}/> Ranking de Jogos Mais Emprestados</h3>
                                    <button onClick={() => setShowRanking(false)} className="dark:text-white" title="Fechar ranking"><Icons.X/></button>
                                </div>
                                <div className="p-4 modal-scroll space-y-2">

            const stateRef = useRef({ games, wishlist, history, people, tombstones, reservations, reservationLog, githubToken, adminPasswordHash, adminPasswordUpdatedAt });
            useEffect(() => {
                stateRef.current = { games, wishlist, history, people, tombstones, reservations, reservationLog, githubToken, adminPasswordHash, adminPasswordUpdatedAt };

            // ==================================================================
            // MOTOR DE SINCRONIZAÇÃO (auto-save + tempo real + merge sem perdas)
            // ==================================================================
            // Ideia geral: como o app roda 100% no navegador (GitHub Pages), "tempo real"
            // aqui significa: (1) toda alteração local é enviada sozinha para o GitHub
            // poucos segundos depois de parar de digitar/clicar, e (2) o app pergunta ao
            // GitHub a cada ~20s se algo mudou em outro celular/computador da família.
            // Antes de sobrescrever o backup.json remoto, o app sempre baixa a versão mais

            // simplesmente jogar por cima — isso é o que evita perder empréstimos/jogos

            const getItemStamp = (item) => item.updatedAt || item.lastSync || 0;

            // Regra: para cada id, vence quem tiver o carimbo de tempo (updatedAt) mais novo.
            // Tombstones (exclusões) removem o item se a exclusão for mais nova que a última edição dele.
            const mergeListById = (localArr = [], remoteArr = [], localTomb = {}, remoteTomb = {}) => {
                const map = new Map();
                (remoteArr || []).forEach(item => item && item.id != null && map.set(item.id, item));
                (localArr || []).forEach(item => {
                    if (!item || item.id == null) return;
                    const existing = map.get(item.id);
                    if (!existing || getItemStamp(item) >= getItemStamp(existing)) map.set(item.id, item);
                });
                const mergedTomb = { ...(remoteTomb || {}), ...(localTomb || {}) };
                Object.keys(mergedTomb).forEach(id => {
                    const item = map.get(id);
                    if (item && mergedTomb[id] >= getItemStamp(item)) map.delete(id);
                });
                return { list: Array.from(map.values()), tombstones: mergedTomb };
            };

            const mergeLogs = (localLog = [], remoteLog = []) => {
                const map = new Map();
                [...(remoteLog || []), ...(localLog || [])].forEach(entry => { if (entry && entry.id != null) map.set(entry.id, entry); });
                return Array.from(map.values()).sort((a, b) => b.timestamp - a.timestamp);
            };

            const buildLocalSnapshot = () => {
                const { games, wishlist, history, people, tombstones, reservations, reservationLog, adminPasswordHash, adminPasswordUpdatedAt } = stateRef.current;
                return { games, wishlist, history, people, tombstones, reservations, reservationLog, adminPasswordHash, adminPasswordUpdatedAt };
            };

            const mergeSnapshots = (local, remote) => {
                const g = mergeListById(local.games, remote.games, local.tombstones?.games, remote.tombstones?.games);
                const w = mergeListById(local.wishlist, remote.wishlist, local.tombstones?.wishlist, remote.tombstones?.wishlist);
                const h = mergeListById(local.history, remote.history, local.tombstones?.history, remote.tombstones?.history);
                const p = mergeListById(local.people, remote.people, local.tombstones?.people, remote.tombstones?.people);
                const r = mergeListById(local.reservations, remote.reservations, local.tombstones?.reservations, remote.tombstones?.reservations);
                const rlog = mergeLogs(local.reservationLog, remote.reservationLog);
                // Senha do admin é um valor único (não uma lista) — vence quem tiver a alteração mais recente
                const passwordIsLocalNewer = (local.adminPasswordUpdatedAt || 0) >= (remote.adminPasswordUpdatedAt || 0);
                return {
                    games: sortGamesList(g.list), wishlist: w.list, history: h.list, people: p.list, reservations: r.list, reservationLog: rlog,
                    tombstones: { games: g.tombstones, wishlist: w.tombstones, history: h.tombstones, people: p.tombstones, reservations: r.tombstones },
                    adminPasswordHash: passwordIsLocalNewer ? (local.adminPasswordHash || '') : (remote.adminPasswordHash || ''),
                    adminPasswordUpdatedAt: passwordIsLocalNewer ? (local.adminPasswordUpdatedAt || 0) : (remote.adminPasswordUpdatedAt || 0)
                };
            };

            const fetchRemoteSnapshot = async () => {
                const token = stateRef.current.githubToken;
                const headers = token ? { "Authorization": `token ${token}` } : {};
                const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}?t=${Date.now()}`, { headers, cache: 'no-store' });
                if (res.status === 404) {
                    return { content: { games: [], wishlist: [], history: [], people: [], reservations: [], reservationLog: [], tombstones: { games: {}, wishlist: {}, history: {}, people: {}, reservations: {} }, adminPasswordHash: '', adminPasswordUpdatedAt: 0 }, sha: null };
                }
                if (!res.ok) throw new Error(`GitHub retornou ${res.status}`);
                const data = await res.json();
                const parsed = JSON.parse(fromBase64(data.content));
                return {
                    content: {
                        games: parsed.games || [], wishlist: parsed.wishlist || [], history: parsed.history || [], people: parsed.people || [],
                        reservations: parsed.reservations || [],
                        reservationLog: parsed.reservationLog || [],
                        tombstones: parsed.tombstones || { games: {}, wishlist: {}, history: {}, people: {}, reservations: {} },
                        adminPasswordHash: parsed.adminPasswordHash || '',
                        adminPasswordUpdatedAt: parsed.adminPasswordUpdatedAt || 0
                    },
                    sha: data.sha
                };
            };

            const applyMergedLocally = (merged) => {
                isApplyingRemoteRef.current = true;
                setGames(merged.games);
                setWishlist(merged.wishlist);
                setHistory(merged.history);
                setPeople(merged.people);
                setTombstones(merged.tombstones);
                setReservations(merged.reservations);
                setReservationLog(merged.reservationLog || []);
                setAdminPasswordHash(merged.adminPasswordHash || '');
                setAdminPasswordUpdatedAt(merged.adminPasswordUpdatedAt || 0);
                // Atualiza a "fotografia" na hora, sem esperar o próximo render — importante
                // para o caso de duas sincronizações acontecerem bem próximas uma da outra.
                stateRef.current = { ...stateRef.current, games: merged.games, wishlist: merged.wishlist, history: merged.history, people: merged.people, tombstones: merged.tombstones, reservations: merged.reservations, reservationLog: merged.reservationLog || [], adminPasswordHash: merged.adminPasswordHash, adminPasswordUpdatedAt: merged.adminPasswordUpdatedAt };
                setTimeout(() => { isApplyingRemoteRef.current = false; }, 300);
            };

            // Função única usada tanto para "salvar minhas mudanças" quanto para "puxar mudanças
            // de outro dispositivo": sempre busca o remoto, mescla com o local e só grava de
            // volta no GitHub se o resultado realmente for diferente do que já está lá (evita
            // commits vazios a cada verificação de 20 em 20 segundos).
            const syncNow = async (opts = {}) => {
                const { silent = false, attempt = 0 } = opts;
                const token = stateRef.current.githubToken;
                if (!token) { if (!silent) notify("Configure o Token do GitHub primeiro!", "error"); return; }
                if (typeof navigator !== 'undefined' && navigator.onLine === false) { setSyncStatus('offline'); return; }
                if (syncInFlightRef.current) return; // já existe uma sincronização em andamento
                syncInFlightRef.current = true;
                setSyncStatus('syncing');
                try {
                    const remote = await fetchRemoteSnapshot();
                    const local = buildLocalSnapshot(); // sempre a versão mais recente, graças ao stateRef
                    const merged = mergeSnapshots(local, remote.content);

                    applyMergedLocally(merged);

                    const forCompare = (snap) => JSON.stringify({ games: snap.games, wishlist: snap.wishlist, history: snap.history, people: snap.people, reservations: snap.reservations, reservationLog: snap.reservationLog, adminPasswordHash: snap.adminPasswordHash, adminPasswordUpdatedAt: snap.adminPasswordUpdatedAt });
                    if (forCompare(merged) === forCompare(remote.content) && remote.sha) {
                        remoteShaRef.current = remote.sha;
                        setSyncStatus('synced');
                        setLastSyncedAt(Date.now());
                        return;
                    }

                    const payload = { games: merged.games, wishlist: merged.wishlist, history: merged.history, people: merged.people, reservations: merged.reservations, reservationLog: merged.reservationLog, tombstones: merged.tombstones, adminPasswordHash: merged.adminPasswordHash, adminPasswordUpdatedAt: merged.adminPasswordUpdatedAt, meta: { date: new Date().toISOString(), version: "10.0" } };
                    const contentBase64 = toBase64(JSON.stringify(payload, null, 2));
                    const putRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`, {
                        method: "PUT",
                        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ message: `Sync automático — ${new Date().toLocaleString('pt-BR')}`, content: contentBase64, sha: remote.sha || undefined })
                    });

                    if (putRes.status === 409 || putRes.status === 422) {
                        // Alguém salvou entre nosso GET e nosso PUT: tenta de novo com o sha mais novo (até 3x)
                        syncInFlightRef.current = false;
                        if (attempt < 3) return syncNow({ ...opts, attempt: attempt + 1 });
                        throw new Error("Conflito de sincronização não resolvido — tente novamente em instantes.");
                    }
                    if (!putRes.ok) throw new Error(`Falha ao salvar no GitHub (${putRes.status})`);

                    const putData = await putRes.json();
                    remoteShaRef.current = putData.content.sha;
                    setSyncStatus('synced');
                    setLastSyncedAt(Date.now());
                    if (!silent) notify("Sincronizado com o GitHub!", "success");
                } catch (err) {
                    console.error(err);
                    setSyncStatus('error');
                    if (!silent) notify("Erro ao sincronizar: " + err.message, "error");
                } finally {
                    syncInFlightRef.current = false;
                }
            };

            // --- CARGA INICIAL ---
            // Com token: sincroniza direto pela API do GitHub (não depende do build do GitHub
            // Pages, então já chega com os dados mais recentes). Sem token: usa o backup.json
            // estático publicado (modo somente leitura, como era antes).
            useEffect(() => {
                const autoLoad = async () => {
                    let loadedGames = null, loadedWishlist = null;
                    try {
                        if (githubToken) {
                            await syncNow({ silent: true });
                            loadedGames = stateRef.current.games;
                            loadedWishlist = stateRef.current.wishlist;
                        } else {
                            const response = await fetch('./backup.json?t=' + new Date().getTime());
                            if (response.ok) {
                                const parsed = await response.json();
                                isApplyingRemoteRef.current = true;
                                if (parsed.games) setGames(parsed.games);
                                if (parsed.wishlist) setWishlist(parsed.wishlist);
                                if (parsed.history) setHistory(parsed.history);
                                if (parsed.people) setPeople(parsed.people);
                                if (parsed.tombstones) setTombstones(parsed.tombstones);
                                if (parsed.reservations) setReservations(parsed.reservations);
                                if (parsed.reservationLog) setReservationLog(parsed.reservationLog);
                                if (parsed.adminPasswordHash && (parsed.adminPasswordUpdatedAt || 0) >= stateRef.current.adminPasswordUpdatedAt) {
                                    setAdminPasswordHash(parsed.adminPasswordHash);
                                    setAdminPasswordUpdatedAt(parsed.adminPasswordUpdatedAt || 0);
                                }
                                setTimeout(() => { isApplyingRemoteRef.current = false; }, 300);
                                loadedGames = parsed.games || stateRef.current.games;
                                loadedWishlist = parsed.wishlist || stateRef.current.wishlist;
                            } else {
                                loadedGames = stateRef.current.games;
                                loadedWishlist = stateRef.current.wishlist;
                            }
                        }
                    } catch (e) { console.error(e); }
                    finally {
                        initialLoadDoneRef.current = true;
                        openGameFromUrl(loadedGames || stateRef.current.games, loadedWishlist || stateRef.current.wishlist);
                    }
                };
                autoLoad();
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);

            // --- AUTO-SAVE COM DEBOUNCE ---
            // Qualquer alteração local (emprestar, devolver, editar jogo, cadastrar pessoa...)
            // agenda uma sincronização automática alguns segundos depois de parar de mexer,
            // sem precisar clicar em "Salvar na Nuvem".
            useEffect(() => {
                if (!initialLoadDoneRef.current) return;      // ignora a carga inicial
                if (isApplyingRemoteRef.current) return;       // essa mudança veio da própria sincronização
                if (!githubToken) return;                      // sem token não há como salvar automaticamente

                if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
                autoSaveTimerRef.current = setTimeout(() => { syncNow({ silent: true }); }, AUTO_SAVE_DEBOUNCE_MS);

                return () => { if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current); };
            }, [games, wishlist, history, people, tombstones, githubToken]);

            // --- "TEMPO REAL": verifica a nuvem periodicamente por mudanças de outros dispositivos ---
            useEffect(() => {
                if (!githubToken) return;
                const interval = setInterval(() => { syncNow({ silent: true }); }, AUTO_SYNC_POLL_MS);
                return () => clearInterval(interval);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [githubToken]);

            useEffect(() => {
                if (!githubToken) return;
                const onFocus = () => syncNow({ silent: true });
                window.addEventListener('online', onFocus);
                document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') onFocus(); });
                return () => { window.removeEventListener('online', onFocus); };
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [githubToken]);

            const notify = (msg, type = 'success') => {
                const id = Date.now();

            };

            const getSyncStatusInfo = () => {

                    case 'error': return { text: 'Erro na última sincronização', color: 'text-red-500', dot: 'bg-red-500' };
                    case 'offline': return { text: 'Sem conexão — vai sincronizar ao voltar', color: 'text-amber-500', dot: 'bg-amber-500' };
                    case 'synced': return { text: lastSyncedAt ? `Sincronizado às ${new Date(lastSyncedAt).toLocaleTimeString('pt-BR')}` : 'Sincronizado', color: 'text-emerald-500', dot: 'bg-emerald-500' };
                    default: return { text: 'Aguardando primeira sincronização…', color: 'text-slate-400', dot: 'bg-slate-300' };
                }

            // Login: se ainda não existe nenhuma senha configurada pra essa "família" (primeiro
            // uso), a senha digitada agora vira a senha oficial. Caso já exista, compara o hash
            // do que foi digitado com o hash guardado (a senha em si nunca é comparada/gravada
            // em texto puro).
            const handleLogin = async () => {
                const typed = loginForm.pass.trim();
                if (!typed) { notify("Digite uma senha.", "error"); return; }

                try {
                    if (!adminPasswordHash) {
                        const hash = await sha256Hex(typed);
                        setAdminPasswordHash(hash);
                        setAdminPasswordUpdatedAt(Date.now());
                        setIsLoggedIn(true);
                        setShowLoginModal(false);
                        setLoginForm({ pass: '' });
                        notify("Senha de administrador definida! Guarde-a em local seguro — ela vale para toda a família.", "success");
                        return;
                    }

                    const hash = await sha256Hex(typed);
                    if (hash === adminPasswordHash) {
                        setIsLoggedIn(true);
                        setShowLoginModal(false);
                        setLoginForm({ pass: '' });
                        notify("Acesso concedido!");
                    } else {
                        notify("Senha incorreta.", "error");
                    }
                } catch (e) {
                    console.error(e);
                    notify("Não foi possível verificar a senha neste navegador (é preciso acessar via HTTPS).", "error");

            };

            const handleLogout = () => {

                setIsSelectionMode(false); // sai também do modo de seleção em massa, que é admin-only
                notify("Você saiu do modo administrador.");
            };

            // Troca de senha — só quem já está logado como admin pode fazer isso.
            const handleChangePassword = async () => {
                if (!isLoggedIn) { notify("Apenas o administrador pode alterar a senha.", "error"); return; }
                const { newPass, confirmPass } = passwordChangeForm;
                if (!newPass || newPass.length < 4) { notify("A senha precisa ter pelo menos 4 caracteres.", "error"); return; }
                if (newPass !== confirmPass) { notify("As senhas não coincidem.", "error"); return; }
                try {
                    const hash = await sha256Hex(newPass);
                    setAdminPasswordHash(hash);
                    setAdminPasswordUpdatedAt(Date.now());
                    setPasswordChangeForm({ newPass: '', confirmPass: '' });
                    setShowChangePasswordModal(false);
                    notify("Senha de administrador atualizada!", "success");
                } catch (e) {
                    console.error(e);
                    notify("Não foi possível definir a senha neste navegador (é preciso acessar via HTTPS).", "error");
                }
            };

            // --- BULK ACTIONS ---
            const toggleSelectionMode = () => {
                if(isSelectionMode) { setSelectedGames(new Set()); setIsSelectionMode(false); }
                else { setIsSelectionMode(true); setIsCartMode(false); setCartGameIds(new Set()); }
            };
            const toggleGameSelection = (e, id) => {
                e.stopPropagation();
                const newSet = new Set(selectedGames);
                if(newSet.has(id)) newSet.delete(id);
                else newSet.add(id);
                setSelectedGames(newSet);
            };
            // Seleciona todos os jogos atualmente visíveis (respeitando busca/filtros ativos);
            // se todos já estiverem selecionados, desmarca todos de uma vez.
            const toggleSelectAll = () => {
                if (filteredGames.length > 0 && selectedGames.size === filteredGames.length) {
                    setSelectedGames(new Set());
                } else {
                    setSelectedGames(new Set(filteredGames.map(g => g.id)));
                }
            };

            // --- CARRINHO DE EMPRÉSTIMO / INTERESSE ---
            const toggleCartMode = () => {
                if (isCartMode) { setCartGameIds(new Set()); setIsCartMode(false); setCartPurpose('loan'); setCartQueueChoices({}); setCartBorrowerId(''); }
                else { setIsCartMode(true); setCartPurpose('loan'); setIsSelectionMode(false); setSelectedGames(new Set()); setCartBorrowerId(''); }
            };
            // Troca o propósito do carrinho. No modo empréstimo, jogos já emprestados não podem
            // ficar no carrinho (é removido automaticamente ao trocar pra esse modo). No modo
            // interesse, também tira do carrinho qualquer jogo em que a pessoa escolhida já
            // esteja na fila (evita duplicar reserva).
            const setCartPurposeSafe = (purpose) => {
                setCartPurpose(purpose);
                if (purpose === 'loan') {
                    setCartGameIds(prev => new Set(Array.from(prev).filter(id => { const g = games.find(gg => gg.id === id); return g && g.status === 'available'; })));
                } else if (purpose === 'interest' && cartBorrowerId) {
                    setCartGameIds(prev => new Set(Array.from(prev).filter(id => !reservations.some(r => r.gameId === id && r.personId === cartBorrowerId))));
                }
            };
            // Muda a pessoa selecionada no carrinho de interesse — remove do carrinho qualquer
            // jogo em que essa pessoa já esteja na fila, já que não faz sentido reservar de novo.
            const setCartBorrowerSafe = (personId) => {
                setCartBorrowerId(personId);
                if (cartPurpose === 'interest' && personId) {
                    setCartGameIds(prev => new Set(Array.from(prev).filter(id => !reservations.some(r => r.gameId === id && r.personId === personId))));
                }
            };
            const toggleCartGame = (e, game) => {
                if (e && e.stopPropagation) e.stopPropagation();
                if (cartPurpose === 'loan' && game.status !== 'available') { notify("Esse jogo já está emprestado — pra reservar o interesse nele, troque pro modo Interesse.", "error"); return; }
                if (cartPurpose === 'interest' && cartBorrowerId) {
                    const already = reservations.find(r => r.gameId === game.id && r.personId === cartBorrowerId);
                    if (already) { notify("Essa pessoa já está na fila desse jogo.", "error"); return; }
                }
                const newSet = new Set(cartGameIds);
                if (newSet.has(game.id)) newSet.delete(game.id);
                else newSet.add(game.id);
                setCartGameIds(newSet);
            };
            const removeFromCart = (gameId) => {
                setCartGameIds(prev => { const next = new Set(prev); next.delete(gameId); return next; });
            };

            const handleBulkDelete = () => {
                if(!confirm(`Excluir ${selectedGames.size} jogos selecionados?`)) return;
                const deletedGames = games.filter(g => selectedGames.has(g.id));
                setGames(prev => prev.filter(g => !selectedGames.has(g.id)));
                setSelectedGames(new Set()); setIsSelectionMode(false);
                notify("Jogos excluídos.");
                if (deletedGames.length > 0) {
                    setLastAction({
                        label: `Exclusão de ${deletedGames.length} jogo(s)`,
                        restore: () => {
                            const undoNow = Date.now();
                            setGames(prev => sortGamesList([...prev, ...deletedGames.map(g => ({ ...g, updatedAt: undoNow }))]));
                        }
                    });
                }
            };
            const handleBulkTag = () => {
                const tag = prompt("Digite a tag para adicionar aos jogos selecionados:");
                if(!tag) return;
                setGames(prev => prev.map(g => {
                    if(selectedGames.has(g.id) && !g.tags.includes(tag)) {
                        return {...g, tags: [...g.tags, tag]};
                    }
                    return g;
                }));
                setSelectedGames(new Set()); setIsSelectionMode(false);
                notify("Tag adicionada!");
            };
            const handleBulkSync = async () => {
                const gamesToSync = games.filter(g => selectedGames.has(g.id));
                if (gamesToSync.length === 0) return;
                if (!confirm(`Sincronizar ${gamesToSync.length} jogos selecionados?`)) return;
                
                abortSyncRef.current = false;
                setGlobalSyncState({ active: true, current: 0, total: gamesToSync.length, currentName: 'Iniciando Lote Manual...' });
                let updatedGames = [...games];
                const BATCH_SIZE = 3; let processedCount = 0; 

                for (let i = 0; i < gamesToSync.length; i += BATCH_SIZE) {
                    if (abortSyncRef.current) break;
                    const batch = gamesToSync.slice(i, i + BATCH_SIZE);
                    const batchPromises = batch.map(game => scrapeLudopedia(game.title, game.manualLink));
                    setGlobalSyncState({ active: true, current: processedCount, total: gamesToSync.length, currentName: `Lote ${Math.floor(i/BATCH_SIZE) + 1} (${batch.map(g => g.title).join(', ')})` });
                    const results = await Promise.all(batchPromises);
                    results.forEach((result, idx) => {
                        if (result.success) {
                            const originalGame = batch[idx];
                            const mainIndex = updatedGames.findIndex(g => g.id === originalGame.id);
                            if (mainIndex !== -1) {
                                const existingImportantTags = originalGame.tags.filter(t => t !== 'Board Game' && !result.data.tags.includes(t));
                                let finalTags = [...new Set([...existingImportantTags, ...result.data.tags])];
                                if (finalTags.length === 0) finalTags = ['Board Game'];

                                updatedGames[mainIndex] = { ...updatedGames[mainIndex], image: result.data.image || updatedGames[mainIndex].image, desc: result.data.desc !== 'Sem descrição.' ? result.data.desc : updatedGames[mainIndex].desc, min: result.data.min || updatedGames[mainIndex].min, max: result.data.max || updatedGames[mainIndex].max, time: result.data.time || updatedGames[mainIndex].time, tags: finalTags, lastSync: Date.now() };
                            }
                        }
                    });
                    processedCount += batch.length;
                    setGames([...updatedGames]); 
                    await new Promise(r => setTimeout(r, 1000));
                }
                setGlobalSyncState({ active: false, current: 0, total: 0, currentName: '' });
                setSelectedGames(new Set()); setIsSelectionMode(false);
                notify("Sincronização em lote concluída!", 'success');
            };

            const handleShortcut = (e, game) => {
                e.stopPropagation();
                if (game.status === 'loaned' && !isLoggedIn) return;

                setModalGame(game);
                setShowQRCode(false);
                setIsEditing(false);
                setBorrowerId('');
                setLoanDueDate('');
                
                setTimeout(() => {
                    const loanSection = document.getElementById('loan-section');
                    if (loanSection) {
                        loanSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }, 150);
            };

            const handlePersonClick = (person) => {
                setShowPeopleManager(false);
                setHistoryFilter(prev => ({...prev, person: person.id}));
                setViewMode('history');
            };

            const toggleSort = () => {
                setSortOrder(prev => {
                    if (prev === 'asc') return 'desc';
                    if (prev === 'desc') return 'newest';
                    return 'asc';
                });
            };

            // --- SYNC ---
            const handleSyncAll = async () => {
                const gamesToSync = games.filter(g => !g.lastSync);
                if (gamesToSync.length === 0) { notify("Todos os jogos já estão sincronizados!"); return; }
                if (!confirm(`Sincronizar ${gamesToSync.length} jogos pendentes em paralelo?`)) return;
                
                abortSyncRef.current = false;
                setGlobalSyncState({ active: true, current: 0, total: gamesToSync.length, currentName: 'Iniciando Lote...' });
                let updatedGames = [...games];
                const BATCH_SIZE = 3; let processedCount = 0; 

                for (let i = 0; i < gamesToSync.length; i += BATCH_SIZE) {
                    if (abortSyncRef.current) break;
                    const batch = gamesToSync.slice(i, i + BATCH_SIZE);
                    const batchPromises = batch.map(game => scrapeLudopedia(game.title, game.manualLink));
                    setGlobalSyncState({ active: true, current: processedCount, total: gamesToSync.length, currentName: `Lote ${Math.floor(i/BATCH_SIZE) + 1} (${batch.map(g => g.title).join(', ')})` });
                    const results = await Promise.all(batchPromises);
                    results.forEach((result, idx) => {
                        if (result.success) {
                            const originalGame = batch[idx];
                            const mainIndex = updatedGames.findIndex(g => g.id === originalGame.id);
                            if (mainIndex !== -1) {
                                const existingImportantTags = originalGame.tags.filter(t => t !== 'Board Game' && !result.data.tags.includes(t));
                                let finalTags = [...new Set([...existingImportantTags, ...result.data.tags])];
                                if (finalTags.length === 0) finalTags = ['Board Game'];

                                updatedGames[mainIndex] = { ...updatedGames[mainIndex], image: result.data.image || updatedGames[mainIndex].image, desc: result.data.desc !== 'Sem descrição.' ? result.data.desc : updatedGames[mainIndex].desc, min: result.data.min || updatedGames[mainIndex].min, max: result.data.max || updatedGames[mainIndex].max, time: result.data.time || updatedGames[mainIndex].time, tags: finalTags, lastSync: Date.now() };
                            }
                        }
                    });
                    processedCount += batch.length;
                    setGames([...updatedGames]); 
                    await new Promise(r => setTimeout(r, 1000));
                }
                setGlobalSyncState({ active: false, current: 0, total: 0, currentName: '' });
                if (abortSyncRef.current) notify("Sincronização interrompida.", "error"); else notify(`Processo finalizado!`, 'success');
            };

            const handleSingleSync = async () => {
                if (!editForm.title && !editForm.manualLink) { notify("Digite um título ou cole um link.", "error"); return; }
                setIsSingleSyncing(true);
                try {
                    const res = await scrapeLudopedia(editForm.title || '', editForm.manualLink); 
                    if(res.success) { 
                        const currentTagsRaw = editForm.tagsString ? editForm.tagsString.split(',').map(t=>t.trim()) : [];
                        const newTags = res.data.tags;
                        const mergedTags = [...new Set([...currentTagsRaw, ...newTags])].filter(t => t !== 'Board Game' && t !== '');

                        setEditForm(prev => ({
                            ...prev, 
                            ...res.data,
                            tagsString: mergedTags.join(', '),
                            min: res.data.min || prev.min,
                            max: res.data.max || prev.max,
                            time: res.data.time || prev.time,
                            lastSync: Date.now()
                        })); 
                        notify("Dados e Mecânicas carregados!"); 
                    } else { notify("Erro ao buscar dados: " + res.error, "error"); }
                } catch (error) { console.error(error); notify("Erro na requisição.", "error"); } 
                finally { setIsSingleSyncing(false); }
            };

            // --- BUSCA COM TOLERÂNCIA A ERROS DE DIGITAÇÃO ---
            // Distância de edição (Levenshtein): quantas trocas/inserções/remoções de letra
            // são necessárias pra transformar uma palavra na outra.
            const levenshteinDistance = (a, b) => {
                if (a === b) return 0;
                if (!a.length) return b.length;
                if (!b.length) return a.length;
                const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
                for (let i = 0; i <= a.length; i++) dp[i][0] = i;
                for (let j = 0; j <= b.length; j++) dp[0][j] = j;
                for (let i = 1; i <= a.length; i++) {
                    for (let j = 1; j <= b.length; j++) {
                        dp[i][j] = a[i - 1] === b[j - 1]
                            ? dp[i - 1][j - 1]
                            : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
                    }
                }
                return dp[a.length][b.length];
            };

            // Compara o texto buscado com o título de um jogo: primeiro tenta o jeito exato
            // (substring, ignorando acento); se não achar nada, tolera 1-2 letras erradas em
            // alguma palavra do título (ex: "catam" encontra "Catan").
            const titleMatchesSearch = (title, rawQuery) => {
                const query = normalizeName(rawQuery);
                if (!query) return true;
                const normTitle = normalizeName(title);
                if (normTitle.includes(query)) return true;
                if (query.length < 3) return false; // buscas muito curtas não entram na tolerância (evita "achar tudo")

                const threshold = query.length <= 5 ? 1 : query.length <= 9 ? 2 : 3;
                const words = normTitle.split(/[^a-z0-9]+/).filter(Boolean);
                return words.some(word => Math.abs(word.length - query.length) <= threshold && levenshteinDistance(word, query) <= threshold);
            };

            // --- PEOPLE ---
            // Remove acentos/caixa/espaços extras para comparar nomes de forma confiável
            const normalizeName = (s) => (s || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');

            const savePerson = () => {
                let trimmedName = personForm.name.trim();
                let trimmedNick = (personForm.nickname || '').trim();
                const trimmedPhone = (personForm.phone || '').replace(/\D/g, '');
                if (!trimmedName) return notify("Nome obrigatório", "error");

                // Detecta "(Apelido)" digitado dentro do campo Nome (foi o que causou o bug
                // "Eduardo" x "Eduardo (Edu)") e move automaticamente para o campo correto.
                const parenMatch = trimmedName.match(/^(.+?)\s*\(([^)]+)\)\s*$/);
                if (parenMatch && !trimmedNick) {
                    trimmedName = parenMatch[1].trim();
                    trimmedNick = parenMatch[2].trim();
                    notify(`Detectei "(${trimmedNick})" no campo Nome — movi automaticamente para o campo Apelido.`, "success");
                }

                const normName = normalizeName(trimmedName);
                const normNick = normalizeName(trimmedNick);
                const computedLabel = normalizeName(trimmedNick ? `${trimmedName} (${trimmedNick})` : trimmedName);

                // Bloqueia duplicata exata (mesmo nome + mesmo apelido = mesma etiqueta final)
                const exactDuplicate = people.find(p => p.id !== personForm.id && normalizeName(getPersonLabel(p)) === computedLabel);
                if (exactDuplicate) {
                    notify(`Já existe "${getPersonLabel(exactDuplicate)}" cadastrado(a). Edite o cadastro existente em vez de criar um novo.`, "error");
                    return;
                }

                // Mesmo nome-base já cadastrado (ex: dois "Eduardo") — exige confirmação e apelido único
                const sameBaseName = people.find(p => p.id !== personForm.id && normalizeName(p.name) === normName);
                if (sameBaseName) {
                    if (!trimmedNick || normalizeName(sameBaseName.nickname) === normNick) {
                        notify(`Já existe "${getPersonLabel(sameBaseName)}" cadastrado(a). Defina um apelido diferente para "${trimmedName}" antes de salvar, assim o histórico e as tags não se misturam entre as duas pessoas.`, "error");
                        return;
                    }
                    if (!confirm(`Já existe outra pessoa chamada "${sameBaseName.name}" (cadastrada como "${getPersonLabel(sameBaseName)}"). Confirma cadastrar "${getPersonLabel({name: trimmedName, nickname: trimmedNick})}" mesmo assim?`)) {
                        return;
                    }
                }

                if (personForm.id) { setPeople(prev => prev.map(p => p.id === personForm.id ? { ...p, name: trimmedName, nickname: trimmedNick, phone: trimmedPhone, updatedAt: Date.now() } : p)); notify("Pessoa atualizada!"); }
                else { const newPerson = { id: Date.now().toString(), name: trimmedName, nickname: trimmedNick, phone: trimmedPhone, updatedAt: Date.now() }; setPeople(prev => [...prev, newPerson]); notify("Pessoa cadastrada!"); }
                setPersonForm({ id: null, name: '', nickname: '', phone: '' });
            };
            const deletePerson = (id) => {
                if(!confirm("Excluir esta pessoa?")) return;
                const deletedPerson = people.find(p => p.id === id);
                setPeople(prev => prev.filter(p => p.id !== id));
                markDeleted('people', id);
                if (deletedPerson) {
                    setLastAction({
                        label: `Exclusão de "${getPersonLabel(deletedPerson)}"`,
                        restore: () => { setPeople(prev => [...prev, { ...deletedPerson, updatedAt: Date.now() }]); }
                    });
                }
            };
            const editPerson = (person) => setPersonForm({ phone: '', ...person });
            const getPersonLabel = (p) => p.nickname ? `${p.name} (${p.nickname})` : p.name;

            // Retorna os empréstimos de uma pessoa. Prioriza correspondência por ID (borrowerId,
            // gravado em empréstimos novos) e usa correspondência EXATA pelo nome/etiqueta como
            // fallback para registros antigos que ainda não têm borrowerId. Nunca usa .includes()
            // aqui, pois isso causava mistura de histórico entre pessoas com nomes parecidos
            // (ex: "Eduardo" casando com "Eduardo (Edu)").
            const getPersonHistory = (personId) => {
                const person = people.find(p => p.id === personId);
                if (!person) return [];
                const personLabel = getPersonLabel(person);
                return history.filter(h => h.borrowerId ? h.borrowerId === personId : h.borrower === personLabel);
            };

            const calculateBadges = (personId) => {
                const pHistory = getPersonHistory(personId);
                if (pHistory.length === 0) return [{ icon: '🌱', title: 'Estreante', color: 'text-slate-400' }];
                const badges = [];
                const now = Date.now();
                const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

                // Novato: ainda não chegou a 5 empréstimos na vida
                if (pHistory.length < 5) badges.push({ icon: '🆕', title: 'Novato', color: 'text-sky-500' });

                // Viciado: 7 ou mais RETIRADAS nos últimos 30 dias (janela móvel — some sozinho
                // se a pessoa parar de emprestar jogos por um tempo).
                const recentLoans = pHistory.filter(h => (now - parseDate(h.loanDate).getTime()) <= THIRTY_DAYS_MS);
                if (recentLoans.length >= 7) badges.push({ icon: '🏆', title: 'Viciado', color: 'text-amber-500' });

                // Relâmpago/Tartaruga: olham só as DEVOLUÇÕES dos últimos 30 dias (janela móvel,
                // "expira" sozinho depois de 30 dias sem devolução que sustente o badge).
                const completed = pHistory.filter(h => h.status === 'completed' && h.returnDate && h.returnDate !== '-');
                const recentCompleted = completed.filter(h => (now - parseDate(h.returnDate).getTime()) <= THIRTY_DAYS_MS);
                if (recentCompleted.length > 0) {
                    const withDueDate = recentCompleted.filter(h => h.loanDueDate);
                    const anyOnTime = withDueDate.some(h => parseDate(h.returnDate) <= parseDate(h.loanDueDate));
                    const anyLate = withDueDate.some(h => parseDate(h.returnDate) > parseDate(h.loanDueDate));
