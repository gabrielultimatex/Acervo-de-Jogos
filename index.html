            darkMode: 'class',

                extend: {

    </script>

    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes expand { from { max-height: 0; opacity: 0; } to { max-height: 1000px; opacity: 1; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes confettiFall { 0% { transform: translateY(-10px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(540deg); opacity: 0; } }
        @keyframes diceRoll { 0% { transform: rotate(0deg) scale(1) translateY(0); } 20% { transform: rotate(80deg) scale(1.15) translateY(-6px); } 40% { transform: rotate(170deg) scale(0.9) translateY(3px); } 60% { transform: rotate(260deg) scale(1.1) translateY(-5px); } 80% { transform: rotate(340deg) scale(0.95) translateY(2px); } 100% { transform: rotate(440deg) scale(1) translateY(0); } }
        
        .animate-slide-in-right { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards; }
        .animate-expand { animation: expand 0.5s ease-in-out forwards; overflow: hidden; }
        .animate-spin { animation: spin 1s linear infinite; }
        .animate-pulse-glow { animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-dice-roll { animation: diceRoll 0.5s ease-in-out infinite; }
        
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(15, 23, 42, 0.95); border-bottom-color: #334155; }
        .modal-content { max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .modal-scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 1rem; }
        
        input, select, textarea { font-size: 16px !important; }

        /* Print Specific Styles */
        @media print {
            body { background: white; color: black; }
            .no-print, header, .fixed, button:not(.print-btn) { display: none !important; }
            .print-only { display: block !important; }
            .page-break { page-break-inside: avoid; break-inside: avoid; }
            #root { margin: 0; padding: 0; }
            main { padding: 0; margin: 0; max-width: 100%; }
            .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
            /* O rodapÃ© (texto + QR do acervo) tem que sair inteiro numa pÃ¡gina sÃ³ â€” sem isso ele
               era partido e o QR final acabava sozinho, "jogado" pra fora/pra outra folha. */
            .print-only { break-inside: avoid; page-break-inside: avoid; display: flex !important; }
            .print-only img { max-width: 100%; height: auto; }
        }
        .print-only { display: none; }
        /* Corta o tÃ­tulo em 2 linhas no CardÃ¡pio (fallback caso a build do Tailwind em uso nÃ£o
           traga line-clamp) â€” tÃ­tulos longos esticavam a linha e desalinhavam os QR codes. */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>

        const getBigImageCandidate = (url) => {

        const getHeroBackgroundImage = (url) => {

        const getHeroForegroundImage = (url) => {

        const handleImageError = (e) => {

                const passwordIsLocalNewer = (local.adminPasswordUpdatedAt || 0) >= (remote.adminPasswordUpdatedAt || 0);
                return {
                    games: sortGamesList(g.list), wishlist: w.list, history: h.list, people: p.list, reservations: r.list, reservationLog: rlog,
                    tombstones: { games: g.tombstones, wishlist: w.tombstones, history: h.tombstones, people: p.tombstones, reservations: r.tombstones },
                    adminPasswordHash: passwordIsLocalNewer ? (local.adminPasswordHash || '') : (remote.adminPasswordHash || ''),

            const fetchRemoteSnapshot = async () => {
                const token = stateRef.current.githubToken;
                const headers = token ? { "Authorization": `token ${token}` } : {};
                const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}?t=${Date.now()}`, { headers, cache: 'no-store' });
                if (res.status === 404) {
                    return { content: { games: [], wishlist: [], history: [], people: [], reservations: [], reservationLog: [], tombstones: { games: {}, wishlist: {}, history: {}, people: {}, reservations: {} }, adminPasswordHash: '', adminPasswordUpdatedAt: 0 }, sha: null };
                }
                if (!res.ok) throw new Error(`GitHub retornou ${res.status}`);
                const data = await res.json();
                const parsed = JSON.parse(fromBase64(data.content));
                return {
                    content: {

            const applyMergedLocally = (merged) => {

                stateRef.current = { ...stateRef.current, games: merged.games, wishlist: merged.wishlist, history: merged.history, people: merged.people, tombstones: merged.tombstones, reservations: merged.reservations, reservationLog: merged.reservationLog || [], adminPasswordHash: merged.adminPasswordHash, adminPasswordUpdatedAt: merged.adminPasswordUpdatedAt };

            // FunÃ§Ã£o Ãºnica usada tanto para "salvar minhas mudanÃ§as" quanto para "puxar mudanÃ§as

            // volta no GitHub se o resultado realmente for diferente do que jÃ¡ estÃ¡ lÃ¡ (evita
            // commits vazios a cada verificaÃ§Ã£o de 20 em 20 segundos).
            const syncNow = async (opts = {}) => {
                const { silent = false, attempt = 0 } = opts;
                const token = stateRef.current.githubToken;

                    const contentBase64 = toBase64(JSON.stringify(payload, null, 2));
                    const putRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`, {

                        body: JSON.stringify({ message: `Sync automÃ¡tico â€” ${new Date().toLocaleString('pt-BR')}`, content: contentBase64, sha: remote.sha || undefined })
                    });

                    setLastSyncedAt(Date.now());

                } catch (err) {

            // --- CARGA INICIAL ---

            useEffect(() => {

            const setCartPurposeSafe = (purpose) => {

            // DistÃ¢ncia de ediÃ§Ã£o (Levenshtein): quantas trocas/inserÃ§Ãµes/remoÃ§Ãµes de letra
            // sÃ£o necessÃ¡rias pra transformar uma palavra na outra.
            const levenshteinDistance = (a, b) => {
                if (a === b) return 0;
                if (!a.length) return b.length;
                if (!b.length) return a.length;
                const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
                for (let i = 0; i <= a.length; i++) dp[i][0] = i;
                for (let j = 0; j <= b.length; j++) dp[0][j] = j;
                for (let i = 1; i <= a.length; i++) {
                    for (let j = 1; j <= b.length; j++) {
                        dp[i][j] = a[i - 1] === b[j - 1]
                            ? dp[i - 1][j - 1]
                            : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
                    }
                }
                return dp[a.length][b.length];
            };

            const titleMatchesSearch = (title, rawQuery) => {
                const query = prepareSearchQuery(rawQuery);
                if (!query) return true;
                const normTitle = normalizeSearchText(title);
                if (normTitle.includes(query)) return true;
                const queryWords = query.split(' ').filter(Boolean);
                const titleWords = normTitle.split(' ').filter(Boolean);
                return queryWords.every(queryWord => titleWords.some(titleWord => {
                    if (queryWord === titleWord) return true;
                    if (queryWord.length < 4) return false;
                    const threshold = queryWord.length <= 5 ? 1 : Math.min(2, Math.floor(queryWord.length * 0.16));
                    const distance = levenshteinDistance(titleWord, queryWord);
                    return Math.abs(titleWord.length - queryWord.length) <= threshold
                        && distance <= threshold
                        && distance / Math.max(titleWord.length, queryWord.length) <= 0.2;
                }));
            };

            // Telefone da pessoa que estÃ¡ com o jogo (se cadastrado). Tenta por ID primeiro

            const buildWhatsAppLink = (phone, message) => {

            const overdueGames = useMemo(() => games.filter(g => g.status === 'loaned' && isOverdue(g.loanDueDate)), [games]);

            // Telas onde os jogos ficam visÃ­veis pra navegaÃ§Ã£o/seleÃ§Ã£o â€” o carrinho sÃ³ faz
            // sentido aparecer nelas; em qualquer outra tela (histÃ³rico, lista de desejos etc.)

            const isGameViewMode = viewMode === 'grid' || viewMode === 'list' || viewMode === 'details';
            // AlÃ©m da troca de tela (viewMode), alguns modais tambÃ©m tampam a tela inteira por

            const isCartBlockingOverlayOpen = showPeopleManager || showSettings;

            // Jogos disponÃ­veis com fila em que a primeira pessoa ainda nÃ£o foi avisada via
            // WhatsApp (nem pelo aviso pÃ³s-devoluÃ§Ã£o, nem pelo botÃ£o na aba Fila de Reserva).
            const pendingNotifyGames = useMemo(() => {

            // Badge no Ã­cone do app (Badge API): mostra quantas coisas precisam de atenÃ§Ã£o
            // (atrasados + pendÃªncias de aviso de fila) direto no Ã­cone, mesmo com a aba fechada
            // ou em segundo plano â€” diferente do lembrete por Notification, que sÃ³ funciona com a

            // Safari no iOS 16.4+ quando instalado como app); em quem nÃ£o suporta, nÃ£o faz nada.
            useEffect(() => {

                const count = overdueGames.length + pendingNotifyGames.length;

                } catch (e) { /* Badge API indisponÃ­vel nesse contexto â€” ignora silenciosamente */ }
            }, [overdueGames.length, pendingNotifyGames.length]);

            // Liga/desliga as notificaÃ§Ãµes do navegador â€” pede permissÃ£o ao ativar. Checa cada
            // causa comum de falha ANTES de pedir permissÃ£o (navegador sem suporte, conexÃ£o nÃ£o
            // seguro, permissÃ£o jÃ¡ concedida ou jÃ¡ bloqueada) pra dar uma mensagem especÃ­fica em
            // vez de um erro genÃ©rico, e cobre tanto o formato novo (Promise) quanto o antigo
            // (callback) da API, jÃ¡ que alguns navegadores/apps ainda sÃ³ suportam o antigo.
            const handleToggleNotifications = async () => {
                if (notificationsEnabled) {
                    setNotificationsEnabled(false);
                    notify("NotificaÃ§Ãµes de vencimento desativadas.");
                    return;
                }
                if (typeof window === 'undefined' || typeof window.Notification === 'undefined') {
                    notify("Esse navegador ou aplicativo nÃ£o suporta notificaÃ§Ãµes.", "error");
                    return;
                }
                if (window.isSecureContext === false) {
                    notify("NotificaÃ§Ãµes sÃ³ funcionam numa conexÃ£o segura (https).", "error");
                    return;
                }
                // JÃ¡ concedida antes (ex: autorizou esse site anteriormente) â€” nÃ£o precisa pedir de novo
                if (window.Notification.permission === 'granted') {
                    setNotificationsEnabled(true);
                    notify("NotificaÃ§Ãµes de vencimento ativadas! Funciona enquanto essa aba estiver aberta.", "success");
                    return;
                }
                if (window.Notification.permission === 'denied') {
                    notify("As notificaÃ§Ãµes estÃ£o bloqueadas para este site nas configuraÃ§Ãµes do navegador/app. Libere manualmente lÃ¡ e tente de novo.", "error");
                    return;
                }
                if (typeof window.Notification.requestPermission !== 'function') {
                    notify("Esse navegador nÃ£o permite pedir permissÃ£o de notificaÃ§Ã£o.", "error");
                    return;
                }
                try {
                    const permission = await new Promise((resolve, reject) => {
                        try {
                            const result = window.Notification.requestPermission(resolve); // formato antigo, baseado em callback
                            if (result && typeof result.then === 'function') result.then(resolve, reject); // formato novo, baseado em Promise
                        } catch (err) { reject(err); }
                    });
                    if (permission === 'granted') {
                        setNotificationsEnabled(true);
                        notify("NotificaÃ§Ãµes de vencimento ativadas! Funciona enquanto essa aba estiver aberta.", "success");
                    } else {
                        notify("PermissÃ£o de notificaÃ§Ã£o negada pelo navegador.", "error");
                    }
                } catch (e) {
                    console.error(e);
                    notify(`NÃ£o foi possÃ­vel ativar as notificaÃ§Ãµes${e && e.message ? `: ${e.message}` : ''}.`, "error");
                }
            };

            // Verifica periodicamente jogos emprestados perto do vencimento (ou jÃ¡ atrasados) e

            // jÃ¡ que o site Ã© 100% estÃ¡tico e nÃ£o tem servidor pra enviar push de verdade.

            // nÃ£o repetir o aviso vÃ¡rias vezes no mesmo dia.
            useEffect(() => {
                if (!notificationsEnabled) return;

                const checkDueReminders = () => {
                    const now = new Date();

                    const notifiedKey = 'notified_loans_v1';

                    const activeLoanIds = new Set(games.filter(g => g.status === 'loaned').map(g => g.loanId));
                    // Limpa entradas de emprÃ©stimos que jÃ¡ nÃ£o estÃ£o mais ativos (devolvidos)
                    Object.keys(notifiedMap).forEach(loanId => { if (!activeLoanIds.has(loanId)) delete notifiedMap[loanId]; });

                        if (notifiedMap[g.loanId] === todayStr) return; // jÃ¡ notificado hoje

                        let title, body;
                        if (diffDays < 0) {
                            title = `â° "${g.title}" estÃ¡ atrasado!`;

                        try {

                return () => clearInterval(interval);

            // Monta o texto do resumo semanal: jogos atrasados + fila de reserva de cada jogo.
            // Reaproveitado tanto pela notificaÃ§Ã£o automÃ¡tica quanto pelo botÃ£o de WhatsApp.
            const buildWeeklySummaryMessage = () => {

            // Resumo semanal: a partir da segunda-feira de cada semana, dispara UMA notificaÃ§Ã£o

            useEffect(() => {

            // Jogos esquecidos: nunca emprestados, ou parados hÃ¡ 30+ dias desde o Ãºltimo

            const staleGames = useMemo(() => {
                const now = Date.now();
                const DAY_MS = 24 * 60 * 60 * 1000;
                return games
                    .filter(g => !g.isExpansion)

            const handleBarcodeDetected = (rawCode) => {

            // Safari/iOS e Firefox). Os dois sÃ£o sÃ³ "motores" diferentes pro mesmo resultado.
            const startBarcodeScanning = async () => {

                                }
                            } catch (e) { /* frame sem leitura â€” tenta de novo no prÃ³ximo intervalo */ }
                        }, 400);

            const openCamera = async (mode) => {

                    notify("Esse navegador nÃ£o dÃ¡ acesso Ã  cÃ¢mera.", "error");
                    return;
                }
                setCameraError('');
                setCameraModal({ mode });
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    cameraStreamRef.current = stream;

            // rapidamente estouraria o limite do localStorage e deixaria a sincronizaÃ§Ã£o lenta.
            const drawToCompressedDataUrl = (sourceEl, sourceWidth, sourceHeight, maxDim = 1000, quality = 0.75) => {
                let w = sourceWidth, h = sourceHeight;
                if (w > maxDim || h > maxDim) {
                    if (w >= h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
                    else { w = Math.round(w * (maxDim / h)); h = maxDim; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(sourceEl, 0, 0, w, h);
                return canvas.toDataURL('image/jpeg', quality);
            };

                    .map(g => ({ gameId: g.id, gameTitle: g.title, queue: getGameQueue(g.id) }))
                    .filter(item => item.queue.length > 0);
                if (queueItems.length > 0) setReservationAlert({ items: queueItems });
            };

            // DevoluÃ§Ã£o em massa a partir da seleÃ§Ã£o de jogos na grade/lista (modo admin)
            const handleBulkReturn = () => {
                const loanedSelected = games.filter(g => selectedGames.has(g.id) && g.status === 'loaned');
                executeBulkReturn(loanedSelected);
                setSelectedGames(new Set());
                setIsSelectionMode(false);
            };

            // DevoluÃ§Ã£o em massa a partir da seleÃ§Ã£o de linhas no HistÃ³rico (modo admin)
            const handleBulkReturnFromHistory = () => {
                const activeSelected = history.filter(h => selectedHistoryIds.has(h.id) && h.status === 'active');
                const relatedGames = activeSelected
                    .map(h => games.find(g => g.id === h.gameId) || games.find(g => g.title === h.gameTitle))
                    .filter(Boolean);
                if (relatedGames.length === 0) { notify("Nenhum emprÃ©stimo ativo selecionado.", "error"); return; }
                executeBulkReturn(relatedGames);
                setSelectedHistoryIds(new Set());
                setIsHistorySelectionMode(false);
            };

            // Inicia a ediÃ§Ã£o guardando uma "foto" do formulÃ¡rio, usada depois para saber se
            // algo foi alterado e ainda nÃ£o foi salvo.
            const startEditing = (formData) => {
                setEditForm(formData);
                editFormSnapshotRef.current = JSON.stringify(formData);
                setIsEditing(true);
            };

            const hasUnsavedChanges = () => isEditing && editFormSnapshotRef.current !== null && JSON.stringify(editForm) !== editFormSnapshotRef.current;

            // Fecha o modal do jogo/wishlist, confirmando antes se houver ediÃ§Ã£o nÃ£o salva.
            const closeModalGame = () => {
                if (hasUnsavedChanges() && !confirm("VocÃª tem alteraÃ§Ãµes nÃ£o salvas neste jogo. Deseja realmente sair sem salvar?")) return;
                setIsEditing(false);
                editFormSnapshotRef.current = null;
                setModalGame(null);
            };

            // Sai do modo de ediÃ§Ã£o (volta pra visualizaÃ§Ã£o), confirmando antes se houver alteraÃ§Ãµes nÃ£o salvas.
            // ExceÃ§Ã£o: se o item Ã© novo e ainda nÃ£o foi salvo, nÃ£o existe "visualizaÃ§Ã£o" pra voltar â€”
            // entÃ£o cancelar fecha o modal inteiro, em vez de mostrar um item fantasma em branco.
            const cancelEditing = () => {
                if (hasUnsavedChanges() && !confirm("VocÃª tem alteraÃ§Ãµes nÃ£o salvas neste jogo. Deseja realmente cancelar?")) return;
                setIsEditing(false);
                editFormSnapshotRef.current = null;
                if (modalGame && modalGame.id === 'new') setModalGame(null);
            };

            const saveEdit = () => {
                if (!editForm.title || !editForm.title.trim()) {
                    notify("Digite um tÃ­tulo antes de salvar.", "error");
                    return;
                }
                const tagsRaw = editForm.tagsString ? editForm.tagsString.split(',') : [];
                const tags = tagsRaw.map(t => t.trim()).filter(t => t.length > 0);
                const finalGame = { 
                    ...editForm, 
                    title: editForm.title.trim(),
                    tags: tags.length > 0 ? tags : ['Board Game'], 
                    min: Number(editForm.min), 
                    max: Number(editForm.max),
                    rating: Number(editForm.rating || 0),
                    isExpansion: !!editForm.isExpansion,
                    baseGameId: editForm.isExpansion ? editForm.baseGameId : null,
                    sleeveDetail: editForm.sleeveDetail || '',
                    images: (editForm.images || []).filter(url => url && url.trim()),
                    updatedAt: Date.now()
                };
                
                if (editForm.isWishlist) {
                     if (modalGame.id === 'new') {
                         // DetecÃ§Ã£o de duplicata pelo nome (ignorando acento/maiÃºscula/espaÃ§o):
                         // checa tanto a prÃ³pria lista de desejos quanto o acervo â€” nÃ£o faz sentido
                         // querer comprar um jogo que jÃ¡ se tem. Nos dois casos sÃ³ avisa e deixa
                         // continuar (pode ser proposital: outra ediÃ§Ã£o, segunda cÃ³pia, presente).
                         const normTitle = normalizeName(finalGame.title);
                         if (normTitle) {
                             const dupWish = wishlist.find(w => normalizeName(w.title) === normTitle);
                             if (dupWish && !confirm(`"${dupWish.title}" jÃ¡ estÃ¡ na lista de desejos.\n\nAdicionar mesmo assim?`)) return;
                             if (!dupWish) {
                                 const dupGame = games.find(g => normalizeName(g.title) === normTitle);
                                 if (dupGame && !confirm(`"${dupGame.title}" jÃ¡ estÃ¡ no seu acervo â€” vocÃª jÃ¡ tem esse jogo.\n\nAdicionar Ã  lista de desejos mesmo assim?`)) return;
                             }
                         }
                         finalGame.id = `w-${Date.now()}`;
                         setWishlist(prev => [...prev, finalGame]);
                     } else {
                         setWishlist(prev => prev.map(w => w.id === modalGame.id ? { ...modalGame, ...finalGame } : w));
                         setModalGame({ ...modalGame, ...finalGame });
                     }
                     editFormSnapshotRef.current = null;
                     setIsEditing(false); notify("Item da lista de desejos salvo!");
                     return;
                }

                if (modalGame.id === 'new') {
                    // Mesma checagem no sentido contrÃ¡rio: contra o acervo e contra a lista de desejos.
                    const normTitle = normalizeName(finalGame.title);
                    if (normTitle) {
                        const dupGame = games.find(g => normalizeName(g.title) === normTitle);
                        if (dupGame && !confirm(`"${dupGame.title}" jÃ¡ estÃ¡ no acervo.\n\nCadastrar mesmo assim?`)) return;
                        if (!dupGame) {
                            const dupWish = wishlist.find(w => normalizeName(w.title) === normTitle);
                            if (dupWish && !confirm(`"${dupWish.title}" estÃ¡ na sua lista de desejos.\n\nCadastrar no acervo mesmo assim? (o item continuarÃ¡ na lista de desejos â€” remova de lÃ¡ se jÃ¡ comprou)`)) return;
                        }
                    }
                    finalGame.id = `g-${Date.now()}`; finalGame.status = 'available'; setGames(prev => sortGamesList([...prev, finalGame])); setModalGame(finalGame);
                }
                else { setGames(prev => prev.map(g => g.id === modalGame.id ? { ...modalGame, ...finalGame } : g)); setModalGame({ ...modalGame, ...finalGame }); }
                editFormSnapshotRef.current = null;
                setIsEditing(false); notify("Jogo salvo!");
            };

            // SincronizaÃ§Ã£o manual (forÃ§a uma verificaÃ§Ã£o/gravaÃ§Ã£o imediata) â€” usa o mesmo
            // motor de merge do auto-save (syncNow), entÃ£o nunca sobrescreve o remoto Ã s cegas.
            const handleManualSync = () => syncNow({ silent: false });

            const handleExport = () => {
                const backupData = { games, wishlist, history, people, reservations, reservationLog, meta: { date: new Date().toISOString(), version: "9.8" } };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", `meeplestock_backup_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
                const now = Date.now();
                localStorage.setItem('last_manual_backup_at', String(now));
                setLastManualBackupAt(now);
                notify("Download iniciado!");
            };

            const handleImportClick = () => fileInputRef.current.click();
            const handleFileChange = (event) => {
                const fileReader = new FileReader();
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = e => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed.games || parsed.history) {
                            if(confirm("Substituir dados atuais?")) {
                                if (parsed.games) setGames(parsed.games);
                                if (parsed.wishlist) setWishlist(parsed.wishlist);
                                if (parsed.history) setHistory(parsed.history);
                                if (parsed.people) setPeople(parsed.people);
                                if (parsed.reservations) setReservations(parsed.reservations);
                                if (parsed.reservationLog) setReservationLog(parsed.reservationLog);
                                notify("Dados restaurados!", "success");
                                setShowSettings(false);
                            }
                        } else { notify("Arquivo invÃ¡lido.", "error"); }
                    } catch (err) { notify("Erro ao ler arquivo.", "error"); }
                };
            };

            const handleCSVImportClick = () => csvInputRef.current.click();
            const handleCSVChange = (event) => {
                const fileReader = new FileReader();
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = e => {
                    try {
                        const rows = e.target.result.split('\n');
                        if (rows.length < 2) { notify("CSV vazio.", "error"); return; }
                        const headers = rows[0].toLowerCase().split(/[;,]/);
                        const titleIdx = headers.findIndex(h => h.includes('name') || h.includes('title') || h.includes('titulo'));
                        
                        if (titleIdx === -1) { notify("Coluna de tÃ­tulo nÃ£o encontrada no CSV.", "error"); return; }

                        // DetecÃ§Ã£o de duplicata: compara o tÃ­tulo normalizado (sem acento, minÃºsculo,
                        // sem espaÃ§os extras) contra o acervo jÃ¡ existente E contra o que jÃ¡ foi
                        // adicionado nesta mesma importaÃ§Ã£o â€” evita duplicar tanto com o acervo
                        // quanto entre linhas repetidas dentro do prÃ³prio CSV.
                        let count = 0;
                        let skippedCount = 0;
                        const newGames = [];
                        const seenNormTitles = new Set(games.map(g => normalizeName(g.title)));
                        for(let i=1; i<rows.length; i++) {
                            const row = rows[i].split(/[;,]/);
                            if(row.length > titleIdx && row[titleIdx].trim()) {
                                const title = row[titleIdx].trim().replace(/^"|"$/g, ''); // remove quotes
                                const normTitle = normalizeName(title);
                                if (!seenNormTitles.has(normTitle)) {
                                    newGames.push(generateGameData(title, i));
                                    seenNormTitles.add(normTitle);
                                    count++;
                                } else {
                                    skippedCount++;
                                }
                            }
                        }
                        if (count > 0 && confirm(`Encontrados ${count} novo(s) jogo(s)${skippedCount > 0 ? ` (${skippedCount} jÃ¡ estavam no acervo e foram ignorados como duplicata)` : ''}. Importar?`)) {
                            setGames(prev => sortGamesList([...prev, ...newGames]));
                            notify(`${count} jogos importados!`, 'success');
                            setShowSettings(false);
                        } else if (count === 0) {
                            notify(skippedCount > 0 ? `Nenhum jogo novo â€” ${skippedCount} do CSV jÃ¡ estavam no acervo (duplicata).` : "Nenhum jogo novo encontrado.", "error");
                        }
                    } catch (err) { notify("Erro ao processar CSV.", "error"); }
                };
            };

            // Registra uma exclusÃ£o no "tombstone" da coleÃ§Ã£o, para que o merge com a nuvem
            // saiba que o item foi apagado de propÃ³sito (e nÃ£o apenas "ainda nÃ£o chegou").
            const markDeleted = (collection, id) => {
                setTombstones(prev => ({ ...prev, [collection]: { ...prev[collection], [id]: Date.now() } }));
            };

            // --- FILA DE RESERVA ---
            const getGameQueue = (gameId) => reservations.filter(r => r.gameId === gameId).sort((a, b) => a.createdAt - b.createdAt);

            // Registra um evento no histÃ³rico da fila (append-only): 'joined' (entrou),
            // 'fulfilled' (foi atendido â€” recebeu o jogo) ou 'removed' (tirado manualmente).
            const logQueueEvent = (gameId, gameTitle, personId, event) => {
                const person = people.find(p => p.id === personId);
                const now = Date.now();
                const entry = { id: `rlog-${now}-${Math.random().toString(36).slice(2, 7)}`, gameId, gameTitle, personId, personLabel: person ? getPersonLabel(person) : 'Pessoa removida', event, timestamp: now };
                setReservationLog(prev => [entry, ...prev]);
                return entry;
            };

            const addReservation = (gameId, personId) => {
                const game = games.find(g => g.id === gameId);
                if (!game) return;
                const already = reservations.find(r => r.gameId === gameId && r.personId === personId);
                if (already) { notify("Essa pessoa jÃ¡ estÃ¡ na fila desse jogo.", "error"); return; }
                const now = Date.now();
                const newRes = { id: `res-${now}`, gameId, gameTitle: game.title, personId, createdAt: now, updatedAt: now };
                setReservations(prev => [...prev, newRes]);
                logQueueEvent(gameId, game.title, personId, 'joined');
                notify("Reserva registrada!");
            };

            const removeReservation = (id, reason = 'removed') => {
                const res = reservations.find(r => r.id === id);
                setReservations(prev => prev.filter(r => r.id !== id));
                markDeleted('reservations', id);
                if (res) logQueueEvent(res.gameId, res.gameTitle, res.personId, reason);
            };

            // Marca que a primeira pessoa da fila jÃ¡ foi avisada via WhatsApp de que o jogo
            // estÃ¡ disponÃ­vel â€” some da contagem de "pendÃªncias de aviso" (badge no Ã­cone de histÃ³rico).
            const markReservationNotified = (id) => {
                const res = reservations.find(r => r.id === id);
                if (!res || res.notifiedAt) return;
                const now = Date.now();
                setReservations(prev => prev.map(r => r.id === id ? { ...r, notifiedAt: now, updatedAt: now } : r));
                logQueueEvent(res.gameId, res.gameTitle, res.personId, 'notified');
            };

            // Apaga uma linha especÃ­fica do histÃ³rico da fila (admin) â€” diferente de
            // removeReservation, que tira alguÃ©m da fila ATUAL; isso sÃ³ limpa o registro do
            // evento jÃ¡ acontecido, sem mexer em quem estÃ¡ na fila hoje.
            const deleteLogEntry = (id) => {
                const entry = reservationLog.find(e => e.id === id);
                if (!confirm("Apagar este registro do histÃ³rico da fila?")) return;
                setReservationLog(prev => prev.filter(e => e.id !== id));
                if (entry) {
                    setLastAction({
                        label: `ExclusÃ£o de registro da fila ("${entry.gameTitle}")`,
                        restore: () => { setReservationLog(prev => [entry, ...prev]); }
                    });
                }
            };

            const buildReservationMessage = (gameTitle, person) => {
                const firstName = getPersonLabel(person).replace(/\(.*/, '').trim().split(' ')[0];
                return `OlÃ¡ ${firstName}! O jogo "${gameTitle}" que vocÃª reservou acabou de ser devolvido e jÃ¡ estÃ¡ disponÃ­vel pra vocÃª pegar! ðŸŽ²`;
            };

            // Bloco da fila de reserva de um jogo â€” reutilizado tanto na tela de emprÃ©stimo
            // (jogo disponÃ­vel) quanto na tela de devoluÃ§Ã£o (jogo emprestado), pra fila ficar
            // visÃ­vel nos dois casos. excludePersonId tira alguÃ©m da lista de "Reservar para"
            // (ex: quem jÃ¡ estÃ¡ com o jogo emprestado no momento).
            const renderReservationQueueSection = (gameId, excludePersonId) => {
                const queue = getGameQueue(gameId);
                return (
                    <div>
                        <p className="text-xs font-bold text-slate-500 dark:text-dark-muted uppercase mb-2">Fila de Reserva</p>
                        {queue.length > 0 ? (
                            <div className="space-y-1 mb-2">
                                {queue.map((r, i) => {
                                    const resPerson = people.find(p => p.id === r.personId);
                                    return (
                                        <div key={r.id} className="flex items-center justify-between gap-2 bg-white dark:bg-slate-800 px-3 py-1.5 rounded-lg text-xs">
                                            <span className="font-bold text-slate-700 dark:text-dark-text truncate">{i + 1}Âº â€” {resPerson ? getPersonLabel(resPerson) : 'Pessoa removida'}</span>
                                            {isLoggedIn && <button onClick={() => removeReservation(r.id)} className="text-red-400 hover:text-red-600 shrink-0" title="Remover da fila (admin)"><Icons.X size={14}/></button>}
                                        </div>
                                    );
                                })}
                            </div>
                        ) : (
                            <p className="text-xs text-slate-400 mb-2">NinguÃ©m na fila deste jogo.</p>
                        )}
                        <div className="flex gap-2">
                            <select className="flex-1 border border-slate-200 dark:border-slate-600 rounded-lg text-xs p-2 dark:bg-slate-700 dark:text-white" value={reservationPickerPersonId} onChange={e => setReservationPickerPersonId(e.target.value)}>
                                <option value="">Reservar para...</option>
                                {people.filter(p => p.id !== excludePersonId).map(p => <option key={p.id} value={p.id}>{getPersonLabel(p)}</option>)}
                            </select>
                            <button onClick={() => { if (!reservationPickerPersonId) { notify("Selecione uma pessoa.", "error"); return; } addReservation(gameId, reservationPickerPersonId); setReservationPickerPersonId(''); }} className="bg-slate-700 dark:bg-slate-600 hover:bg-slate-800 text-white px-3 rounded-lg text-xs font-bold shrink-0 transition-colors" title="Adicionar essa pessoa Ã  fila de reserva">Reservar</button>
                        </div>
                    </div>
                );
            };

            const handleDelete = () => { 
                if(modalGame.id === 'new') { setModalGame(null); return; } 
                if(confirm(`EXCLUIR "${modalGame.title}"?`)) { 
                    const deletedItem = { ...modalGame };
                    const wasWishlist = viewMode === 'wishlist';
                    if (wasWishlist) {
                        setWishlist(prev => prev.filter(w => w.id !== modalGame.id));
                        markDeleted('wishlist', modalGame.id);
                    } else {
                        setGames(prev => prev.filter(g => g.id !== modalGame.id)); 
                        markDeleted('games', modalGame.id);
                    }
                    setModalGame(null); 
                    notify("Item excluÃ­do.", "error"); 

                    setLastAction({
                        label: `ExclusÃ£o de "${deletedItem.title}"`,
                        restore: () => {
                            const undoNow = Date.now();
                            if (wasWishlist) setWishlist(prev => [...prev, { ...deletedItem, updatedAt: undoNow }]);
                            else setGames(prev => sortGamesList([...prev, { ...deletedItem, updatedAt: undoNow }]));
                        }
                    });
                } 
            };
            const clearHistory = () => {
                if(!confirm("Apagar APENAS concluÃ­dos?")) return;
                const removedItems = history.filter(item => item.status !== 'active');
                setHistory(prev => {
                    prev.filter(item => item.status !== 'active').forEach(item => markDeleted('history', item.id));
                    return prev.filter(item => item.status === 'active');
                });
                notify("HistÃ³rico limpo.");
                if (removedItems.length > 0) {
                    setLastAction({
                        label: `Limpeza de ${removedItems.length} registro(s) do histÃ³rico`,
                        restore: () => {
                            const undoNow = Date.now();
                            setHistory(prev => [...prev, ...removedItems.map(item => ({ ...item, updatedAt: undoNow }))]);
                        }
                    });
                }
            };
            const deleteHistoryItem = (id) => {
                if(!confirm("Apagar registro?")) return;
                const deletedItem = history.find(item => item.id === id);
                setHistory(prev => prev.filter(item => item.id !== id));
                markDeleted('history', id);
                if (deletedItem) {
                    setLastAction({
                        label: `ExclusÃ£o do registro de "${deletedItem.gameTitle}"`,
                        restore: () => { setHistory(prev => [...prev, { ...deletedItem, updatedAt: Date.now() }]); }
                    });
                }
            };

            // --- SELEÃ‡ÃƒO EM MASSA NO HISTÃ“RICO (excluir vÃ¡rios registros concluÃ­dos de uma vez) ---
            const toggleHistorySelectionMode = () => {
                if (isHistorySelectionMode) { setSelectedHistoryIds(new Set()); setIsHistorySelectionMode(false); }
                else { setIsHistorySelectionMode(true); }
            };
            const toggleHistoryItemSelection = (e, id) => {
                if (e && e.stopPropagation) e.stopPropagation();
                const newSet = new Set(selectedHistoryIds);
                if (newSet.has(id)) newSet.delete(id);
                else newSet.add(id);
                setSelectedHistoryIds(newSet);
            };
            const handleBulkDeleteHistory = () => {
                const deletableItems = history.filter(h => selectedHistoryIds.has(h.id) && h.status === 'completed');
                if (deletableItems.length === 0) { notify("Nenhum registro concluÃ­do selecionado.", "error"); return; }
                if (!confirm(`Excluir ${deletableItems.length} registro(s) do histÃ³rico?`)) return;

                const idsToDelete = new Set(deletableItems.map(h => h.id));
                setHistory(prev => prev.filter(h => !idsToDelete.has(h.id)));
                deletableItems.forEach(h => markDeleted('history', h.id));

                setLastAction({
                    label: `ExclusÃ£o de ${deletableItems.length} registro(s) do histÃ³rico`,
                    restore: () => {
                        const undoNow = Date.now();
                        setHistory(prev => [...deletableItems.map(h => ({ ...h, updatedAt: undoNow })), ...prev]);
                    }
                });

                notify(`${deletableItems.length} registro(s) excluÃ­do(s).`, "success");
                setSelectedHistoryIds(new Set());
                setIsHistorySelectionMode(false);
            };

            const uniqueTags = useMemo(() => { const t = new Set(); games.forEach(g => g.tags.forEach(tag => t.add(tag))); return Array.from(t).sort(); }, [games]);
            
            const filteredGames = useMemo(() => {
                let result = games.filter(g => {
                    const matchSearch = titleMatchesSearch(g.title, search);
                    const matchTag = filters.tags.length === 0 || filters.tags.every(t => g.tags.includes(t));
                    let matchPlayers = true; if (filters.players) { const p = parseInt(filters.players); if (!isNaN(p)) matchPlayers = g.min <= p && g.max >= p; }
                    let matchTime = true; if (filters.time !== 'all') { const t = parseInt(g.time); if (!isNaN(t)) { if (filters.time === 'short') matchTime = t < 30; else if (filters.time === 'medium') matchTime = t >= 30 && t <= 60; else if (filters.time === 'long') matchTime = t > 60; } }
                    let matchRating = true; if (filters.rating !== 'all') matchRating = (g.rating || 0) >= 4;
                    return matchSearch && matchTag && matchPlayers && matchTime && matchRating;
                });
                
                result.sort((a, b) => {
                    if (sortOrder === 'newest') {
                        const getTs = (id) => { try { return parseInt(id.split('-')[1]); } catch(e){ return 0; } };
                        return getTs(b.id) - getTs(a.id);
                    }
                    const titleA = a.title.toLowerCase();
                    const titleB = b.title.toLowerCase();
                    if (sortOrder === 'asc') return titleA.localeCompare(titleB);
                    else return titleB.localeCompare(titleA);
                });

                return result;
            }, [games, search, filters, sortOrder]);

            const openRandomizerSetup = () => setShowRandomizerSetup(true);

            // Quantidade efetiva de jogadores presentes = pessoas selecionadas na lista +
            // pessoas somadas manualmente (que nÃ£o estÃ£o na lista). "manualExtra" guarda sÃ³ a
            // parte extra; a contagem final Ã© sempre a soma dinÃ¢mica das duas partes, entÃ£o
            // marcar/desmarcar uma pessoa nunca apaga o que foi somado Ã  mÃ£o, e vice-versa.
            const getRandomizerPresentCount = () => randomizerFilter.presentIds.length + (randomizerFilter.manualExtra || 0);

            const runRandomizer = () => {
                let candidates;
                if (randomizerFilter.mode === 'presence') {
                    candidates = games.filter(g => g.status === 'available');
                    const count = getRandomizerPresentCount();
                    if (count > 0) {
                        candidates = candidates.filter(g => g.min <= count && g.max >= count);
                    }
                    if (randomizerFilter.timeMinutes) {
                        const maxT = parseInt(randomizerFilter.timeMinutes);
                        if (!isNaN(maxT)) candidates = candidates.filter(g => { const t = parseInt(g.time); return isNaN(t) || t <= maxT; });
                    }
                } else {
                    candidates = filteredGames.filter(g => g.status === 'available');
                }
                if (candidates.length === 0) { notify("Nenhum jogo disponÃ­vel com esses critÃ©rios.", "error"); return; }
                setRandomizerPool(candidates);
                setShowRandomizerSetup(false);
                setShowRandomizer(true);
            };

            const finishRandomizer = () => {
                setShowRandomizer(false);
                const winner = randomizerPool[Math.floor(Math.random() * randomizerPool.length)];
                if (!winner) return;
                setModalGame(winner);
                setBorrowerId('');
                setShowQRCode(false);
                setIsEditing(false);
                notify(`O escolhido foi: ${winner.title}!`, "success");
            };

            // Game List Renderer
            const renderGameList = () => {
                if (viewMode === 'history') {
                    return (
