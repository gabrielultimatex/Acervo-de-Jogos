                                            <div className="grid grid-cols-2 gap-4 mb-4">
                                                <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border border-slate-100 dark:border-slate-700 flex items-center gap-3"><div className="bg-white dark:bg-slate-700 p-2 rounded-lg shadow-sm text-indigo-600 dark:text-indigo-400"><Icons.Users size={20}/></div><div><p className="text-xs text-slate-400 dark:text-dark-muted font-bold uppercase">Jogadores</p><p className="font-bold text-slate-800 dark:text-dark-text">{modalGame.min} a {modalGame.max}</p></div></div>
                                                <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border border-slate-100 dark:border-slate-700 flex items-center gap-3"><div className="bg-white dark:bg-slate-700 p-2 rounded-lg shadow-sm text-indigo-600 dark:text-indigo-400"><Icons.Clock size={20}/></div><div><p className="text-xs text-slate-400 dark:text-dark-muted font-bold uppercase">Tempo Médio</p><p className="font-bold text-slate-800 dark:text-dark-text">{modalGame.time} min</p></div></div>
                                            </div>
                                            
                                            {/* Sleeves Feature */}
                                            {modalGame.sleeveDetail && (
                                                <div className="mb-4 bg-blue-50 dark:bg-blue-900/20 p-3 rounded-lg border border-blue-100 dark:border-blue-900 flex items-center gap-3">
                                                    <div className="text-blue-500"><Icons.Layers size={20}/></div>
                                                    <div><p className="text-xs font-bold text-blue-800 dark:text-blue-300 uppercase">Sleeves</p><p className="text-sm font-medium text-blue-900 dark:text-blue-200">{modalGame.sleeveDetail}</p></div>
                                                </div>
                                            )}

                                            {!modalGame.isExpansion && !modalGame.isWishlist && (
                                                <div className="mb-4">
                                                    {(() => {
                                                        const expansions = games.filter(g => g.isExpansion && g.baseGameId === modalGame.id);
                                                        if (expansions.length > 0) return (
                                                            <div className="bg-purple-50 dark:bg-purple-900/20 p-3 rounded-lg border border-purple-100 dark:border-purple-800">
                                                                <p className="text-xs font-bold text-purple-700 dark:text-purple-300 uppercase mb-2 flex items-center gap-1"><Icons.Puzzle size={12}/> Expansões na coleção</p>
                                                                <div className="flex flex-wrap gap-2">
                                                                    {expansions.map(ex => <span key={ex.id} className="text-xs bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-2 py-1 rounded shadow-sm cursor-pointer hover:text-purple-600" onClick={() => setModalGame(ex)}>{ex.title}</span>)}
                                                                </div>
                                                            </div>
                                                        );
                                                    })()}
                                                </div>
                                            )}

                                            <div className="mb-6"><h3 className="text-sm font-bold text-slate-900 dark:text-dark-text mb-2">Sobre o Jogo</h3><p className="text-slate-600 dark:text-slate-400 text-sm leading-relaxed whitespace-pre-wrap">{modalGame.desc}</p></div>

                                            <div className="grid grid-cols-2 gap-3 mb-6">
                                                <button onClick={() => window.open(`https://www.youtube.com/results?search_query=review+${encodeURIComponent(modalGame.title)}`, '_blank')} className="bg-red-50 hover:bg-red-100 dark:bg-red-900/20 dark:hover:bg-red-900/40 text-red-600 dark:text-red-400 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 border border-red-100 dark:border-red-900/30 transition-colors"><Icons.Youtube size={18}/> Ver Review</button>
                                                <button onClick={() => window.open(`https://www.youtube.com/results?search_query=como+jogar+${encodeURIComponent(modalGame.title)}`, '_blank')} className="bg-red-50 hover:bg-red-100 dark:bg-red-900/20 dark:hover:bg-red-900/40 text-red-600 dark:text-red-400 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 border border-red-100 dark:border-red-900/30 transition-colors"><Icons.Youtube size={18}/> Como Jogar</button>
                                            </div>

                                            {modalGame.isWishlist ? (
                                                <div className="text-center py-4 border-t border-slate-100 dark:border-dark-border">
                                                    <p className="text-pink-500 font-bold mb-4 flex items-center justify-center gap-2"><Icons.Heart size={16}/> Item da Lista de Desejos</p>
                                                    <div className="flex flex-col gap-3">
                                                        <button onClick={() => window.open(`https://ludopedia.com.br/search?search=${encodeURIComponent(modalGame.title)}`, '_blank')} className="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-white font-bold py-3 px-8 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors shadow-sm flex items-center justify-center gap-2"><Icons.ExternalLink size={18}/> Ver na Ludopedia</button>
                                                        <button onClick={() => { if(confirm("Mover este jogo para o seu Acervo?")) { setGames(p => sortGamesList([...p, {...modalGame, id: `g-${Date.now()}`, status: 'available', isWishlist: false}])); setWishlist(p => p.filter(w => w.id !== modalGame.id)); setModalGame(null); notify("Jogo adicionado ao acervo!", "success"); } }} className="bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl hover:bg-emerald-700 transition-colors shadow-lg shadow-emerald-200 flex items-center justify-center gap-2"><Icons.Check size={18}/> Adicionar ao Acervo</button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="border-t border-slate-100 dark:border-dark-border pt-6" id="loan-section">
                                                    <h3 className="text-sm font-bold text-slate-900 dark:text-dark-text mb-4 flex items-center gap-2"><Icons.CloudSync size={16}/> Controle de Estoque</h3>
                                                    {modalGame.status === 'available' ? (
                                                        <div className="bg-indigo-50 dark:bg-slate-800 p-5 rounded-2xl border border-indigo-100 dark:border-indigo-900">
                                                            <div className="flex flex-col gap-4">
                                                                <div>
                                                                    <label className="text-xs font-bold text-indigo-900 dark:text-indigo-300 uppercase mb-2 block">Emprestar para:</label>
                                                                    <select className="w-full px-4 h-10 text-sm rounded-xl border border-indigo-200 dark:border-indigo-800 outline-none bg-white dark:bg-slate-700 dark:text-white" value={borrowerId} onChange={e => setBorrowerId(e.target.value)}>
                                                                        <option value="">Selecione uma pessoa...</option>
                                                                        {people.map(p => <option key={p.id} value={p.id}>{getPersonLabel(p)}</option>)}
                                                                    </select>
                                                                </div>
                                                                <div className="flex gap-4 items-end">
                                                                    <div className="flex-1">
                                                                        <label className="text-xs font-bold text-indigo-900 dark:text-indigo-300 uppercase mb-2 block">Devolução Prevista:</label>
                                                                        <input type="date" className="w-full px-4 h-10 text-sm rounded-xl border border-indigo-200 dark:border-indigo-800 outline-none bg-white dark:bg-slate-700 dark:text-white" value={loanDueDate} onChange={e => setLoanDueDate(e.target.value)} />
                                                                    </div>
                                                                    <button onClick={handleLoan} className="bg-indigo-600 text-white px-6 h-10 rounded-xl text-sm font-bold hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-200 shrink-0 flex items-center justify-center">OK</button>
                                                                </div>
                                                            </div>
                                                            {people.length === 0 && <p className="text-[10px] text-red-500 mt-2 cursor-pointer hover:underline" onClick={() => { setModalGame(null); setShowPeopleManager(true); }}>Nenhuma pessoa cadastrada. Clique aqui para adicionar.</p>}
                                                        </div>
                                                    ) : (
                                                        <div className={`p-5 rounded-2xl border flex flex-col gap-4 ${isOverdue(modalGame.loanDueDate) ? 'bg-red-50 border-red-200 dark:bg-red-900/20 dark:border-red-800' : 'bg-amber-50 border-amber-100 dark:bg-amber-900/20 dark:border-amber-900/50'}`}>
                                                            <div className="flex items-center gap-4">
                                                                <div className={`p-3 rounded-full shadow-sm bg-white dark:bg-slate-700 ${isOverdue(modalGame.loanDueDate) ? 'text-red-500' : 'text-amber-500'}`}><Icons.Users size={24}/></div>
                                                                <div>
                                                                    <p className={`text-xs font-bold uppercase ${isOverdue(modalGame.loanDueDate) ? 'text-red-700 dark:text-red-400' : 'text-amber-800 dark:text-amber-400'}`}>Status: {isOverdue(modalGame.loanDueDate) ? 'ATRASADO' : 'Emprestado'}</p>
                                                                    <p className="font-bold text-slate-800 dark:text-dark-text text-lg">{modalGame.borrower}</p>
                                                                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                                                                        Desde: {modalGame.loanDate} 
                                                                        {modalGame.loanDueDate && <span className="block font-bold">Previsto: {modalGame.loanDueDate}</span>}
                                                                    </p>
                                                                </div>
                                                            </div>
                                                            {/* WhatsApp Button + Config */}
                                                            <div className="flex gap-2">
                                                                <a 
                                                                    href={`https://wa.me/?text=${encodeURIComponent(whatsappTemplate.replace('{borrower}', modalGame.borrower.split(' ')[0]).replace('{title}', modalGame.title).replace('{loanDate}', modalGame.loanDate).replace('{dueDate}', modalGame.loanDueDate || '?'))}`}
                                                                    target="_blank"
                                                                    className="flex-1 bg-green-500 hover:bg-green-600 text-white py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 shadow-sm transition-colors"
                                                                >
                                                                    <Icons.Whatsapp size={18}/> Cobrar/Avisar
                                                                </a>
                                                                <button onClick={() => setShowWhatsappSettings(true)} className="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 p-2 rounded-xl transition-colors"><Icons.Settings size={20}/></button>
                                                            </div>
                                                            {isLoggedIn && <button onClick={handleReturn} className="bg-white dark:bg-slate-700 border border-amber-200 dark:border-amber-700 text-amber-700 dark:text-amber-400 hover:bg-amber-100 dark:hover:bg-amber-900/30 px-6 py-2 rounded-xl text-sm font-bold transition-colors shadow-sm">Registrar Devolução</button>}
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    </>
                                ) : (
                                    <div className="flex flex-col h-full bg-slate-50 dark:bg-slate-900 overflow-hidden rounded-2xl">
                                        <div className="bg-white dark:bg-dark-card p-4 border-b border-slate-200 dark:border-dark-border flex justify-between items-center shadow-sm z-10 shrink-0">
                                            <h3 className="font-bold text-lg text-slate-800 dark:text-dark-text flex items-center gap-2"><Icons.Edit className="text-indigo-600"/> {modalGame.id === 'new' ? 'Novo Item' : 'Editar Jogo'}</h3>
                                            <button onClick={() => setIsEditing(false)} className="text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-white bg-slate-100 dark:bg-slate-800 p-2 rounded-lg"><Icons.X/></button>
                                        </div>
                                        <div className="modal-scroll p-6 space-y-5">
                                            {editForm.isWishlist && <div className="bg-pink-50 dark:bg-pink-900/20 p-3 rounded-lg text-pink-600 dark:text-pink-300 text-xs font-bold text-center border border-pink-100 dark:border-pink-900">Este item será salvo na Lista de Desejos</div>}
                                            
                                            <div className="bg-blue-50 dark:bg-slate-800 p-4 rounded-xl border border-blue-100 dark:border-slate-700"><label className="block text-xs font-bold text-blue-800 dark:text-blue-400 mb-1">Link Ludopedia (Opcional)</label>
                                                <div className="flex gap-2">
                                                    <input className="w-full border border-blue-200 dark:border-slate-600 rounded-lg p-2 text-sm bg-white dark:bg-slate-700 dark:text-white" placeholder="https://ludopedia.com.br/jogo/..." value={editForm.manualLink || ''} onChange={e => setEditForm({...editForm, manualLink: e.target.value})} />
                                                    {isLoggedIn && !editForm.isWishlist && (
                                                        <button onClick={() => setEditForm({...editForm, lastSync: null})} className="bg-white dark:bg-slate-700 text-red-500 border border-red-200 dark:border-red-900 px-3 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/30" title="Remover Selo Sync"><Icons.Eraser size={16}/></button>
                                                    )}
                                                    <button onClick={handleSingleSync} disabled={isSingleSyncing} className={`text-white px-3 rounded-lg flex items-center justify-center transition-colors ${isSingleSyncing ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}>{isSingleSyncing ? <Icons.Loader size={16}/> : <Icons.CloudSync size={16}/>}</button>
                                                </div>
                                                <p className="text-[10px] text-blue-600 dark:text-blue-400 mt-1">Cole o link e clique no botão azul para buscar dados e mecânicas.</p>
                                            </div>

                                            <div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Título</label><input className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm font-bold text-slate-800 dark:text-white dark:bg-slate-800" value={editForm.title} onChange={e => setEditForm({...editForm, title: e.target.value})} /></div>
                                            <div className="grid grid-cols-2 gap-4"><div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Imagem URL</label><input className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm bg-white text-slate-900" value={editForm.image} onChange={e => setEditForm({...editForm, image: e.target.value})} /></div><div className="h-[60px] bg-slate-200 dark:bg-slate-700 rounded-lg overflow-hidden border border-slate-300 dark:border-slate-600"><img src={editForm.image} className="w-full h-full object-cover" onError={e => e.target.style.opacity=0} /></div></div>
                                            <div className="grid grid-cols-3 gap-4"><div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Min Jog.</label><input type="number" className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm dark:bg-slate-800 dark:text-white" value={editForm.min} onChange={e => setEditForm({...editForm, min: e.target.value})} /></div><div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Max Jog.</label><input type="number" className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm dark:bg-slate-800 dark:text-white" value={editForm.max} onChange={e => setEditForm({...editForm, max: e.target.value})} /></div><div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Minutos</label><input className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm dark:bg-slate-800 dark:text-white" value={editForm.time} onChange={e => setEditForm({...editForm, time: e.target.value})} /></div></div>
                                            
                                            <div className="grid grid-cols-2 gap-4">
                                                <div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Local na Estante</label><input className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm dark:bg-slate-800 dark:text-white" placeholder="Ex: Prateleira A" value={editForm.location || ''} onChange={e => setEditForm({...editForm, location: e.target.value})} /></div>
                                                <div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Avaliação (0-5)</label><input type="number" min="0" max="5" step="0.5" className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm dark:bg-slate-800 dark:text-white" value={editForm.rating || 0} onChange={e => setEditForm({...editForm, rating: e.target.value})} /></div>
                                            </div>

                                            {/* Sleeves Input */}
                                            <div className="grid grid-cols-2 gap-4">
                                                <div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Sleeves (Tamanho/Qtd)</label><input className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm dark:bg-slate-800 dark:text-white" placeholder="Ex: Padrão (100un)" value={editForm.sleeveDetail || ''} onChange={e => setEditForm({...editForm, sleeveDetail: e.target.value})} /></div>
                                                <div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Preço Pago (R$)</label><input type="number" className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm dark:bg-slate-800 dark:text-white" value={editForm.currentPrice || ''} onChange={e => setEditForm({...editForm, currentPrice: e.target.value})} /></div>
                                            </div>

                                            {editForm.isWishlist && (
                                                <div className="bg-pink-50 dark:bg-pink-900/20 p-4 rounded-xl border border-pink-100 dark:border-pink-900">
                                                    <div className="grid grid-cols-2 gap-3 mb-2">
                                                        <div><label className="text-[10px] font-bold text-pink-700 mb-1 block">Preço Atual</label><input type="number" className="w-full rounded p-1.5 text-sm border bg-white text-slate-900" value={editForm.currentPrice || ''} onChange={e => setEditForm({...editForm, currentPrice: e.target.value})} /></div>
                                                        <div><label className="text-[10px] font-bold text-pink-700 mb-1 block">Prioridade</label><select className="w-full rounded p-1.5 text-sm border bg-white text-slate-900" value={editForm.priority || 'Medium'} onChange={e => setEditForm({...editForm, priority: e.target.value})}><option value="High">Alta</option><option value="Medium">Média</option><option value="Low">Baixa</option></select></div>
                                                    </div>
                                                </div>
                                            )}

                                            {!editForm.isWishlist && (
                                                <div className="flex items-center gap-3">
                                                    <input type="checkbox" id="isExpansion" checked={editForm.isExpansion || false} onChange={e => setEditForm({...editForm, isExpansion: e.target.checked})} className="w-4 h-4"/>
                                                    <label htmlFor="isExpansion" className="text-sm font-bold text-slate-700 dark:text-white">É uma expansão?</label>
                                                </div>
                                            )}
                                            {editForm.isExpansion && (
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Jogo Base</label>
                                                    <select className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm dark:bg-slate-800 dark:text-white" value={editForm.baseGameId || ''} onChange={e => setEditForm({...editForm, baseGameId: e.target.value})}>
                                                        <option value="">Selecione...</option>
                                                        {games.filter(g => !g.isExpansion && g.id !== editForm.id).map(g => <option key={g.id} value={g.id}>{g.title}</option>)}
                                                    </select>
                                                </div>
                                            )}

                                            <div className="bg-white dark:bg-dark-card p-4 rounded-xl border border-slate-200 dark:border-dark-border shadow-sm">
                                                <label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-2 flex items-center gap-2"><Icons.Tag size={14}/> Categorias e Mecânicas</label>
                                                <div className="flex flex-wrap gap-2">
                                                    {PREDEFINED_TAGS.map(tag => {
                                                        const isSelected = (editForm.tagsString || '').includes(tag);
                                                        return (
                                                            <button 
                                                                key={tag} 
                                                                onClick={() => toggleTagInEdit(tag)} 
                                                                className={`text-[10px] px-2 py-1 rounded border transition-colors font-medium ${isSelected ? 'bg-indigo-100 text-indigo-700 border-indigo-200 dark:bg-indigo-900 dark:text-indigo-300 dark:border-indigo-700' : 'bg-slate-50 text-slate-600 border-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:border-slate-700 hover:bg-slate-100'}`}
                                                            >
                                                                {tag}
                                                            </button>
                                                        )
                                                    })}
                                                </div>
                                                <div className="mt-3">
                                                    <label className="text-[10px] font-bold text-slate-400 uppercase">Tags Manuais (Separadas por vírgula)</label>
                                                    <input className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2 text-sm mt-1 focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-slate-800 dark:text-white" value={editForm.tagsString} onChange={e => setEditForm({...editForm, tagsString: e.target.value})} placeholder="Ex: Zumbis, Espaço, Piratas..." />
                                                </div>
                                            </div>
                                            <div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Descrição</label><textarea rows="4" className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm dark:bg-slate-800 dark:text-white" value={editForm.desc} onChange={e => setEditForm({...editForm, desc: e.target.value})}></textarea></div>
                                        </div>
                                        <div className="p-4 bg-white dark:bg-dark-card border-t border-slate-200 dark:border-dark-border flex justify-between gap-3 shrink-0 rounded-b-2xl">
                                            {modalGame.id !== 'new' && (isLoggedIn || editForm.isWishlist) && (<button onClick={handleDelete} className="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 p-3 rounded-xl hover:bg-red-100 dark:hover:bg-red-900/30 transition-colors border border-red-100 dark:border-red-900/30" title="Excluir"><Icons.Trash size={20}/></button>)}
                                            <button onClick={saveEdit} className="bg-indigo-600 text-white font-bold py-3 px-8 rounded-xl hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-200 flex-1">Salvar Alterações</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
