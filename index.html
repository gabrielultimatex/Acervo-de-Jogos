<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acervo de Jogos - Cloud v6.0</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                            text: '#f1f5f9',
                            muted: '#94a3b8'
                        }
                    },
                    screens: { 'xs': '400px' }
                }
            }
        }
    </script>
    
    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes expand { from { max-height: 0; opacity: 0; } to { max-height: 400px; opacity: 1; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .animate-slide-in-right { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-expand { animation: expand 0.3s ease-out forwards; overflow: hidden; }
        .animate-spin { animation: spin 1s linear infinite; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(15, 23, 42, 0.95); border-bottom-color: #334155; }

        .modal-content { max-height: 85vh; display: flex; flex-direction: column; }
        .modal-scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
        
        input, select, textarea { font-size: 16px !important; }
    </style>
</head>

s", "Tokaido", "Trio", "Truco", "Viral", "War", "Wingspan"

        const inferTags = (title) => {
            const t = title ? title.toLowerCase() : '';
            const tags = [];
            if (t.includes('catan') || t.includes('ticket') || t.includes('carcassonne') || t.includes('puerto') || t.includes('wingspan') || t.includes('power grid')) tags.push('Estratégia');
            if (t.includes('dobble') || t.includes('taco') || t.includes('imagem') || t.includes('perfil') || t.includes('party') || t.includes('código') || t.includes('quem') || t.includes('responde')) tags.push('Party Game');
            if (t.includes('zombicide') || t.includes('gloomhaven') || t.includes('munchkin') || t.includes('epic')) tags.push('Aventura');
            if (t.includes('azul') || t.includes('sagrada') || t.includes('splendor') || t.includes('abstratus') || t.includes('santorini')) tags.push('Abstrato');
            if (t.includes('war') || t.includes('banco') || t.includes('clue') || t.includes('detetive')) tags.push('Clássico');
            if (t.includes('king of') || t.includes('bang') || t.includes('coup') || t.includes('love letter') || t.includes('mascarade') || t.includes('resistance')) tags.push('Cartas/Bluff');
            if (t.includes('timeline') || t.includes('similo') || t.includes('quiz')) tags.push('Educativo/Quiz');
            if (tags.length === 0) tags.push('Board Game');
            return tags;
        };

        const generateGameData = (title, index) => ({
            id: `g-${Date.now()}-${index}`,
            title,
            min: 2, max: 6, time: "30",
            desc: "Aguardando sincronização...",
            tags: inferTags(title),
            image: `https://source.unsplash.com/400x300/?boardgame,${encodeURIComponent(title)}`,
            status: 'available', borrower: '', loanId: null, manualLink: '',
            lastSync: null
        });

        const sortGamesList = (list) => list.sort((a, b) => a.title.localeCompare(b.title));

        const Notification = ({ message, type, onClose }) => {
            React.useEffect(() => { const timer = setTimeout(onClose, 4000); return () => clearTimeout(timer); }, [onClose]);
            const bgClass = type === 'success' ? 'bg-emerald-600' : 'bg-rose-500';
            const icon = type === 'success' ? <Icons.Check size={20}/> : <Icons.Alert size={20}/>;
            return (
                <div className={`fixed top-4 right-4 z-[200] flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl text-white ${bgClass} animate-slide-in-right`}>
                    {icon} <span className="font-semibold text-sm">{message}</span>
                    <button onClick={onClose} className="opacity-70 hover:opacity-100 ml-2"><Icons.X size={16}/></button>
                </div>
            );
        };

        const scrapeLudopedia = async (gameTitle, customUrl = '') => {
            let targetUrl;
            if (customUrl && customUrl.trim().length > 0) {
                targetUrl = customUrl.trim();
            } else if (gameTitle) {
                let slug = gameTitle.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s-]/g, "").trim().replace(/\s+/g, "-");
                targetUrl = `https://ludopedia.com.br/jogo/${slug}`;
            } else {
                return { success: false, error: "Sem título ou link" };
            }

            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}&timestamp=${new Date().getTime()}`;

            try {
                const response = await fetch(proxyUrl);
                const json = await response.json();
                
                if (!json.contents) throw new Error("Conteúdo vazio");
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(json.contents, "text/html");

                const ogImage = doc.querySelector('meta[property="og:image"]')?.content;
                const ogDesc = doc.querySelector('meta[property="og:description"]')?.content;
                const ogTitle = doc.querySelector('meta[property="og:title"]')?.content;

                const textContent = doc.body.innerText || "";
                
                let min = 2, max = 4;
                const playersMatch = textContent.match(/(\d+)\s*(?:a|-)\s*(\d+)\s*jogadores/i);
                const singlePlayerMatch = textContent.match(/(\d+)\s*jogadores/i);

                if (playersMatch) {
                    min = parseInt(playersMatch[1]);
                    max = parseInt(playersMatch[2]);
                } else if (singlePlayerMatch) {
                    min = parseInt(singlePlayerMatch[1]);
                    max = min;
                }

                let time = "30";
                const timeMatch = textContent.match(/(\d+)\s*min/i);
                if (timeMatch) time = timeMatch[1];

                let extractedTitle = ogTitle ? ogTitle.replace(" - Ludopedia", "").trim() : gameTitle;

                return {
                    success: true,
                    data: {
                        title: extractedTitle || gameTitle || "Novo Jogo",
                        image: ogImage || '',
                        desc: ogDesc || 'Sem descrição.',
                        min: min,
                        max: max,
                        time: time,
                        tags: inferTags(extractedTitle || gameTitle || "Novo Jogo")
                    }
                };
            } catch (error) {
                return { success: false, error: error.message };
            }
        };

        const Dashboard = ({ games }) => {
            const total = games.length;
            const loaned = games.filter(g => g.status === 'loaned').length;
            const available = total - loaned;
            const pLoaned = total > 0 ? (loaned / total) * 100 : 0;
            const pAvailable = total > 0 ? (available / total) * 100 : 0;
            return (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 animate-fade-in">
                    <div className="bg-white dark:bg-dark-card p-5 rounded-2xl border border-slate-200 dark:border-dark-border shadow-sm flex items-center justify-between">
                        <div><p className="text-slate-500 dark:text-dark-muted text-xs font-bold uppercase">Total Acervo</p><h2 className="text-3xl font-extrabold text-slate-800 dark:text-dark-text">{total}</h2></div>
                        <div className="bg-indigo-50 dark:bg-slate-800 p-3 rounded-xl text-indigo-600 dark:text-indigo-400"><Icons.Grid size={24}/></div>
                    </div>
                    <div className="bg-white dark:bg-dark-card p-5 rounded-2xl border border-slate-200 dark:border-dark-border shadow-sm flex flex-col justify-between">
                        <div className="flex justify-between items-start mb-2">
                            <div><p className="text-slate-500 dark:text-dark-muted text-xs font-bold uppercase">Disponíveis</p><h2 className="text-3xl font-extrabold text-emerald-600 dark:text-emerald-400">{available}</h2></div>
                            <div className="bg-emerald-50 dark:bg-slate-800 p-2 rounded-lg text-emerald-600 dark:text-emerald-400"><Icons.Check size={20}/></div>
                        </div>
                        <div className="w-full bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden"><div className="bg-emerald-500 h-full rounded-full transition-all duration-1000" style={{width: `${pAvailable}%`}}></div></div>
                    </div>
                    <div className="bg-white dark:bg-dark-card p-5 rounded-2xl border border-slate-200 dark:border-dark-border shadow-sm flex flex-col justify-between">
                        <div className="flex justify-between items-start mb-2">
                            <div><p className="text-slate-500 dark:text-dark-muted text-xs font-bold uppercase">Emprestados</p><h2 className="text-3xl font-extrabold text-amber-600 dark:text-amber-400">{loaned}</h2></div>
                            <div className="bg-amber-50 dark:bg-slate-800 p-2 rounded-lg text-amber-600 dark:text-amber-400"><Icons.Users size={20}/></div>
                        </div>
                        <div className="w-full bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden"><div className="bg-amber-500 h-full rounded-full transition-all duration-1000" style={{width: `${pLoaned}%`}}></div></div>
                    </div>
                </div>
            );
        };

        // --- HELPER FOR UTF8 TO BASE64 ---
        const toBase64 = (str) => {
            return window.btoa(unescape(encodeURIComponent(str)));
        };

        const App = () => {
            const { useState, useMemo, useEffect, useRef } = React;
            
            const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'light');
            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', theme);
            }, [theme]);
            const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');

            const [games, setGames] = useState(() => {
                const saved = localStorage.getItem('meeple_data_v22'); 
                if (saved) return JSON.parse(saved);
                return sortGamesList(RAW_LIST.map((t, i) => generateGameData(t, i)));
            });
            const [history, setHistory] = useState(() => {
                const saved = localStorage.getItem('meeple_history_v22');
                return saved ? JSON.parse(saved) : [];
            });
            const [people, setPeople] = useState(() => {
                const saved = localStorage.getItem('meeple_people_v5');
                return saved ? JSON.parse(saved) : [];
            });
            const [githubToken, setGithubToken] = useState(() => localStorage.getItem('github_token') || '');

            const [viewMode, setViewMode] = useState('grid');
            const [modalGame, setModalGame] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [showPeopleManager, setShowPeopleManager] = useState(false);
            const [notifications, setNotifications] = useState([]);
            const [search, setSearch] = useState('');
            const [showFilters, setShowFilters] = useState(false);
            
            const [filters, setFilters] = useState({ tag: 'all', players: '', time: 'all' });
            const [historyFilter, setHistoryFilter] = useState({ person: 'all', sort: 'dateDesc' });

            const [globalSyncState, setGlobalSyncState] = useState({ active: false, current: 0, total: 0, currentName: '' });
            const [isSingleSyncing, setIsSingleSyncing] = useState(false);
            const [isCloudLoading, setIsCloudLoading] = useState(false);
            const abortSyncRef = useRef(false);
            const fileInputRef = useRef(null);

            const [borrowerId, setBorrowerId] = useState('');
            const [editForm, setEditForm] = useState({});
            const [personForm, setPersonForm] = useState({ id: null, name: '', nickname: '' });

            useEffect(() => {
                localStorage.setItem('meeple_data_v22', JSON.stringify(games));
                localStorage.setItem('meeple_history_v22', JSON.stringify(history));
                localStorage.setItem('meeple_people_v5', JSON.stringify(people));
                localStorage.setItem('github_token', githubToken);
            }, [games, history, people, githubToken]);

            const notify = (msg, type = 'success') => {
                const id = Date.now();
                setNotifications(prev => [...prev, { id, msg, type }]);
            };

            // --- SYNC ---
            const handleSyncAll = async () => {
                const gamesToSync = games.filter(g => !g.lastSync);
                if (gamesToSync.length === 0) { notify("Todos os jogos já estão sincronizados!"); return; }
                if (!confirm(`Sincronizar ${gamesToSync.length} jogos pendentes em paralelo?`)) return;
                
                abortSyncRef.current = false;
                setGlobalSyncState({ active: true, current: 0, total: gamesToSync.length, currentName: 'Iniciando Lote...' });
                let updatedGames = [...games];
                const BATCH_SIZE = 5; let processedCount = 0;

                for (let i = 0; i < gamesToSync.length; i += BATCH_SIZE) {
                    if (abortSyncRef.current) break;
                    const batch = gamesToSync.slice(i, i + BATCH_SIZE);
                    const batchPromises = batch.map(game => scrapeLudopedia(game.title, game.manualLink));
                    setGlobalSyncState({ active: true, current: processedCount, total: gamesToSync.length, currentName: `Lote ${Math.floor(i/BATCH_SIZE) + 1} (${batch.map(g => g.title).join(', ')})` });
                    const results = await Promise.all(batchPromises);
                    results.forEach((result, idx) => {
                        if (result.success) {
                            const originalGame = batch[idx];
                            const mainIndex = updatedGames.findIndex(g => g.id === originalGame.id);
                            if (mainIndex !== -1) {
                                const finalTags = (originalGame.tags && originalGame.tags.length > 0 && !originalGame.tags.includes('Board Game')) ? originalGame.tags : result.data.tags;
                                updatedGames[mainIndex] = { ...updatedGames[mainIndex], image: result.data.image || updatedGames[mainIndex].image, desc: result.data.desc !== 'Sem descrição.' ? result.data.desc : updatedGames[mainIndex].desc, min: result.data.min || updatedGames[mainIndex].min, max: result.data.max || updatedGames[mainIndex].max, time: result.data.time || updatedGames[mainIndex].time, tags: finalTags, lastSync: Date.now() };
                            }
                        }
                    });
                    processedCount += batch.length;
                    setGames([...updatedGames]); 
                    await new Promise(r => setTimeout(r, 800));
                }
                setGlobalSyncState({ active: false, current: 0, total: 0, currentName: '' });
                if (abortSyncRef.current) notify("Sincronização interrompida.", "error"); else notify(`Processo finalizado!`, 'success');
            };

            const handleSingleSync = async () => {
                if (!editForm.title && !editForm.manualLink) { notify("Digite um título ou cole um link.", "error"); return; }
                setIsSingleSyncing(true);
                try {
                    const res = await scrapeLudopedia(editForm.title || '', editForm.manualLink); 
                    if(res.success) { setEditForm(prev => ({...prev, ...res.data, min: res.data.min || prev.min, max: res.data.max || prev.max, time: res.data.time || prev.time, lastSync: Date.now()})); notify("Dados carregados!"); } 
                    else { notify("Erro ao buscar dados.", "error"); }
                } catch (error) { console.error(error); notify("Erro na requisição.", "error"); } 
                finally { setIsSingleSyncing(false); }
            };

            // --- PEOPLE ---
            const savePerson = () => {
                if (!personForm.name.trim()) return notify("Nome obrigatório", "error");
                if (personForm.id) { setPeople(prev => prev.map(p => p.id === personForm.id ? { ...p, name: personForm.name, nickname: personForm.nickname } : p)); notify("Pessoa atualizada!"); }
                else { const newPerson = { id: Date.now().toString(), name: personForm.name, nickname: personForm.nickname }; setPeople(prev => [...prev, newPerson]); notify("Pessoa cadastrada!"); }
                setPersonForm({ id: null, name: '', nickname: '' });
            };
            const deletePerson = (id) => { if(!confirm("Excluir esta pessoa?")) return; setPeople(prev => prev.filter(p => p.id !== id)); };
            const editPerson = (person) => setPersonForm(person);
            const getPersonLabel = (p) => p.nickname ? `${p.name} (${p.nickname})` : p.name;

            // --- HELPERS ---
            const parseDate = (str) => { if(!str || str === '-') return new Date(); const [day, month, year] = str.split('/'); return new Date(year, month - 1, day); };
            const calculateDuration = (item) => { const start = parseDate(item.loanDate); const end = item.returnDate === '-' ? new Date() : parseDate(item.returnDate); return end - start; };

            const filteredHistory = useMemo(() => {
                let list = [...history];
                if (historyFilter.person !== 'all') { const person = people.find(p => p.id === historyFilter.person); if (person) { const searchStr = person.name; list = list.filter(h => h.borrower.includes(searchStr)); } }
                list.sort((a, b) => {
                    if (historyFilter.sort === 'dateDesc') return parseDate(b.loanDate) - parseDate(a.loanDate);
                    if (historyFilter.sort === 'dateAsc') return parseDate(a.loanDate) - parseDate(b.loanDate);
                    if (historyFilter.sort === 'durationDesc') return calculateDuration(b) - calculateDuration(a);
                    if (historyFilter.sort === 'durationAsc') return calculateDuration(a) - calculateDuration(b);
                    return 0;
                });
                return list;
            }, [history, historyFilter, people]);

            const handleLoan = () => {
                if (!borrowerId) { notify("Selecione uma pessoa!", "error"); return; }
                const person = people.find(p => p.id === borrowerId);
                const borrowerName = getPersonLabel(person);
                const loanId = `loan-${Date.now()}`;
                const startDate = new Date().toLocaleDateString('pt-BR');
                const updatedGame = { ...modalGame, status: 'loaned', borrower: borrowerName, loanDate: startDate, loanId: loanId };
                const newHistoryItem = { id: loanId, gameTitle: modalGame.title, gameId: modalGame.id, borrower: borrowerName, loanDate: startDate, returnDate: '-', status: 'active', image: modalGame.image };
                setGames(prev => prev.map(g => g.id === modalGame.id ? updatedGame : g));
                setHistory(prev => [newHistoryItem, ...prev]);
                setModalGame(updatedGame); setBorrowerId(''); 
                notify("Jogo emprestado com sucesso!");
            };

            const handleReturn = () => {
                const returnDate = new Date().toLocaleDateString('pt-BR');
                const updatedGame = { ...modalGame, status: 'available', borrower: '', loanDate: null, loanId: null };
                setHistory(prev => prev.map(h => h.id === modalGame.loanId ? { ...h, returnDate: returnDate, status: 'completed' } : h));
                setGames(prev => prev.map(g => g.id === modalGame.id ? updatedGame : g));
                setModalGame(updatedGame); notify("Devolução registrada!");
            };

            const handleQuickReturn = (historyItem) => {
                if (!confirm(`Confirmar devolução de "${historyItem.gameTitle}"?`)) return;
                const returnDate = new Date().toLocaleDateString('pt-BR');
                const game = games.find(g => g.id === historyItem.gameId) || games.find(g => g.title === historyItem.gameTitle);
                setHistory(prev => prev.map(h => h.id === historyItem.id ? { ...h, returnDate: returnDate, status: 'completed' } : h));
                if (game) { const updatedGame = { ...game, status: 'available', borrower: '', loanDate: null, loanId: null }; setGames(prev => prev.map(g => g.id === game.id ? updatedGame : g)); }
                notify("Devolução registrada via histórico!");
            };

            const saveEdit = () => {
                const tagsRaw = editForm.tagsString ? editForm.tagsString.split(',') : [];
                const tags = tagsRaw.map(t => t.trim()).filter(t => t.length > 0);
                const finalGame = { ...editForm, tags: tags.length > 0 ? tags : ['Board Game'], min: Number(editForm.min), max: Number(editForm.max) };
                if (modalGame.id === 'new') { finalGame.id = `g-${Date.now()}`; finalGame.status = 'available'; setGames(prev => sortGamesList([...prev, finalGame])); setModalGame(finalGame); }
                else { setGames(prev => prev.map(g => g.id === modalGame.id ? { ...modalGame, ...finalGame } : g)); setModalGame({ ...modalGame, ...finalGame }); }
                setIsEditing(false); notify("Jogo salvo!");
            };

            // --- GITHUB SYNC (WRITE) ---
            const handleCloudSave = async () => {
                if (!githubToken) { notify("Configure o Token do GitHub primeiro!", "error"); return; }
                const OWNER = "gabrielultimatex"; // SEU USUÁRIO
                const REPO = "Acervo-de-Jogos";   // SEU REPOSITÓRIO
                const PATH = "backup.json";
                
                setIsCloudLoading(true);
                try {
                    // 1. Get current SHA
                    const getRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
                        headers: { "Authorization": `token ${githubToken}` }
                    });
                    
                    let sha = "";
                    if (getRes.ok) {
                        const getData = await getRes.json();
                        sha = getData.sha;
                    }

                    // 2. Upload
                    const backupData = { games, history, people, meta: { date: new Date().toISOString(), version: "6.0" } };
                    // Fix Base64 encoding for Unicode (acabou o bug de acentos!)
                    const contentBase64 = toBase64(JSON.stringify(backupData, null, 2));

                    const putRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
                        method: "PUT",
                        headers: {
                            "Authorization": `token ${githubToken}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            message: "Backup via MeepleStock Web",
                            content: contentBase64,
                            sha: sha || undefined
                        })
                    });

                    if (putRes.ok) { notify("Backup salvo na nuvem com sucesso!", "success"); }
                    else { throw new Error("Falha no upload."); }

                } catch (error) {
                    console.error(error);
                    notify("Erro ao salvar no GitHub. Verifique o Token.", "error");
                } finally {
                    setIsCloudLoading(false);
                }
            };

            const handleGitHubSync = async () => {
                if (!confirm("Isso substituirá os dados atuais pelo backup do GitHub. Continuar?")) return;
                setIsCloudLoading(true);
                try {
                    const response = await fetch('./backup.json?t=' + new Date().getTime());
                    if (!response.ok) throw new Error("Arquivo backup.json não encontrado.");
                    const parsed = await response.json();
                    if (parsed.games || parsed.history || parsed.people) {
                        if (parsed.games) setGames(parsed.games);
                        if (parsed.history) setHistory(parsed.history);
                        if (parsed.people) setPeople(parsed.people);
                        notify("Dados restaurados da nuvem!", "success");
                        setShowSettings(false);
                    } else { notify("Backup inválido/vazio.", "error"); }
                } catch (err) { console.error(err); notify("Erro ao buscar: " + err.message, "error"); }
                finally { setIsCloudLoading(false); }
            };

            const handleExport = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ games, history, people, meta: { date: new Date().toISOString(), version: "6.0" } }));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", `meeplestock_backup_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
                notify("Download iniciado!");
            };

            const handleImportClick = () => fileInputRef.current.click();
            const handleFileChange = (event) => {
                const fileReader = new FileReader();
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = e => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed.games || parsed.history) {
                            if(confirm("Substituir dados atuais?")) {
                                if (parsed.games) setGames(parsed.games);
                                if (parsed.history) setHistory(parsed.history);
                                if (parsed.people) setPeople(parsed.people);
                                notify("Dados restaurados!", "success");
                                setShowSettings(false);
                            }
                        } else { notify("Arquivo inválido.", "error"); }
                    } catch (err) { notify("Erro ao ler arquivo.", "error"); }
                };
            };

            const handleDelete = () => { if(modalGame.id === 'new') { setModalGame(null); return; } if(confirm(`EXCLUIR "${modalGame.title}"?`)) { setGames(prev => prev.filter(g => g.id !== modalGame.id)); setModalGame(null); notify("Jogo excluído.", "error"); } };
            const clearHistory = () => { if(!confirm("Apagar APENAS concluídos?")) return; setHistory(prev => prev.filter(item => item.status === 'active')); notify("Histórico limpo."); };
            const deleteHistoryItem = (id) => { if(!confirm("Apagar registro?")) return; setHistory(prev => prev.filter(item => item.id !== id)); };

            const uniqueTags = useMemo(() => { const t = new Set(); games.forEach(g => g.tags.forEach(tag => t.add(tag))); return Array.from(t).sort(); }, [games]);
            
            const filteredGames = useMemo(() => {
                return games.filter(g => {
                    const matchSearch = g.title.toLowerCase().includes(search.toLowerCase());
                    const matchTag = filters.tag === 'all' || g.tags.includes(filters.tag);
                    let matchPlayers = true; if (filters.players) { const p = parseInt(filters.players); if (!isNaN(p)) matchPlayers = g.min <= p && g.max >= p; }
                    let matchTime = true; if (filters.time !== 'all') { const t = parseInt(g.time); if (!isNaN(t)) { if (filters.time === 'short') matchTime = t < 30; else if (filters.time === 'medium') matchTime = t >= 30 && t <= 60; else if (filters.time === 'long') matchTime = t > 60; } }
                    return matchSearch && matchTag && matchPlayers && matchTime;
                });
            }, [games, search, filters]);

            const renderGameList = () => {
                if (filteredGames.length === 0) return <div className="text-center py-20 text-slate-400">Nenhum jogo encontrado.</div>;
                if (viewMode === 'grid') return (
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6 animate-fade-in">{filteredGames.map(game => (<div key={game.id} onClick={() => { setModalGame(game); setIsEditing(false); setBorrowerId(''); }} className="group bg-white dark:bg-dark-card rounded-2xl border border-slate-200 dark:border-dark-border hover:shadow-xl transition-all hover:-translate-y-1 cursor-pointer overflow-hidden flex flex-col h-full relative"><div className="relative aspect-[4/3] bg-slate-100 dark:bg-slate-800 overflow-hidden"><img src={game.image} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" />{game.status === 'loaned' && (<div className="absolute inset-0 bg-black/50 backdrop-blur-[1px] flex items-center justify-center"><span className="bg-amber-500 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase shadow-lg">Emprestado</span></div>)}{game.lastSync && (<div className="absolute top-2 right-2 bg-white/90 dark:bg-dark-bg/90 backdrop-blur text-blue-500 p-1 rounded-full shadow-sm"><Icons.CloudCheck size={14}/></div>)}</div><div className="p-4 flex flex-col flex-grow"><h3 className="font-bold text-slate-800 dark:text-dark-text text-sm leading-tight mb-2 line-clamp-2">{game.title}</h3><div className="flex flex-wrap gap-1 mt-auto">{game.tags.slice(0, 2).map(t => <span key={t} className="text-[9px] bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-600">{t}</span>)}</div></div></div>))}</div>
                );
                if (viewMode === 'list') return (
                    <div className="bg-white dark:bg-dark-card rounded-2xl border border-slate-200 dark:border-dark-border overflow-hidden shadow-sm animate-fade-in"><table className="w-full text-left text-sm"><thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-100 dark:border-dark-border text-slate-500 dark:text-dark-muted uppercase text-xs font-bold"><tr><th className="p-4">Jogo</th><th className="hidden sm:table-cell p-4">Jogadores</th><th className="hidden sm:table-cell p-4">Tempo</th><th className="p-4 text-center">Status</th></tr></thead><tbody className="divide-y divide-slate-50 dark:divide-dark-border">{filteredGames.map(game => (<tr key={game.id} onClick={() => { setModalGame(game); setIsEditing(false); setBorrowerId(''); }} className="hover:bg-indigo-50/50 dark:hover:bg-indigo-900/30 cursor-pointer transition-colors"><td className="p-3 pl-4 font-bold text-slate-700 dark:text-dark-text flex items-center gap-3"><div className="w-10 h-10 rounded-lg bg-slate-200 dark:bg-slate-700 overflow-hidden shrink-0 relative"><img src={game.image} className="w-full h-full object-cover"/>{game.lastSync && <div className="absolute bottom-0 right-0 bg-blue-500 text-white p-[2px] rounded-tl-md"><Icons.Check size={8}/></div>}</div>{game.title}</td><td className="p-3 hidden sm:table-cell text-slate-500 dark:text-dark-muted">{game.min}-{game.max}</td><td className="p-3 hidden sm:table-cell text-slate-500 dark:text-dark-muted">{game.time}m</td><td className="p-3 text-center">{game.status === 'available' ? <span className="inline-block w-2 h-2 rounded-full bg-emerald-400"></span> : <span className="text-xs font-bold text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-slate-800 px-2 py-1 rounded border border-amber-100 dark:border-slate-700">Emprestado</span>}</td></tr>))}</tbody></table></div>
                );
                if (viewMode === 'details') return (
                    <div className="space-y-4 animate-fade-in">{filteredGames.map(game => (<div key={game.id} onClick={() => { setModalGame(game); setIsEditing(false); setBorrowerId(''); }} className="bg-white dark:bg-dark-card p-4 rounded-xl border border-slate-200 dark:border-dark-border hover:border-indigo-300 dark:hover:border-indigo-600 hover:shadow-md transition-all cursor-pointer flex flex-col sm:flex-row gap-4"><div className="w-full sm:w-24 h-48 sm:h-32 bg-slate-100 dark:bg-slate-700 rounded-lg overflow-hidden shrink-0 relative"><img src={game.image} className="w-full h-full object-cover" />{game.lastSync && (<div className="absolute top-1 right-1 bg-blue-500 text-white p-1 rounded-full shadow-sm"><Icons.Check size={10}/></div>)}</div><div className="flex-1 flex flex-col"><div className="flex justify-between items-start mb-2"><h3 className="font-bold text-lg text-slate-800 dark:text-dark-text leading-tight">{game.title}</h3>{game.status === 'loaned' && <span className="bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-400 text-xs font-bold px-2 py-1 rounded shrink-0 ml-2">Emprestado</span>}</div><div className="flex gap-3 text-xs text-slate-500 dark:text-dark-muted mb-3"><span className="flex items-center gap-1"><Icons.Users size={14}/> {game.min}-{game.max}</span><span className="flex items-center gap-1"><Icons.Clock size={14}/> {game.time}m</span></div><p className="text-sm text-slate-600 dark:text-slate-400 mb-3 break-words whitespace-pre-wrap">{game.desc}</p><div className="mt-auto flex flex-wrap gap-2">{game.tags.map(t => <span key={t} className="text-xs text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/30 px-2 py-1 rounded font-medium">{t}</span>)}</div></div></div>))}</div>
                );
            };

            return (
                <div className="min-h-screen pb-20">
                    <input type="file" ref={fileInputRef} onChange={handleFileChange} className="hidden" accept=".json" />
                    <div className="fixed top-0 right-0 p-4 z-[200] pointer-events-none">
                         {notifications.map(n => (<div key={n.id} className="pointer-events-auto mb-2"><Notification message={n.msg} type={n.type} onClose={() => setNotifications(p => p.filter(x => x.id !== n.id))} /></div>))}
                    </div>

                    {globalSyncState.active && (<div className="fixed top-0 left-0 w-full h-1 z-[300] bg-slate-200 dark:bg-slate-700"><div className="h-full bg-indigo-600 transition-all duration-300" style={{ width: `${(globalSyncState.current / globalSyncState.total) * 100}%` }}></div></div>)}

                    {globalSyncState.active && (
                        <div className="fixed bottom-4 right-4 z-[300] bg-white dark:bg-dark-card shadow-2xl p-4 rounded-2xl border border-slate-200 dark:border-dark-border flex items-center gap-4 animate-slide-in-right max-w-sm w-full mx-4 sm:mx-0">
                            <div className="bg-indigo-50 dark:bg-slate-800 p-3 rounded-full text-indigo-600 dark:text-indigo-400 shrink-0"><Icons.Loader size={24} className="animate-spin"/></div>
                            <div className="flex-1 min-w-0">

                                                    <div className="bg-amber-50 dark:bg-amber-900/20 p-5 rounded-2xl border border-amber-100 dark:border-amber-900/50 flex items-center justify-between">
                                                        <div className="flex items-center gap-4"><div className="bg-white dark:bg-slate-700 p-3 rounded-full text-amber-500 shadow-sm"><Icons.Users size={24}/></div><div><p className="text-xs font-bold text-amber-800 dark:text-amber-400 uppercase">Status: Emprestado</p><p className="font-bold text-slate-800 dark:text-dark-text text-lg">{modalGame.borrower}</p><p className="text-xs text-amber-700 dark:text-amber-500 mt-1">Desde: {modalGame.loanDate}</p></div></div>
                                                        <button onClick={handleReturn} className="bg-white dark:bg-slate-700 border border-amber-200 dark:border-amber-700 text-amber-700 dark:text-amber-400 hover:bg-amber-100 dark:hover:bg-amber-900/30 px-6 py-2.5 rounded-xl text-sm font-bold transition-colors shadow-sm">Devolver</button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </>
                                ) : (
                                    <div className="flex flex-col h-full bg-slate-50 dark:bg-slate-900 overflow-hidden rounded-2xl">
                                        <div className="bg-white dark:bg-dark-card p-4 border-b border-slate-200 dark:border-dark-border flex justify-between items-center shadow-sm z-10 shrink-0">
                                            <h3 className="font-bold text-lg text-slate-800 dark:text-dark-text flex items-center gap-2"><Icons.Edit className="text-indigo-600"/> {modalGame.id === 'new' ? 'Novo Jogo' : 'Editar Jogo'}</h3>
                                            <button onClick={() => setIsEditing(false)} className="text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-white bg-slate-100 dark:bg-slate-800 p-2 rounded-lg"><Icons.X/></button>
                                        </div>
                                        <div className="modal-scroll p-6 space-y-5">
                                            <div className="bg-blue-50 dark:bg-slate-800 p-4 rounded-xl border border-blue-100 dark:border-slate-700"><label className="block text-xs font-bold text-blue-800 dark:text-blue-400 mb-1">Link Ludopedia (Opcional)</label>
                                                <div className="flex gap-2">
                                                    <input className="w-full border border-blue-200 dark:border-slate-600 rounded-lg p-2 text-sm bg-white dark:bg-slate-700 dark:text-white" placeholder="https://ludopedia.com.br/jogo/..." value={editForm.manualLink || ''} onChange={e => setEditForm({...editForm, manualLink: e.target.value})} />
                                                    <button onClick={handleSingleSync} disabled={isSingleSyncing} className={`text-white px-3 rounded-lg flex items-center justify-center transition-colors ${isSingleSyncing ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                                        {isSingleSyncing ? <Icons.Loader size={16}/> : <Icons.CloudSync size={16}/>}
                                                    </button>
                                                </div>
                                                <p className="text-[10px] text-blue-600 dark:text-blue-400 mt-1">Cole o link e clique no botão azul para buscar, mesmo sem título.</p>
                                            </div>
                                            <div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Título</label><input className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm font-bold text-slate-800 dark:text-white dark:bg-slate-800" value={editForm.title} onChange={e => setEditForm({...editForm, title: e.target.value})} /></div>
                                            <div className="grid grid-cols-2 gap-4"><div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Imagem URL</label><input className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm dark:bg-slate-800 dark:text-white" value={editForm.image} onChange={e => setEditForm({...editForm, image: e.target.value})} /></div><div className="h-[60px] bg-slate-200 dark:bg-slate-700 rounded-lg overflow-hidden border border-slate-300 dark:border-slate-600"><img src={editForm.image} className="w-full h-full object-cover" onError={e => e.target.style.opacity=0} /></div></div>
                                            <div className="grid grid-cols-3 gap-4"><div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Min Jog.</label><input type="number" className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm dark:bg-slate-800 dark:text-white" value={editForm.min} onChange={e => setEditForm({...editForm, min: e.target.value})} /></div><div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Max Jog.</label><input type="number" className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm dark:bg-slate-800 dark:text-white" value={editForm.max} onChange={e => setEditForm({...editForm, max: e.target.value})} /></div><div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Minutos</label><input className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm dark:bg-slate-800 dark:text-white" value={editForm.time} onChange={e => setEditForm({...editForm, time: e.target.value})} /></div></div>
                                            <div className="bg-white dark:bg-dark-card p-4 rounded-xl border border-slate-200 dark:border-dark-border shadow-sm"><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-2 flex items-center gap-2"><Icons.Tag size={14}/> Tags (Separadas por vírgula)</label><input className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm mb-3 focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-slate-800 dark:text-white" value={editForm.tagsString} onChange={e => setEditForm({...editForm, tagsString: e.target.value})} /><div className="flex flex-wrap gap-2 mt-2"><span className="text-[10px] font-bold text-slate-400 dark:text-slate-500 w-full uppercase">Sugeridas:</span>{uniqueTags.map(tag => <button key={tag} onClick={() => setEditForm(p => ({...p, tagsString: p.tagsString ? p.tagsString + ', ' + tag : tag}))} className="text-[10px] bg-slate-100 dark:bg-slate-700 hover:bg-indigo-100 dark:hover:bg-indigo-900 text-slate-600 dark:text-slate-300 hover:text-indigo-700 dark:hover:text-indigo-300 px-2 py-1 rounded border border-slate-200 dark:border-slate-600 transition-colors">+ {tag}</button>)}</div></div>
                                            <div><label className="block text-xs font-bold text-slate-500 dark:text-dark-muted mb-1">Descrição</label><textarea rows="4" className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2.5 text-sm dark:bg-slate-800 dark:text-white" value={editForm.desc} onChange={e => setEditForm({...editForm, desc: e.target.value})}></textarea></div>
                                        </div>
                                        <div className="p-4 bg-white dark:bg-dark-card border-t border-slate-200 dark:border-dark-border flex justify-between gap-3 shrink-0 rounded-b-2xl">
                                            {modalGame.id !== 'new' && (<button onClick={handleDelete} className="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 p-3 rounded-xl hover:bg-red-100 dark:hover:bg-red-900/30 transition-colors border border-red-100 dark:border-red-900/30" title="Excluir Jogo"><Icons.Trash size={20}/></button>)}
                                            <button onClick={saveEdit} className="bg-indigo-600 text-white font-bold py-3 px-8 rounded-xl hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-200 flex-1">Salvar Alterações</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
