                            {game.status === 'loaned' && (<div className={`absolute inset-0 backdrop-blur-[1px] flex items-center justify-center ${overdue ? 'bg-red-900/40' : 'bg-black/50'}`}><span className={`text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase shadow-lg ${overdue ? 'bg-red-500 animate-pulse' : 'bg-amber-500'}`}>{overdue ? 'Atrasado' : 'Emprestado'}</span></div>)}
                            {cartBlocked && (<div className="absolute bottom-2 left-2 bg-slate-700/90 text-white text-[9px] font-bold px-2 py-0.5 rounded shadow-lg z-20" title="Essa pessoa já está na fila desse jogo">Já na fila</div>)}
                            {game.lastSync && !isSelectionMode && !isCartMode && (<div className="absolute top-2 right-2 bg-white/90 dark:bg-dark-bg/90 backdrop-blur text-blue-500 p-1 rounded-full shadow-sm z-20"><Icons.CloudCheck size={14}/></div>)}
                            {/* Expansion Icon Fix */}
                            {game.isExpansion && !isSelectionMode && !isCartMode && (<div className="absolute top-2 left-2 bg-purple-500 text-white p-1 rounded-full shadow-sm z-30" title="Expansão"><Icons.Puzzle size={14}/></div>)}
                            
                            {isNew(game) && !isSelectionMode && !isCartMode && (<div className={`absolute ${game.isExpansion ? 'top-8' : 'top-2'} left-2 bg-cyan-500 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow-lg z-20 flex items-center gap-1 animate-pulse-glow`}><Icons.Sparkles size={10} fill="white"/> NOVO</div>)}
                            
                            {/* Selection Checkbox (modo admin, exclusão/tag/sync em lote) */}
                            {isSelectionMode && (
                                <div className="absolute top-2 right-2 z-30">
                                    <div className={`w-6 h-6 rounded-md border-2 flex items-center justify-center ${isSelected ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 bg-white'}`}>
                                        {isSelected && <Icons.Check size={16}/>}
                                    </div>
                                </div>
                            )}

                            {/* Checkbox do Carrinho (qualquer pessoa pode usar; no modo Emprestar só em jogos disponíveis, no modo Interesse em qualquer um que a pessoa ainda não esteja na fila) */}
                            {isCartMode && (cartPurpose === 'interest' ? !cartBlocked : game.status === 'available') && (
                                <div className="absolute top-2 right-2 z-30">
                                    <div className={`w-6 h-6 rounded-md border-2 flex items-center justify-center ${isInCart ? (cartPurpose === 'interest' ? 'border-pink-600 bg-pink-600' : 'border-emerald-600 bg-emerald-600') + ' text-white' : 'border-slate-300 bg-white'}`}>
                                        {isInCart && <Icons.Check size={16}/>}
                                    </div>
                                </div>
                            )}

                            {/* SHORTCUT BUTTON */}
                            { (game.status === 'available' || isLoggedIn) && !isSelectionMode && !isCartMode && (
                                <button onClick={(e) => handleShortcut(e, game)} className={`absolute bottom-2 right-2 z-10 w-8 h-8 rounded-full shadow-lg flex items-center justify-center transition-transform active:scale-95 ${game.status === 'available' ? 'bg-indigo-600 hover:bg-indigo-700 text-white' : 'bg-amber-500 hover:bg-amber-600 text-white'}`} title="Emprestar ou devolver rapidamente">
                                    {game.status === 'available' ? <Icons.Hand size={16}/> : <Icons.Return size={16}/>}
                                </button>
                            )}
                        </div>
                        <div className="p-4 flex flex-col flex-grow">
                            <h3 className="font-bold text-slate-800 dark:text-dark-text text-sm leading-tight mb-1 line-clamp-2">{game.title}</h3>
                            <div className="flex items-center gap-1 mb-2">{[1,2,3,4,5].map(s => <Icons.Star key={s} size={10} fill={s <= (game.rating||0) ? "orange" : "none"} className={s <= (game.rating||0) ? "text-orange-400" : "text-slate-300"}/>)}</div>
                            <div className="flex flex-wrap gap-1 mt-auto">{game.tags.slice(0, 2).map(t => <span key={t} className="text-[9px] bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-600 truncate max-w-full">{t}</span>)}</div>
                        </div>
                    </div>)})}</div>
                );

                if (viewMode === 'list') return (
                    <div className="bg-white dark:bg-dark-card rounded-2xl border border-slate-200 dark:border-dark-border shadow-sm animate-fade-in flex flex-col">
                        <div className="overflow-x-auto w-full hide-scrollbar">
                            <table className="w-full text-left text-sm min-w-[600px]">
                                <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-100 dark:border-dark-border text-slate-50 dark:text-dark-muted uppercase text-xs font-bold">
                                    <tr>
                                        <th className="p-4 w-10"></th>
                                        <th className="p-4">Jogo</th>
                                        <th className="p-4">Jogadores</th>
                                        <th className="p-4">Tempo</th>
                                        <th className="p-4 text-center">Status</th>
                                        <th className="p-4"></th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-50 dark:divide-dark-border">
                                    {filteredGames.map(game => {
                                        const overdue = game.status === 'loaned' && isOverdue(game.loanDueDate);
                                        const isSelected = selectedGames.has(game.id);
                                        return (
                                            <tr key={game.id} onClick={() => { 
                                                if(isSelectionMode) toggleGameSelection({stopPropagation:()=>{}}, game.id);
                                                else { setModalGame(game); setIsEditing(false); setShowQRCode(false); setBorrowerId(''); setLoanDueDate(''); } 
                                            }} className={`cursor-pointer transition-colors ${isSelected ? 'bg-indigo-50 dark:bg-indigo-900/20' : overdue ? 'bg-red-50 dark:bg-red-900/10' : 'hover:bg-indigo-50/50 dark:hover:bg-indigo-900/30'}`}>
                                                <td className="p-3 pl-4">
                                                    {isSelectionMode && (
                                                        <div className={`w-5 h-5 rounded border flex items-center justify-center ${isSelected ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300 bg-white'}`}>{isSelected && <Icons.Check size={12}/>}</div>
                                                    )}
                                                </td>
                                                <td className="p-3 font-bold text-slate-700 dark:text-dark-text flex items-center gap-3">
                                                    <div className="w-10 h-10 rounded-lg bg-slate-200 dark:bg-slate-700 overflow-hidden shrink-0 relative"><img src={getOptimizedImage(game.image, 60, 60)} className="w-full h-full object-cover" onError={handleThumbImageError(game.image)}/></div>
                                                    <div>{game.title} {isNew(game) && <span className="ml-2 text-[9px] bg-cyan-500 text-white px-1.5 py-0.5 rounded font-bold">NOVO</span>}
                                                        <div className="flex gap-0.5 mt-1">{[1,2,3,4,5].map(s => <Icons.Star key={s} size={8} fill={s <= (game.rating||0) ? "orange" : "none"} className={s <= (game.rating||0) ? "text-orange-400" : "text-slate-300"}/>)}</div>
                                                    </div>
                                                </td>
                                                <td className="p-3 text-slate-500 dark:text-dark-muted">{game.min}-{game.max}</td>
                                                <td className="p-3 text-slate-500 dark:text-dark-muted">{game.time}m</td>
                                                <td className="p-3 text-center whitespace-nowrap">
                                                    {game.status === 'available' ? <span className="inline-block w-2 h-2 rounded-full bg-emerald-400"></span> : <span className={`text-xs font-bold px-2 py-1 rounded border ${overdue ? 'text-red-600 bg-red-100 border-red-200' : 'text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-slate-800 border-amber-100 dark:border-slate-700'}`}>{overdue ? 'Atrasado' : 'Emprestado'}</span>}
                                                </td>
                                                <td className="p-3 text-right whitespace-nowrap">
                                                     { (game.status === 'available' || isLoggedIn) && !isSelectionMode && (
                                                         <button onClick={(e) => handleShortcut(e, game)} className={`p-2 rounded-lg ${game.status === 'available' ? 'text-indigo-600 hover:bg-indigo-50' : 'text-amber-600 hover:bg-amber-50'}`} title="Emprestar ou devolver rapidamente">
                                                            {game.status === 'available' ? <Icons.Hand size={18}/> : <Icons.Return size={18}/>}
                                                         </button>
                                                     )}
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
                if (viewMode === 'details') return (
                    <div className="space-y-4 animate-fade-in">{filteredGames.map(game => (<div key={game.id} onClick={() => { setModalGame(game); setIsEditing(false); setShowQRCode(false); setBorrowerId(''); setLoanDueDate(''); }} className="bg-white dark:bg-dark-card p-4 rounded-xl border border-slate-200 dark:border-dark-border hover:border-indigo-300 dark:hover:border-indigo-600 hover:shadow-md transition-all cursor-pointer flex flex-col sm:flex-row gap-4"><div className="w-full sm:w-24 h-48 sm:h-32 bg-slate-100 dark:bg-slate-700 rounded-lg overflow-hidden shrink-0 relative"><img src={getOptimizedImage(game.image, 200, 300)} className="w-full h-full object-cover" onError={handleThumbImageError(game.image)} />{game.lastSync && (<div className="absolute top-1 right-1 bg-blue-500 text-white p-1 rounded-full shadow-sm"><Icons.Check size={10}/></div>)}</div><div className="flex-1 flex flex-col"><div className="flex justify-between items-start mb-2"><h3 className="font-bold text-lg text-slate-800 dark:text-dark-text leading-tight">{game.title} {isNew(game) && <span className="ml-2 text-[9px] bg-cyan-500 text-white px-1.5 py-0.5 rounded font-bold align-middle">NOVO</span>}</h3>
                        <div className="flex items-center gap-2">
                             {game.status === 'loaned' && <span className="bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-400 text-xs font-bold px-2 py-1 rounded shrink-0">Emprestado</span>}
                             { (game.status === 'available' || isLoggedIn) && (
                                 <button onClick={(e) => handleShortcut(e, game)} className={`p-1.5 rounded-lg border ${game.status === 'available' ? 'border-indigo-100 text-indigo-600 hover:bg-indigo-50' : 'border-amber-100 text-amber-600 hover:bg-amber-50'}`} title="Emprestar ou devolver rapidamente">
                                    {game.status === 'available' ? <Icons.Hand size={16}/> : <Icons.Return size={16}/>}
                                 </button>
                             )}
                        </div>
                    </div><div className="flex gap-3 text-xs text-slate-500 dark:text-dark-muted mb-2"><span className="flex items-center gap-1"><Icons.Users size={14}/> {game.min}-{game.max}</span><span className="flex items-center gap-1"><Icons.Clock size={14}/> {game.time}m</span></div>
                    <div className="flex items-center gap-1 mb-2">{[1,2,3,4,5].map(s => <Icons.Star key={s} size={12} fill={s <= (game.rating||0) ? "orange" : "none"} className={s <= (game.rating||0) ? "text-orange-400" : "text-slate-300"}/>)}</div>
                    <p className="text-sm text-slate-600 dark:text-slate-400 mb-3 break-words whitespace-pre-wrap">{game.desc}</p><div className="mt-auto flex flex-wrap gap-2">{game.tags.map(t => <span key={t} className="text-xs text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/30 px-2 py-1 rounded font-medium">{t}</span>)}</div></div></div>))}</div>
                );
            };

            return (
                <div className="min-h-screen pb-20">
                    {showConfetti && <Confetti />}
                    <input type="file" ref={fileInputRef} onChange={handleFileChange} className="hidden" accept=".json" />
                    <input type="file" ref={csvInputRef} onChange={handleCSVChange} className="hidden" accept=".csv" />
                    <GameGuru isOpen={showGuru} onClose={() => setShowGuru(false)} games={filteredGames} onSelect={(game) => { setModalGame(game); setIsEditing(false); }} />
                    <Randomizer isOpen={showRandomizer} onClose={() => setShowRandomizer(false)} onFinish={finishRandomizer} />

                    {/* MODAL: CONFIGURAÇÃO DO SORTEIO */}
                    {showRandomizerSetup && (
                        <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm animate-fade-in no-print" onClick={() => setShowRandomizerSetup(false)}>
                            <div className="bg-white dark:bg-dark-card w-full max-w-sm rounded-2xl shadow-2xl modal-content" onClick={e => e.stopPropagation()}>
                                <div className="p-4 border-b border-slate-100 dark:border-dark-border flex justify-between items-center bg-slate-50 dark:bg-slate-800 shrink-0">
                                    <h3 className="font-bold text-slate-800 dark:text-dark-text flex items-center gap-2"><Icons.Dice size={18}/> Sortear um Jogo</h3>
                                    <button onClick={() => setShowRandomizerSetup(false)} className="dark:text-white" title="Fechar sorteio"><Icons.X/></button>
                                </div>
                                <div className="p-4 modal-scroll space-y-4">
                                    <div className="flex gap-2 bg-slate-100 dark:bg-slate-800 p-1 rounded-lg">
                                        <button onClick={() => setRandomizerFilter(prev => ({...prev, mode: 'all'}))} className={`flex-1 py-1.5 rounded-md text-xs font-bold transition-colors ${randomizerFilter.mode === 'all' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`} title="Sortear entre todos os jogos disponíveis">Todos os Disponíveis</button>
                                        <button onClick={() => setRandomizerFilter(prev => ({...prev, mode: 'presence'}))} className={`flex-1 py-1.5 rounded-md text-xs font-bold transition-colors ${randomizerFilter.mode === 'presence' ? 'bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`} title="Sortear só entre quem está presente">Quem Está Presente</button>
                                    </div>

                                    {randomizerFilter.mode === 'presence' && (
                                        <>
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 dark:text-dark-muted mb-2 block">Quantos jogadores vão jogar?</label>
                                                <input
                                                    type="number" min="0"
                                                    className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2 text-sm dark:bg-slate-700 dark:text-white mb-1"
                                                    placeholder="Digite um número (ex: 4)"
                                                    value={getRandomizerPresentCount() > 0 ? String(getRandomizerPresentCount()) : ''}
                                                    onChange={e => {
                                                        const raw = e.target.value;
                                                        const typedTotal = raw === '' ? 0 : parseInt(raw);
                                                        setRandomizerFilter(prev => ({...prev, manualExtra: Math.max(0, (isNaN(typedTotal) ? 0 : typedTotal) - prev.presentIds.length)}));
                                                    }}
                                                />
                                                <p className="text-[10px] text-slate-400 mb-3">Selecionar pessoas abaixo soma a esse número automaticamente. Você também pode aumentá-lo à mão pra contar gente que não está na lista (não dá pra descer abaixo da quantidade já selecionada — pra isso, desmarque alguém).</p>
                                                <label className="text-xs font-bold text-slate-500 dark:text-dark-muted mb-2 block">Ou selecione quem está presente hoje:</label>
                                                <div className="flex flex-wrap gap-2 max-h-40 overflow-y-auto">
                                                    {people.map(p => {
                                                        const selected = randomizerFilter.presentIds.includes(p.id);
                                                        return (
                                                            <button key={p.id} onClick={() => setRandomizerFilter(prev => {
                                                                    const newIds = selected ? prev.presentIds.filter(id => id !== p.id) : [...prev.presentIds, p.id];
                                                                    return {...prev, presentIds: newIds};
                                                                })}
                                                                className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-colors ${selected ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300'}`} title="Marcar ou desmarcar presença dessa pessoa">
                                                                {getPersonLabel(p)}
                                                            </button>
                                                        );
                                                    })}
                                                    {people.length === 0 && <p className="text-xs text-slate-400">Nenhuma pessoa cadastrada.</p>}
                                                </div>
                                                <p className="text-[10px] text-slate-400 mt-1.5">{getRandomizerPresentCount() > 0 ? `${getRandomizerPresentCount()} jogador(es) — só entram jogos pra esse tanto de gente` : 'Nenhuma quantidade definida — não filtra por número de jogadores'}</p>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 dark:text-dark-muted mb-1 block">Tempo disponível (minutos, opcional)</label>
                                                <input type="number" min="1" className="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2 text-sm dark:bg-slate-700 dark:text-white" placeholder="Ex: 60" value={randomizerFilter.timeMinutes} onChange={e => setRandomizerFilter(prev => ({...prev, timeMinutes: e.target.value}))} />
                                            </div>
                                        </>
                                    )}

                                    <button onClick={runRandomizer} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg text-sm flex items-center justify-center gap-2" title="Sortear um jogo"><Icons.Dice size={18}/> Sortear!</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <div className="fixed top-0 right-0 p-4 z-[200] pointer-events-none no-print">
                         {notifications.map(n => (<div key={n.id} className="pointer-events-auto mb-2"><Notification message={n.msg} type={n.type} onClose={() => setNotifications(p => p.filter(x => x.id !== n.id))} /></div>))}
                    </div>

                    {/* Bulk Actions Floating Bar */}
                    {isSelectionMode && (
                        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-[200] bg-white dark:bg-slate-800 shadow-2xl border border-slate-200 dark:border-slate-600 rounded-2xl p-3 flex gap-3 animate-slide-up no-print">
                            <button onClick={toggleSelectAll} className="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg flex flex-col items-center gap-1 text-[10px] font-bold" title="Selecionar ou desmarcar todos os jogos visíveis">
                                {filteredGames.length > 0 && selectedGames.size === filteredGames.length ? <Icons.CheckSquare size={20}/> : <Icons.Square size={20}/>}
                                {filteredGames.length > 0 && selectedGames.size === filteredGames.length ? 'Desmarcar' : 'Todos'}
                            </button>
                            {selectedGames.size > 0 && (
                                <>
                                    <div className="px-3 flex items-center font-bold text-slate-700 dark:text-white border-l border-r border-slate-200 dark:border-slate-600 text-sm">{selectedGames.size} selecionados</div>
                                    {games.some(g => selectedGames.has(g.id) && g.status === 'loaned') && (
                                        <button onClick={handleBulkReturn} className="p-2 text-amber-600 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-slate-700 rounded-lg flex flex-col items-center gap-1 text-[10px] font-bold" title="Devolver os jogos selecionados"><Icons.Return size={20}/> Devolver</button>
                                    )}
                                    <button onClick={handleBulkSync} className="p-2 text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-slate-700 rounded-lg flex flex-col items-center gap-1 text-[10px] font-bold" title="Sincronizar os jogos selecionados com a Ludopedia"><Icons.CloudSync size={20}/> Sync</button>
                                    <button onClick={handleBulkTag} className="p-2 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-slate-700 rounded-lg flex flex-col items-center gap-1 text-[10px] font-bold" title="Adicionar uma tag aos jogos selecionados"><Icons.Tag size={20}/> Tag</button>
                                    <button onClick={handleBulkDelete} className="p-2 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-slate-700 rounded-lg flex flex-col items-center gap-1 text-[10px] font-bold" title="Excluir os jogos selecionados"><Icons.Trash size={20}/> Excluir</button>
                                </>
                            )}
                        </div>
                    )}

                    {/* Barra do Carrinho de Empréstimo/Interesse — disponível pra qualquer pessoa */}
                    {isCartMode && (
                        <div className={`fixed bottom-24 left-1/2 -translate-x-1/2 z-[200] bg-white dark:bg-slate-800 shadow-2xl border rounded-2xl p-3 flex flex-col gap-2 animate-slide-up no-print max-w-[92vw] ${cartPurpose === 'interest' ? 'border-pink-200 dark:border-pink-900' : 'border-emerald-200 dark:border-emerald-800'}`}>
                            <div className="flex gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-lg">
                                <button onClick={() => setCartPurposeSafe('loan')} className={`flex-1 py-1 rounded-md text-xs font-bold transition-colors flex items-center justify-center gap-1 ${cartPurpose === 'loan' ? 'bg-white dark:bg-slate-700 text-emerald-600 dark:text-emerald-400 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`} title="Usar o carrinho para emprestar jogos"><Icons.ShoppingCart size={14}/> Emprestar</button>
                                <button onClick={() => setCartPurposeSafe('interest')} className={`flex-1 py-1 rounded-md text-xs font-bold transition-colors flex items-center justify-center gap-1 ${cartPurpose === 'interest' ? 'bg-white dark:bg-slate-700 text-pink-600 dark:text-pink-400 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`} title="Usar o carrinho para registrar interesse na fila"><Icons.Heart size={14}/> Interesse</button>
                            </div>
                            {cartPurpose === 'interest' && (
                                <select className="w-full px-3 h-9 text-xs rounded-lg border border-pink-200 dark:border-pink-900 outline-none bg-white dark:bg-slate-700 dark:text-white" value={cartBorrowerId} onChange={e => setCartBorrowerSafe(e.target.value)} title="Escolher para quem é o interesse — jogos em que essa pessoa já está na fila ficam bloqueados">
                                    <option value="">Pra quem é o interesse? Selecione...</option>
                                    {people.map(p => <option key={p.id} value={p.id}>{getPersonLabel(p)}</option>)}
                                </select>
                            )}
                            <div className="flex items-center gap-3">
                                <Icons.ShoppingCart size={20} className={`shrink-0 ${cartPurpose === 'interest' ? 'text-pink-600 dark:text-pink-400' : 'text-emerald-600 dark:text-emerald-400'}`}/>
                                <span className="font-bold text-slate-700 dark:text-white text-sm shrink-0 whitespace-nowrap">{cartGameIds.size} no carrinho</span>
                                <button onClick={() => { if (cartGameIds.size > 0) setShowCartCheckout(true); }} disabled={cartGameIds.size === 0} className={`disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold text-xs sm:text-sm px-4 py-2 rounded-lg transition-colors shrink-0 whitespace-nowrap ${cartPurpose === 'interest' ? 'bg-pink-600 hover:bg-pink-700' : 'bg-emerald-600 hover:bg-emerald-700'}`} title="Finalizar o carrinho">{cartPurpose === 'interest' ? 'Registrar Interesse' : 'Finalizar Empréstimo'}</button>
                                <button onClick={toggleCartMode} className="text-slate-400 hover:text-red-500 shrink-0 p-1" title="Cancelar carrinho"><Icons.X size={18}/></button>
                            </div>
                        </div>
                    )}

                    {/* Barra de seleção em massa do Histórico */}
                    {isHistorySelectionMode && (
                        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-[200] bg-white dark:bg-slate-800 shadow-2xl border border-slate-200 dark:border-slate-600 rounded-2xl p-3 flex items-center gap-3 animate-slide-up no-print">
                            <span className="font-bold text-slate-700 dark:text-white text-sm shrink-0 whitespace-nowrap px-2">{selectedHistoryIds.size} selecionado(s)</span>
                            {history.some(h => selectedHistoryIds.has(h.id) && h.status === 'active') && (
                                <button onClick={handleBulkReturnFromHistory} className="bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs sm:text-sm px-4 py-2 rounded-lg transition-colors shrink-0 flex items-center gap-2 whitespace-nowrap" title="Devolver os empréstimos ativos selecionados"><Icons.Return size={16}/> Devolver</button>
                            )}

                                    </div>
                                </div>
                                <button onClick={() => setShowOverdueModal(true)} className="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-xl text-sm flex items-center justify-center gap-2 shadow-sm transition-colors shrink-0" title="Ver e cobrar jogos atrasados">
                                    <Icons.Whatsapp size={16}/> Cobrar Atrasados
                                </button>
                            </div>
                        )}
                        {viewMode === 'wishlist' || viewMode === 'history' ? null : <Dashboard games={games} wishlist={wishlist} history={history} onGoToHistory={() => setViewMode('history')} />}
                        {renderGameList()}
                    </main>

                    {/* MODAL: AVISO DE FILA DE RESERVA (aparece depois de devolver um jogo com fila) */}
                    {reservationAlert && (
                        <div className="fixed inset-0 z-[320] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm animate-fade-in no-print" onClick={() => setReservationAlert(null)}>
                            <div className="bg-white dark:bg-dark-card w-full max-w-sm rounded-2xl shadow-2xl modal-content" onClick={e => e.stopPropagation()}>
                                <div className="p-5 modal-scroll">
                                    <div className="flex items-center gap-3 mb-4">
                                        <div className="bg-indigo-100 dark:bg-indigo-900/40 p-3 rounded-full text-indigo-600 dark:text-indigo-400 shrink-0"><Icons.Users size={22}/></div>
                                        <div className="min-w-0">
                                            <h3 className="font-bold text-slate-800 dark:text-dark-text">Tem gente na fila!</h3>
                                            <p className="text-xs text-slate-500 dark:text-dark-muted truncate">{reservationAlert.items.length > 1 ? `${reservationAlert.items.length} jogos devolvidos tinham reserva.` : `"${reservationAlert.items[0].gameTitle}" tinha reserva.`}</p>
                                        </div>
                                    </div>
                                    <div className="space-y-4">
                                        {reservationAlert.items.map(item => (
                                            <div key={item.gameId}>
                                                {reservationAlert.items.length > 1 && <p className="text-xs font-bold text-slate-500 dark:text-dark-muted uppercase mb-1.5 truncate">{item.gameTitle}</p>}
                                                <div className="space-y-2">
                                                    {item.queue.map((r, i) => {
                                                        const resPerson = people.find(p => p.id === r.personId);
                                                        if (!resPerson) return null;
                                                        return (
                                                            <div key={r.id} className="flex items-center justify-between gap-2 bg-slate-50 dark:bg-slate-800 p-3 rounded-xl">
                                                                <span className="font-bold text-sm text-slate-700 dark:text-dark-text truncate">{i + 1}º — {getPersonLabel(resPerson)}</span>
                                                                <a
                                                                    href={buildWhatsAppLink(resPerson.phone, buildReservationMessage(item.gameTitle, resPerson))}
                                                                    target="_blank" rel="noreferrer"
                                                                    className="bg-green-500 hover:bg-green-600 text-white p-2 rounded-lg shrink-0 transition-colors"
                                                                    title="Avisar via WhatsApp"
                                                                >
                                                                    <Icons.Whatsapp size={16}/>
                                                                </a>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="p-4 border-t border-slate-100 dark:border-dark-border shrink-0">
                                    <button onClick={() => setReservationAlert(null)} className="w-full text-sm text-slate-500 dark:text-dark-muted font-bold py-2 hover:text-slate-700 dark:hover:text-slate-300 transition-colors" title="Fechar aviso">Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: AVISO DE EMPRÉSTIMO FORA DA ORDEM DA FILA */}
                    {loanQueueWarning && (() => {
                        const firstPerson = people.find(p => p.id === loanQueueWarning.queue[0]?.personId);
                        const chosenPerson = people.find(p => p.id === loanQueueWarning.borrowerId);
                        return (
                            <div className="fixed inset-0 z-[320] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm animate-fade-in no-print" onClick={() => setLoanQueueWarning(null)}>
                                <div className="bg-white dark:bg-dark-card w-full max-w-sm rounded-2xl shadow-2xl p-6" onClick={e => e.stopPropagation()}>
                                    <div className="flex items-center gap-3 mb-4">
                                        <div className="bg-amber-100 dark:bg-amber-900/40 p-3 rounded-full text-amber-600 dark:text-amber-400 shrink-0"><Icons.Alert size={22}/></div>
                                        <div className="min-w-0">
                                            <h3 className="font-bold text-slate-800 dark:text-dark-text">Tem gente na fila!</h3>
                                            <p className="text-xs text-slate-500 dark:text-dark-muted truncate">"{loanQueueWarning.gameTitle}" tem reserva.</p>
                                        </div>
                                    </div>
                                    <p className="text-sm text-slate-600 dark:text-slate-300 mb-3">
                                        <strong>{firstPerson ? getPersonLabel(firstPerson) : 'Alguém'}</strong> é o(a) próximo(a) da fila para este jogo. Quer emprestar mesmo assim para <strong>{chosenPerson ? getPersonLabel(chosenPerson) : 'essa pessoa'}</strong>?
                                    </p>
                                    {!loanQueueWarning.alreadyInQueue && (
                                        <p className="text-xs text-indigo-700 dark:text-indigo-300 bg-indigo-50 dark:bg-indigo-900/20 p-3 rounded-lg mb-4">
                                            {chosenPerson ? getPersonLabel(chosenPerson) : 'Essa pessoa'} também não está na fila desse jogo. Se preferir, você pode colocá-la no final da fila em vez de emprestar agora.
                                        </p>
                                    )}
                                    <div className="flex flex-col gap-2 mt-2">
                                        <button onClick={() => { executeLoan(loanQueueWarning.borrowerId); setLoanQueueWarning(null); }} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition-colors" title="Confirmar o empréstimo mesmo com fila">Emprestar mesmo assim</button>
                                        {!loanQueueWarning.alreadyInQueue && (
                                            <button onClick={() => { addReservation(loanQueueWarning.gameId, loanQueueWarning.borrowerId); setLoanQueueWarning(null); setBorrowerId(''); setLoanDueDate(''); }} className="w-full bg-white dark:bg-slate-700 border border-indigo-200 dark:border-indigo-800 text-indigo-700 dark:text-indigo-300 font-bold py-2.5 rounded-xl text-sm hover:bg-indigo-50 dark:hover:bg-slate-600 transition-colors" title="Colocar essa pessoa na fila em vez de emprestar">Adicionar à fila</button>
                                        )}
                                        <button onClick={() => setLoanQueueWarning(null)} className="w-full text-sm text-slate-500 dark:text-dark-muted font-bold py-2 hover:text-slate-700 dark:hover:text-slate-300 transition-colors" title="Cancelar o empréstimo">Cancelar</button>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* MODAL: FINALIZAR CARRINHO DE EMPRÉSTIMO/INTERESSE */}
                    {showCartCheckout && (() => {
                        const cartGames = games.filter(g => cartGameIds.has(g.id));
                        // No modo empréstimo: jogos do carrinho que têm fila e a pessoa escolhida não é a primeira da fila
                        const queueWarnings = (cartPurpose === 'loan' && cartBorrowerId) ? cartGames.filter(g => g.status === 'available').map(g => {
                            const queue = getGameQueue(g.id);
                            if (queue.length === 0 || queue[0].personId === cartBorrowerId) return null;
                            const firstPerson = people.find(p => p.id === queue[0].personId);
                            return { gameId: g.id, gameTitle: g.title, firstPersonLabel: firstPerson ? getPersonLabel(firstPerson) : 'Alguém' };
                        }).filter(Boolean) : [];
                        const isInterest = cartPurpose === 'interest';

                        return (
                            <div className="fixed inset-0 z-[320] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm animate-fade-in no-print" onClick={() => setShowCartCheckout(false)}>
                                <div className="bg-white dark:bg-dark-card w-full max-w-md rounded-2xl shadow-2xl modal-content" onClick={e => e.stopPropagation()}>
                                    <div className={`p-4 border-b border-slate-100 dark:border-dark-border flex justify-between items-center shrink-0 ${isInterest ? 'bg-pink-50 dark:bg-slate-800' : 'bg-emerald-50 dark:bg-slate-800'}`}>
                                        <h3 className={`font-bold flex items-center gap-2 ${isInterest ? 'text-pink-900 dark:text-pink-400' : 'text-emerald-900 dark:text-emerald-400'}`}>
                                            {isInterest ? <Icons.Heart size={18}/> : <Icons.ShoppingCart size={18}/>} {isInterest ? 'Registrar Interesse' : 'Finalizar Empréstimo'} ({cartGames.length})
                                        </h3>
                                        <button onClick={() => setShowCartCheckout(false)} className="dark:text-white" title="Fechar"><Icons.X/></button>
                                    </div>
                                    <div className="p-5 modal-scroll space-y-4">
                                        <div>
                                            <p className="text-xs font-bold text-slate-500 dark:text-dark-muted uppercase mb-2">Jogos no carrinho</p>
                                            <div className="space-y-1.5 max-h-40 overflow-y-auto">
                                                {cartGames.map(g => (
                                                    <div key={g.id} className="flex items-center gap-2 bg-slate-50 dark:bg-slate-800 p-2 rounded-lg">
                                                        <div className="w-8 h-8 rounded bg-slate-200 dark:bg-slate-700 overflow-hidden shrink-0"><img src={getOptimizedImage(g.image, 60, 60)} className="w-full h-full object-cover" onError={handleThumbImageError(g.image)}/></div>
                                                        <span className="flex-1 text-sm font-bold text-slate-700 dark:text-dark-text truncate">{g.title}</span>
                                                        {g.status === 'loaned' && <span className="text-[9px] font-bold text-amber-600 bg-amber-50 dark:bg-amber-900/30 px-1.5 py-0.5 rounded uppercase shrink-0">Emprestado</span>}
                                                        <button onClick={() => removeFromCart(g.id)} className="text-slate-400 hover:text-red-500 shrink-0" title="Remover do carrinho"><Icons.X size={14}/></button>
                                                    </div>
                                                ))}
                                                {cartGames.length === 0 && <p className="text-sm text-slate-400 text-center py-4">Carrinho vazio.</p>}
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 dark:text-dark-muted uppercase mb-2 block">{isInterest ? 'Registrar interesse para:' : 'Emprestar para:'}</label>
                                            <select className="w-full px-4 h-10 text-sm rounded-xl border border-slate-200 dark:border-slate-600 outline-none bg-white dark:bg-slate-700 dark:text-white" value={cartBorrowerId} onChange={e => setCartBorrowerId(e.target.value)}>
                                                <option value="">Selecione uma pessoa...</option>
                                                {people.map(p => <option key={p.id} value={p.id}>{getPersonLabel(p)}</option>)}
                                            </select>
                                        </div>
                                        {!isInterest && (
                                            <div>
                                                <label className="text-xs font-bold text-slate-500 dark:text-dark-muted uppercase mb-2 block">Devolução Prevista (opcional, vale pra todos):</label>
                                                <input type="date" className="w-full px-4 h-10 text-sm rounded-xl border border-slate-200 dark:border-slate-600 outline-none bg-white dark:bg-slate-700 dark:text-white" value={cartDueDate} onChange={e => setCartDueDate(e.target.value)} />
                                            </div>
                                        )}
                                        {isInterest && (
                                            <p className="text-xs text-pink-700 dark:text-pink-300 bg-pink-50 dark:bg-pink-900/20 p-3 rounded-lg">Isso só adiciona a pessoa na fila de reserva de cada jogo selecionado — nenhum jogo é emprestado agora.</p>
                                        )}
                                        {queueWarnings.length > 0 && (
                                            <div className="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-900 rounded-lg p-3 text-xs text-amber-800 dark:text-amber-300 space-y-2">
                                                <p className="font-bold flex items-center gap-1"><Icons.Alert size={14}/> Esses jogos têm fila — o que fazer com cada um?</p>
                                                {!isLoggedIn && <p className="text-[11px] text-amber-700 dark:text-amber-400">Só o admin pode emprestar fora da ordem da fila. Sem login, dá pra colocar na fila ou ignorar.</p>}
                                                {queueWarnings.map(w => (
                                                    <div key={w.gameId} className="bg-white dark:bg-slate-800 rounded-lg p-2">
                                                        <p className="mb-1.5 text-slate-700 dark:text-slate-200">"<strong>{w.gameTitle}</strong>": {w.firstPersonLabel} é a próxima da fila.</p>
                                                        <div className="flex gap-1 bg-slate-100 dark:bg-slate-700 p-0.5 rounded-md">
                                                            {isLoggedIn ? (
                                                                <>
                                                                    <button onClick={() => setCartQueueChoices(prev => ({...prev, [w.gameId]: 'lend'}))} className={`flex-1 py-1.5 rounded text-[10px] font-bold transition-colors ${(cartQueueChoices[w.gameId] || 'lend') === 'lend' ? 'bg-white dark:bg-slate-600 text-slate-800 dark:text-white shadow-sm' : 'text-slate-500 dark:text-slate-400'}`} title="Emprestar esse jogo mesmo assim">Emprestar mesmo assim</button>
                                                                    <button onClick={() => setCartQueueChoices(prev => ({...prev, [w.gameId]: 'queue'}))} className={`flex-1 py-1.5 rounded text-[10px] font-bold transition-colors ${cartQueueChoices[w.gameId] === 'queue' ? 'bg-white dark:bg-slate-600 text-slate-800 dark:text-white shadow-sm' : 'text-slate-500 dark:text-slate-400'}`} title="Não emprestar esse jogo — só adicionar à fila">Ignorar (só entra na fila)</button>
                                                                </>
                                                            ) : (
                                                                <>
                                                                    <button onClick={() => setCartQueueChoices(prev => ({...prev, [w.gameId]: 'queue'}))} className={`flex-1 py-1.5 rounded text-[10px] font-bold transition-colors ${(cartQueueChoices[w.gameId] || 'queue') === 'queue' ? 'bg-white dark:bg-slate-600 text-slate-800 dark:text-white shadow-sm' : 'text-slate-500 dark:text-slate-400'}`} title="Não emprestar — colocar essa pessoa na fila desse jogo">Ignorar e entrar na fila</button>
                                                                    <button onClick={() => setCartQueueChoices(prev => ({...prev, [w.gameId]: 'skip'}))} className={`flex-1 py-1.5 rounded text-[10px] font-bold transition-colors ${cartQueueChoices[w.gameId] === 'skip' ? 'bg-white dark:bg-slate-600 text-slate-800 dark:text-white shadow-sm' : 'text-slate-500 dark:text-slate-400'}`} title="Não emprestar nem colocar na fila desse jogo">Ignorar</button>
                                                                </>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                        {people.length === 0 && <p className="text-xs text-red-500 cursor-pointer hover:underline" onClick={() => { setShowCartCheckout(false); setShowPeopleManager(true); }}>Nenhuma pessoa cadastrada. Clique aqui para adicionar.</p>}
                                    </div>
                                    <div className="p-4 bg-white dark:bg-dark-card border-t border-slate-200 dark:border-dark-border flex gap-3 shrink-0 rounded-b-2xl">
                                        <button onClick={() => setShowCartCheckout(false)} className="flex-1 text-sm text-slate-500 dark:text-dark-muted font-bold py-3 hover:text-slate-700 dark:hover:text-slate-300 transition-colors" title="Voltar sem confirmar">Voltar</button>
                                        <button onClick={confirmCartCheckout} disabled={cartGames.length === 0} className={`flex-1 disabled:opacity-40 text-white font-bold py-3 rounded-xl text-sm transition-colors ${isInterest ? 'bg-pink-600 hover:bg-pink-700' : 'bg-emerald-600 hover:bg-emerald-700'}`} title="Confirmar o carrinho">{isInterest ? 'Confirmar Interesse' : 'Confirmar Empréstimo'}</button>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* MODAL: COBRAR ATRASADOS */}
                    {showOverdueModal && (
                        <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm animate-fade-in no-print" onClick={() => setShowOverdueModal(false)}>
                            <div className="bg-white dark:bg-dark-card w-full max-w-lg rounded-2xl shadow-2xl modal-content" onClick={e => e.stopPropagation()}>
                                <div className="p-4 border-b border-slate-100 dark:border-dark-border flex justify-between items-center bg-red-50 dark:bg-red-900/20 shrink-0">
                                    <h3 className="font-bold text-red-800 dark:text-red-300 flex items-center gap-2"><Icons.Alert size={18}/> Jogos Atrasados ({overdueGames.length})</h3>
                                    <button onClick={() => setShowOverdueModal(false)} className="dark:text-white" title="Fechar"><Icons.X/></button>
                                </div>
                                <div className="p-4 modal-scroll space-y-2">
                                    <p className="text-xs text-slate-500 dark:text-dark-muted mb-2">O WhatsApp não permite disparar mensagens sozinho pelo navegador — clique em cada botão verde para abrir a conversa já com o texto pronto.</p>
                                    {overdueGames.length === 0 && <div className="text-center text-slate-400 text-sm py-6">Nenhum jogo atrasado no momento 🎉</div>}
                                    {overdueGames.map(game => {
                                        const phone = getPersonPhone(game);
                                        const days = daysOverdue(game.loanDueDate);
                                        return (
                                            <div key={game.id} className="flex items-center justify-between gap-3 p-3 bg-red-50/50 dark:bg-slate-800 border border-red-100 dark:border-slate-700 rounded-xl">
                                                <div className="min-w-0">
                                                    <p className="font-bold text-sm text-slate-800 dark:text-dark-text truncate">{game.title}</p>
                                                    <p className="text-xs text-slate-500 dark:text-dark-muted truncate">{game.borrower} · {days} dia{days !== 1 ? 's' : ''} de atraso{!phone && ' · sem telefone salvo'}</p>
                                                </div>
                                                <a href={buildWhatsAppLink(phone, buildReminderMessage(game))} target="_blank" rel="noreferrer" onClick={() => notify(`Cobrança aberta para ${game.borrower.split(' ')[0]}`)} className="bg-green-500 hover:bg-green-600 text-white p-2.5 rounded-lg shrink-0 shadow-sm transition-colors" title="Cobrar via WhatsApp">
                                                    <Icons.Whatsapp size={18}/>
                                                </a>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SETTINGS MODAL */}
                    {showSettings && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in" onClick={() => setShowSettings(false)}>
                            <div className="bg-white dark:bg-dark-card w-full max-w-md rounded-2xl shadow-2xl modal-content" onClick={e => e.stopPropagation()}>
                                <div className="p-4 border-b border-slate-100 dark:border-dark-border flex justify-between items-center bg-slate-50 dark:bg-slate-800 shrink-0"><h2 className="text-xl font-bold text-slate-800 dark:text-dark-text">Gerenciamento</h2><button onClick={() => setShowSettings(false)} className="dark:text-white" title="Fechar"><Icons.X/></button></div>
                                <div className="p-6 modal-scroll space-y-4">
                                    {/* STORAGE INDICATOR (3C) */}
                                    <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border border-slate-100 dark:border-slate-700">
                                        <div className="flex justify-between items-end mb-2">
                                            <h3 className="font-bold text-xs text-slate-500 dark:text-dark-muted uppercase">Armazenamento Local</h3>
                                            <span className="text-xs font-bold text-slate-700 dark:text-slate-300">{getStorageUsage()} MB / ~5.0 MB</span>
                                        </div>
                                        <div className="w-full bg-slate-200 dark:bg-slate-600 h-2 rounded-full overflow-hidden">
                                            <div className="bg-blue-500 h-full rounded-full" style={{ width: `${Math.min((getStorageUsage()/5)*100, 100)}%` }}></div>
                                        </div>
                                    </div>

                                    <div className="bg-indigo-50 dark:bg-slate-800 p-4 rounded-xl border border-indigo-100 dark:border-indigo-900">
                                        <h3 className="font-bold text-indigo-900 dark:text-indigo-400 mb-2 flex items-center gap-2"><Icons.CloudSync/> Cloud Sync (GitHub)</h3>
                                        <p className="text-sm text-indigo-700 dark:text-indigo-300 mb-1">Suas alterações são enviadas sozinhas para o GitHub poucos segundos depois de cada mudança, e o app confere a cada 20s se alguém mais atualizou algo.</p>
                                        <div className="flex items-center gap-2 mb-3 mt-2">
                                            <span className={`w-2 h-2 rounded-full shrink-0 ${getSyncStatusInfo().dot}`}></span>
                                            <span className={`text-xs font-bold ${getSyncStatusInfo().color}`}>{getSyncStatusInfo().text}</span>
                                        </div>
                                        <input className="w-full border border-indigo-200 dark:border-slate-600 rounded-lg p-2 text-sm mb-2 dark:bg-slate-700 dark:text-white" placeholder="Cole seu Token GitHub aqui" type="password" value={githubToken} onChange={e => setGithubToken(e.target.value)} />
                                        <button onClick={handleManualSync} disabled={syncStatus === 'syncing'} className="w-full bg-indigo-600 disabled:opacity-60 text-white font-bold py-2 rounded-lg text-sm hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2" title="Forçar sincronização agora">{syncStatus === 'syncing' ? <Icons.Loader/> : <Icons.CloudSync size={18}/>} Sincronizar agora</button>
                                    </div>
                                    <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border border-slate-100 dark:border-slate-700">
                                        <h3 className="font-bold text-slate-900 dark:text-dark-text mb-2 flex items-center gap-2"><Icons.Alert size={16}/> Notificações do Navegador</h3>
                                        <p className="text-xs text-slate-500 dark:text-dark-muted mb-3">Avisa quando um jogo emprestado está perto do vencimento ou já atrasado — funciona só enquanto esta aba estiver aberta neste dispositivo (não substitui uma notificação push de verdade, já que o site não tem servidor).</p>
                                        <label className="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" checked={notificationsEnabled} onChange={handleToggleNotifications} className="w-4 h-4"/>
                                            <span className="text-sm font-bold text-slate-700 dark:text-white">Ativar notificações de vencimento</span>
                                        </label>
                                        {notificationsEnabled && typeof window.Notification !== 'undefined' && window.Notification.permission !== 'granted' && (
                                            <p className="text-xs text-red-500 mt-2">Notificações bloqueadas pelo navegador. Habilite o site nas configurações de notificação do navegador pra este recurso funcionar.</p>
                                        )}
                                    </div>
                                    <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-xl border border-slate-100 dark:border-slate-700">
                                        <h3 className="font-bold text-slate-900 dark:text-dark-text mb-2">Backup Local (Arquivo)</h3>
                                        <p className="text-xs text-slate-500 dark:text-dark-muted mb-2">
                                            {lastManualBackupAt ? `Último backup manual: ${new Date(lastManualBackupAt).toLocaleDateString('pt-BR')} às ${new Date(lastManualBackupAt).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}.` : 'Você ainda não fez nenhum backup manual.'}
                                        </p>
                                        {(lastManualBackupAt === null || Math.floor((Date.now() - lastManualBackupAt) / (1000*60*60*24)) >= 14) && (
                                            <div className="bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-900 rounded-lg p-3 mb-3 text-xs text-amber-800 dark:text-amber-300 flex items-start gap-2">
                                                <Icons.Alert size={14} className="shrink-0 mt-0.5"/>
                                                <span>{lastManualBackupAt === null ? 'Você ainda não tem nenhum backup local salvo. ' : `Já se passaram ${Math.floor((Date.now() - lastManualBackupAt) / (1000*60*60*24))} dias desde o último backup manual. `}A sincronização automática é a proteção principal, mas um backup local extra ajuda caso ela falhe silenciosamente por algum motivo.</span>
                                            </div>
                                        )}

                            if (g.status !== 'loaned' || !g.loanDueDate) return false;
                            const due = parseDate(g.loanDueDate);
